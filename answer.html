<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3AL BALCON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --tc: #00EFFF; }
body { font-family:'Cairo',sans-serif; color:#fff; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; gap:18px; background:#060d1f; background-size:cover; background-position:center; }
.overlay { position:fixed; inset:0; background:rgba(6,13,31,0.83); z-index:0; }
.content { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; max-width:380px; }
.logo { font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:3px; }
.badge { padding:10px 32px; border-radius:100px; font-size:20px; font-weight:900; border:2px solid var(--tc); color:var(--tc); background:rgba(0,0,0,0.4); text-align:center; box-shadow:0 0 20px color-mix(in srgb,var(--tc) 35%,transparent); }
.q-box { background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.15); border-radius:14px; padding:16px; font-size:18px; font-weight:700; text-align:center; line-height:1.5; width:100%; }
.waiting { font-size:15px; color:rgba(255,255,255,0.4); text-align:center; animation:pulse 2s infinite; }
.ans-input { width:100%; padding:16px; font-family:'Cairo',sans-serif; font-size:22px; font-weight:900; text-align:center; border-radius:14px; border:2px solid var(--tc); background:rgba(0,0,0,0.5); color:#fff; outline:none; }
.ans-input:focus { background:rgba(0,0,0,0.7); }
.submit-btn { width:100%; padding:18px; border-radius:14px; font-family:'Cairo',sans-serif; font-size:20px; font-weight:900; cursor:pointer; border:2px solid #39FF14; color:#39FF14; background:rgba(57,255,20,0.08); }
.submit-btn:active { background:rgba(57,255,20,0.2); transform:scale(0.97); }
.submit-btn:disabled { opacity:0.25; cursor:default; transform:none; }
.done-card { display:flex; flex-direction:column; align-items:center; gap:12px; padding:28px 24px; border-radius:20px; background:rgba(57,255,20,0.05); border:2px solid #39FF14; box-shadow:0 0 24px rgba(57,255,20,0.2); width:100%; text-align:center; }
.done-icon { font-size:60px; line-height:1; }
.done-title { font-size:24px; font-weight:900; color:#39FF14; text-shadow:0 0 12px rgba(57,255,20,0.6); }
.done-msg { font-size:14px; color:rgba(255,255,255,0.4); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="content">
  <div class="logo">3AL BALCON</div>
  <div class="badge" id="team-badge">...</div>
  <div class="waiting" id="state-waiting">⏳ انتظر بدء السؤال من المقدّم...</div>
  <div id="q-box" class="q-box" style="display:none"></div>
  <div id="input-section" style="display:none;flex-direction:column;gap:12px;width:100%">
    <input id="ans-input" class="ans-input" placeholder="أدخل جوابك هنا" inputmode="text" autocomplete="off" autocorrect="off">
    <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">✅ إرسال الجواب</button>
  </div>
  <div id="done-section" style="display:none">
    <div class="done-card">
      <div class="done-icon">✅</div>
      <div class="done-title" id="done-title">تم إرسال جوابك!</div>
      <div class="done-msg" id="done-msg">في انتظار الفريق الآخر...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyAY-zBQnRPTZLUDMCbod-NFkmuIG4W0XxE",
  authDomain:"al-balcon.firebaseapp.com",
  databaseURL:"https://al-balcon-default-rtdb.firebaseio.com",
  projectId:"al-balcon",
  storageBucket:"al-balcon.firebasestorage.app",
  messagingSenderId:"556294454945",
  appId:"1:556294454945:web:770c330e71a4e484277ae0"
};
const app = initializeApp(cfg);
const db = getDatabase(app);

const p = new URLSearchParams(location.search);
const roomId = p.get('r');
const team   = p.get('t');
const mode   = p.get('m') || 'number';
const session = p.get('s') || 'main';
const isA = team === 'a';

// ── Language ──
let _lang = 'ar';
const T = {
  ar: { loading:'جاري التحميل...', waitHost:'⏳ انتظر بدء السؤال من المقدّم...', submit:'✅ إرسال الجواب', sent:'تم إرسال جوابك!', waitOther:'في انتظار الفريق الآخر...', bothSent:'✅ كلا الفريقين أرسلا أجوبتهم!', phNum:'أدخل رقمك', phText:'أدخل جوابك هنا', teamA:'الفريق أ', teamB:'الفريق ب', badLink:'رابط غير صحيح' },
  en: { loading:'Loading...', waitHost:'⏳ Waiting for host to start...', submit:'✅ Submit Answer', sent:'Answer submitted!', waitOther:'Waiting for other team...', bothSent:'✅ Both teams submitted!', phNum:'Enter your number', phText:'Enter your answer', teamA:'Team A', teamB:'Team B', badLink:'Invalid link' }
};
function t(k){ return (T[_lang]||T.ar)[k]||T.ar[k]||k; }

function applyLang() {
  const isAr = _lang==='ar';
  document.documentElement.dir = isAr?'rtl':'ltr';
  document.documentElement.lang = isAr?'ar':'en';
  const inp = document.getElementById('ans-input');
  if (inp) inp.placeholder = mode==='number' ? t('phNum') : t('phText');
  const btn = document.getElementById('submit-btn');
  if (btn && !btn.disabled) btn.textContent = t('submit');
  document.getElementById('state-waiting').textContent = t('waitHost');
  document.getElementById('done-title').textContent = t('sent');
  document.getElementById('done-msg').textContent = t('waitOther');
  const badge = document.getElementById('team-badge');
  if (badge && badge.textContent === T[_lang==='ar'?'en':'ar'].loading) badge.textContent = t('loading');
}

// Team color
document.documentElement.style.setProperty('--tc', isA ? '#E50158' : '#E2DA51');

// Input mode
const input = document.getElementById('ans-input');
if (mode === 'number') {
  input.type = 'number'; input.inputMode = 'numeric';
  input.placeholder = t('phNum'); input.style.fontSize = '36px';
} else {
  input.type = 'text'; input.inputMode = 'text';
  input.placeholder = t('phText');
}

document.getElementById('team-badge').textContent = t('loading');

let submitted = false;
let _wallSet = false;

function applyWallpaper(url) {
  if (!url || _wallSet) return;
  _wallSet = true;
  document.body.style.backgroundImage = `url('${url}')`;
}

if (!roomId || !team) {
  document.getElementById('team-badge').textContent = t('badLink');
} else {
  const dbPath = mode === 'text' ? `cat6/${roomId}` : `closest/${roomId}`;
  update(ref(db, dbPath), { [`connected${isA?'A':'B'}`]: true });

  onValue(ref(db, dbPath), snap => {
    const d = snap.val(); if (!d) return;
    if (d.wallpaper) applyWallpaper(d.wallpaper);

    const name = isA ? d.teamA : d.teamB;
    document.getElementById('team-badge').textContent = name || (isA ? t('teamA') : t('teamB'));

    if (d.phase === 'waiting' && submitted) {
      submitted = false;
      document.getElementById('done-section').style.display = 'none';
      document.getElementById('state-waiting').style.display = 'block';
      document.getElementById('input-section').style.display = 'none';
      document.getElementById('q-box').style.display = 'none';
      input.value = '';
      input.disabled = false;
      input.placeholder = mode === 'number' ? t('phNum') : t('phText');
      document.getElementById('submit-btn').disabled = false;
    }

    if (d.phase === 'active' && !submitted) {
      document.getElementById('state-waiting').style.display = 'none';
      if (d.question) {
        document.getElementById('q-box').textContent = d.question;
        document.getElementById('q-box').style.display = 'block';
      }
      document.getElementById('input-section').style.display = 'flex';

      // Enforce timer — disable input when time is up
      if (d.timerEnd) {
        const remaining = d.timerEnd - Date.now();
        if (remaining <= 0) {
          // Time already up — disable input
          document.getElementById('submit-btn').disabled = true;
          input.disabled = true;
          input.placeholder = _lang === 'ar' ? 'انتهى الوقت!' : 'Time\'s up!';
        } else {
          // Set a timeout to disable when time runs out
          setTimeout(() => {
            if (!submitted) {
              document.getElementById('submit-btn').disabled = true;
              input.disabled = true;
              input.placeholder = _lang === 'ar' ? 'انتهى الوقت!' : 'Time\'s up!';
            }
          }, remaining);
        }
      }
    }

    if (submitted) {
      const bothDone = d[`answer${isA?'A':'B'}`] && d[`answer${isA?'B':'A'}`];
      document.getElementById('done-msg').textContent = bothDone ? t('bothSent') : t('waitOther');
    }
  });
}

window.submitAnswer = function() {
  const val = input.value.trim();
  if (!val || submitted) return;
  submitted = true;
  const dbPath = mode === 'text' ? `cat6/${roomId}` : `closest/${roomId}`;
  update(ref(db, dbPath), {
    [`answer${isA?'A':'B'}`]: val,
    [`answeredAt${isA?'A':'B'}`]: Date.now()
  });
  document.getElementById('input-section').style.display = 'none';
  document.getElementById('done-section').style.display = 'block';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('done-title').textContent = t('sent');
  document.getElementById('done-msg').textContent = t('waitOther');
};

// Listen for lang from main game
onValue(ref(db, `sessions/${session}/lang`), snap => {
  const l = snap.val();
  if (l && l !== _lang) { _lang = l; applyLang(); }
});

// ── Shutdown: when main game closes, show waiting background ──
onValue(ref(db, `sessions/${session}/shutdown`), snap => {
  if (!snap.val()) return;
  document.body.style.backgroundImage = document.body.style.backgroundImage || '';
  // Fade out all content
  document.querySelectorAll('.content, #ph-waiting, #ph-ready, #ph-countdown, #ph-bidding, #ph-answering, #ph-logo').forEach(el => {
    if (el) el.style.opacity = '0';
  });
  // Show full-screen waiting background
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#060d1f;background-size:cover;background-position:center;transition:opacity 0.5s';
  if (document.body.style.backgroundImage) overlay.style.backgroundImage = document.body.style.backgroundImage;
  const logo = document.createElement('div');
  logo.style.cssText = 'font-family:Cairo,sans-serif;font-size:clamp(36px,10vw,72px);font-weight:900;color:#FAC70A;text-shadow:0 0 30px rgba(250,199,10,0.6),0 0 60px rgba(250,199,10,0.3);letter-spacing:4px;animation:pulse 2s infinite;text-align:center';
  logo.textContent = '3AL BALCON';
  overlay.appendChild(logo);
  document.body.appendChild(overlay);
});

</script>
</body>
</html>
