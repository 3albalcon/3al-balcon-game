<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3AL BALCON — Game Show Night!</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-pink: #FF2D78;
  --neon-cyan: #00EFFF;
  --neon-yellow: #FFE600;
  --neon-green: #39FF14;
  --neon-red: #FF2D2D;
  --neon-blue: #3B9EFF;
  --gold: #FFE600;
  --gold2: #FFC800;
  --dark: #0a1628;
  --dark2: rgba(0,0,40,0.55);
  --dark3: rgba(0,10,50,0.8);
  --text: #FFFFFF;
  --text2: #c8e0ff;
  --glow-pink: 0 0 12px #FF2D78, 0 0 30px rgba(255,45,120,0.5);
  --glow-cyan: 0 0 12px #00EFFF, 0 0 30px rgba(0,239,255,0.4);
  --glow-yellow: 0 0 12px #FFE600, 0 0 30px rgba(255,230,0,0.4);
  --glow-green: 0 0 12px #39FF14, 0 0 30px rgba(57,255,20,0.4);
  --glow-red: 0 0 12px #FF2D2D, 0 0 30px rgba(255,45,45,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

html {
  height: -webkit-fill-available;
}
body {
  font-family: 'Cairo', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  touch-action: pan-y;
}

/* ── CUSTOM BACKGROUND IMAGE ── */
#bg-image-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 0.5s;
}
#bg-image-layer.active {
  opacity: 1;
}
/* ── BRICK WALL BACKGROUND ── */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.stars::before {
  content:''; position:absolute; inset:0;
  background-color: #0d1f3c;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 30px,
      rgba(0,0,0,0.35) 30px,
      rgba(0,0,0,0.35) 34px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 59px,
      rgba(0,0,0,0.25) 59px,
      rgba(0,0,0,0.25) 62px
    );
  background-size: 62px 34px;
}
.stars::after {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 15% 50%, rgba(0,80,200,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 50%, rgba(0,50,180,0.45) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 0%, rgba(0,100,255,0.3) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, rgba(0,20,100,0.6) 0%, transparent 50%);
}

/* ── SCREENS ── */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
  transition: opacity 0.5s, transform 0.5s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  height: 100vh;
  height: 100dvh;
  height: -webkit-fill-available;
}
.screen.hidden { opacity:0; pointer-events:none; transform: scale(0.97); }

/* ── SETUP SCREEN ── */
#setup-screen {
  gap: 24px;
  justify-content: center;
  padding-top: 40px;
  padding-bottom: 40px;
}
.show-logo {
  text-align: center;
  margin-bottom: 8px;
}
.show-logo .en-title {
  font-family: 'Cairo', sans-serif;
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 900;
  color: var(--neon-yellow);
  text-shadow: var(--glow-yellow);
  letter-spacing: 4px;
  line-height: 1.1;
}
.show-logo .ar-title {
  font-size: clamp(18px, 3vw, 28px);
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  font-weight: 700;
}
.show-logo .subtitle {
  font-size: clamp(12px, 2vw, 16px);
  color: var(--neon-pink);
  text-shadow: var(--glow-pink);
  letter-spacing: 2px;
  margin-top: 4px;
}

.setup-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 900px;
}

.setup-card {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-pink);
  box-shadow: var(--glow-pink), inset 0 0 20px rgba(255,45,120,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.setup-card:hover { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); }
.setup-card h3 {
  font-size: 15px; font-weight: 700;
  color: var(--neon-yellow);
  text-shadow: var(--glow-yellow);
  display: flex; align-items: center; gap: 8px;
}
.setup-card .icon { font-size: 20px; }
.setup-card p { font-size: 12px; color: var(--text2); line-height: 1.5; }

.upload-btn {
  background: rgba(0,239,255,0.08);
  border: 2px dashed var(--neon-cyan);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Cairo', sans-serif;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  font-size: 13px;
  font-weight: 600;
}
.upload-btn:hover { background: rgba(0,239,255,0.18); box-shadow: var(--glow-cyan); }
.upload-btn input { display: none; }

.upload-status {
  font-size: 12px;
  color: var(--neon-green);
  text-shadow: var(--glow-green);
  text-align: center;
  min-height: 16px;
}

.team-inputs {
  display: flex; gap: 10px; flex-direction: column;
}
.team-input {
  background: rgba(0,0,50,0.5);
  border: 2px solid var(--neon-pink);
  box-shadow: var(--glow-pink);
  border-radius: 8px;
  padding: 10px 14px;
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-size: 18px;
  font-weight: 700;
  width: 100%;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.team-input:focus { border-color: var(--neon-yellow); box-shadow: var(--glow-yellow); }
[contenteditable][data-placeholder]:empty:before {
  content: attr(data-placeholder);
  color: rgba(200,224,255,0.4);
  pointer-events: none;
}

.questions-textarea {
  background: rgba(0,0,50,0.5);
  border: 2px solid rgba(0,239,255,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  width: 100%;
  text-align: right;
  outline: none;
  resize: vertical;
  min-height: 80px;
  transition: border-color 0.2s;
}
.questions-textarea:focus { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); }
.questions-textarea::placeholder { color: rgba(200,224,255,0.4); }

.start-btn {
  background: rgba(57,255,20,0.2);
  color: var(--neon-green);
  border: 3px solid var(--neon-green);
  box-shadow: var(--glow-green), inset 0 0 20px rgba(57,255,20,0.1);
  border-radius: 14px;
  padding: 16px 48px;
  font-family: 'Cairo', sans-serif;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  text-shadow: var(--glow-green);
  transition: all 0.2s;
  letter-spacing: 2px;
}
.start-btn:hover { background: rgba(57,255,20,0.15); transform: scale(1.04); box-shadow: 0 0 40px rgba(57,255,20,0.7), inset 0 0 30px rgba(57,255,20,0.2); }

/* ── MAIN MENU ── */
#menu-screen {
  gap: 20px;
  justify-content: flex-start;
  align-items: center;
  padding-top: 60px;
  padding-bottom: 40px;
  text-align: center;
}
.menu-logo { text-align: center; }
.menu-logo .big { font-size: clamp(32px, 6vw, 64px); font-weight: 900; color: var(--neon-yellow); text-shadow: var(--glow-yellow); letter-spacing: 6px; }
.menu-logo .small { font-size: clamp(14px, 2.5vw, 22px); color: var(--neon-cyan); text-shadow: var(--glow-cyan); font-weight: 600; }

.scoreboard {
  display: flex; gap: 40px; align-items: center;
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-cyan);
  box-shadow: var(--glow-cyan);
  border-radius: 20px;
  padding: 20px 40px;
}
.team-score { text-align: center; }
.team-score .name { font-size: 48px; font-weight: 900; }
.team-score .score {
  font-size: clamp(45px, 6.25vw, 70px);
  font-weight: 900;
  color: #fff;
  line-height: 1;
  text-shadow: 0 0 20px #fff;
}
.vs { font-size: 30px; color: var(--text2); font-weight: 900; }

.rounds-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  max-width: 900px;
  width: 100%;
}
.round-btn {
  background: rgba(0,10,50,0.5);
  border: 2px solid var(--neon-pink);
  box-shadow: var(--glow-pink);
  border-radius: 14px;
  padding: 18px 14px;
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
}
.round-btn:hover { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); transform: translateY(-3px); }
.round-btn .rnum { font-size: 13.75px; color: var(--neon-yellow); text-shadow: var(--glow-yellow); font-weight: 700; margin-bottom: 4px; }
.round-btn .rname { font-size: 25px; font-weight: 700; line-height: 1.3; color: #fff; }
.round-btn .rpoints { display: none; }
.round-btn.done { border-color: var(--neon-green); box-shadow: var(--glow-green); }
.round-btn.done .rnum { color: var(--neon-green); text-shadow: var(--glow-green); }

/* ── GAME SCREEN ── */
#game-screen { padding: 0; }

.game-header {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  background: rgba(0,10,40,0.85);
  border-bottom: 2px solid var(--neon-cyan);
  box-shadow: 0 2px 20px rgba(0,239,255,0.3);
  z-index: 20;
}
.game-header .round-title { font-size: clamp(14px, 2.5vw, 20px); font-weight: 900; color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
.game-scores {
  display: flex; gap: 20px; align-items: center;
}
.gs-team { text-align: center; }
.gs-team .gs-name { font-size: 11px; color: var(--text2); }
.gs-team .gs-score { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 12px #fff; line-height: 1; }
.gs-vs { font-size: 14px; color: var(--text2); }

.back-btn {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-pink);
  box-shadow: var(--glow-pink);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  color: var(--neon-pink);
  text-shadow: var(--glow-pink);
  font-size: 13px;
  font-weight: 700;
  transition: all 0.2s;
}
.back-btn:hover { background: rgba(255,45,120,0.15); }

/* ── SLIDE AREA ── */
.slide-area {
  position: absolute;
  top: 72px; right: 0; bottom: 0; left: 0; /* fallback for old TV browsers that don't support inset */
  inset: 72px 0 0 0;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: flex-start; justify-content: flex-start;
  padding: 40px 20px 40px 20px;
  gap: 20px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  box-sizing: border-box;
}

/* RULES SLIDE */
.rules-card {
  background: rgba(0,10,50,0.6);
  border: 3px solid var(--neon-green);
  box-shadow: var(--glow-green), inset 0 0 30px rgba(57,255,20,0.05);
  border-radius: 20px;
  padding: 28px 36px;
  max-width: 700px;
  width: 100%;
  text-align: right;
}
.rules-card h2 { font-size: clamp(18px, 2.5vw, 26px); font-weight: 900; color: var(--neon-green); text-shadow: var(--glow-green); margin-bottom: 16px; text-align: center; }
.rules-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.rules-list li {
  background: rgba(57,255,20,0.06);
  border: 1px solid rgba(57,255,20,0.2);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: clamp(12px, 1.4vw, 15px);
  font-weight: 700;
  color: #d0ffb0;
  display: flex; align-items: center; gap: 10px;
  direction: inherit;
  text-align: start;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rules-list .rule-icon { font-size: 16px; flex-shrink: 0; }

/* QUESTION SLIDE */
.question-container {
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
  width: 100%; max-width: 900px;
}

.question-number {
  font-size: 14px; color: var(--text2); font-weight: 700;
  letter-spacing: 2px;
}

.image-reveal {
  position: relative;
  width: min(360px, 75vw);
  aspect-ratio: 1;
  border-radius: 4px;
  overflow: hidden;
  border: 10px solid #c8960c;
  outline: 3px solid #8B6914;
  box-shadow: 0 0 0 4px #c8960c, 0 8px 40px rgba(0,0,0,0.7), inset 0 0 0 2px #FFD700;
  cursor: pointer;
  background: #1a1a2e;
}
.image-reveal img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: filter 0.8s;
}
.image-reveal.blurred img { filter: blur(20px) brightness(0.2); }
.image-reveal .reveal-hint {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--neon-yellow); font-weight: 900;
  text-shadow: var(--glow-yellow);
  transition: opacity 0.3s;
}
.image-reveal.blurred .reveal-hint { opacity: 1; }
.image-reveal:not(.blurred) .reveal-hint { opacity: 0; }

.question-text-box {
  background: rgba(0,10,50,0.6);
  border: 3px solid var(--neon-cyan);
  box-shadow: var(--glow-cyan), inset 0 0 20px rgba(0,239,255,0.05);
  border-radius: 16px;
  padding: 24px 36px;
  font-size: clamp(18px, 3vw, 28px);
  font-weight: 900;
  text-align: center;
  width: 100%;
  max-width: 700px;
  min-height: 80px;
  display: flex; align-items: center; justify-content: center;
  line-height: 1.4;
  color: #fff;
}

.answer-reveal-btn {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-yellow);
  box-shadow: var(--glow-yellow);
  border-radius: 12px;
  padding: 12px 32px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  color: var(--neon-yellow);
  text-shadow: var(--glow-yellow);
  font-size: 15px;
  font-weight: 700;
  transition: all 0.2s;
}
.answer-reveal-btn:hover { background: rgba(255,230,0,0.15); }

.answer-box {
  background: #FAC70A;
  border: 2px solid #FAC70A;
  box-shadow: 0 0 20px rgba(250,199,10,0.4);
  border-radius: 12px;
  padding: 14px 28px;
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 900;
  color: #060d1f;
  text-shadow: none;
  text-align: center;
  min-width: 200px;
  transition: all 0.3s;
}

/* SCORE PANEL */
.score-panel {
  display: flex; gap: 12px; align-items: center;
  background: rgba(0,10,50,0.7);
  border: 2px solid var(--neon-cyan);
  box-shadow: var(--glow-cyan);
  border-radius: 16px;
  padding: 14px 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.sp-team { display: flex; align-items: center; gap: 10px; }
.sp-name { font-size: 14px; font-weight: 700; color: var(--text2); }
.sp-score { font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 0 16px #fff; min-width: 44px; text-align: center; }
.sp-btn {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: 2px solid;
  cursor: pointer;
  font-size: 18px;
  font-weight: 900;
  font-family: 'Cairo', sans-serif;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
}
.sp-btn.plus { border-color: var(--neon-green); color: var(--neon-green); box-shadow: var(--glow-green); }
.sp-btn.plus:hover { background: rgba(57,255,20,0.2); transform: scale(1.1); }
.sp-btn.minus { border-color: var(--neon-red); color: var(--neon-red); box-shadow: var(--glow-red); }
.sp-btn.minus:hover { background: rgba(255,45,45,0.2); transform: scale(1.1); }
.sp-divider { width: 1px; height: 40px; background: rgba(0,239,255,0.3); margin: 0 8px; }

/* TIMER */
.timer-display {
  position: relative;
  width: 160px; height: 160px;
}
.timer-circle { transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: rgba(0,239,255,0.15); stroke-width: 8; }
.timer-fill {
  fill: none;
  stroke: var(--neon-cyan);
  stroke-width: 8;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--neon-cyan));
  transition: stroke-dashoffset 1s linear, stroke 0.5s;
}
.timer-number {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
}
.timer-number.urgent { color: var(--neon-red); text-shadow: var(--glow-red); animation: pulse 0.5s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

.timer-btn {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-cyan);
  box-shadow: var(--glow-cyan);
  border-radius: 10px;
  padding: 10px 24px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  font-size: 15px;
  font-weight: 700;
  transition: all 0.2s;
}
.timer-btn:hover { background: rgba(0,239,255,0.15); }

/* NAV BUTTONS */
.nav-btns {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  width: 100%; padding: 8px 0;
}
.nav-btn {
  background: rgba(0,10,50,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 10px 24px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.2s;
}
.nav-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
.nav-btn.primary {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-green);
  box-shadow: var(--glow-green);
  color: var(--neon-green);
  text-shadow: var(--glow-green);
  font-size: clamp(20px, 3vw, 32px);
  padding: 18px 60px;
  min-width: 280px;
  letter-spacing: 1px;
}
.nav-btn.primary:hover { background: rgba(57,255,20,0.15); transform: scale(1.03); }

/* BIDDING */
.bidding-panel {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center;
}
.bid-team {
  background: rgba(0,10,50,0.6);
  border: 2px solid var(--neon-pink);
  box-shadow: var(--glow-pink);
  border-radius: 14px;
  padding: 16px 24px;
  text-align: center;
  min-width: 160px;
}
.bid-team .bt-name { font-size: 13px; color: var(--text2); font-weight: 700; margin-bottom: 8px; }
.bid-value { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 0 16px #fff; }
.bid-controls { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.bid-btn {
  width: 40px; height: 40px; border-radius: 8px; border: 2px solid;
  cursor: pointer; font-size: 18px; font-weight: 900;
  font-family: 'Cairo', sans-serif; transition: all 0.15s; background: transparent;
}
.bid-btn.up { border-color: var(--neon-green); color: var(--neon-green); }
.bid-btn.up:hover { background: rgba(57,255,20,0.2); }
.bid-btn.down { border-color: var(--neon-red); color: var(--neon-red); }
.bid-btn.down:hover { background: rgba(255,45,45,0.2); }
.winner-btn {
  background: transparent;
  border: 2px solid var(--neon-yellow);
  box-shadow: var(--glow-yellow);
  border-radius: 10px;
  padding: 10px 20px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  color: var(--neon-yellow); text-shadow: var(--glow-yellow);
  font-size: 13px; font-weight: 900;
  margin-top: 10px; width: 100%;
  transition: all 0.2s;
}
.winner-btn:hover { background: rgba(255,230,0,0.15); }

/* RESULT SCREEN */
.result-card {
  background: rgba(0,10,50,0.7);
  border: 3px solid var(--neon-yellow);
  box-shadow: var(--glow-yellow), inset 0 0 40px rgba(255,230,0,0.05);
  border-radius: 24px;
  padding: 40px 60px;
  text-align: center;
}
.result-card h2 { font-size: clamp(20px, 3vw, 28px); color: var(--neon-green); text-shadow: var(--glow-green); margin-bottom: 20px; font-weight: 900; }

  margin-bottom: 24px;
}

.rs-name { font-size: 16px; color: var(--text2); font-weight: 700; }
.rs-score { font-size: clamp(48px, 7vw, 80px); font-weight: 900; color: #fff; text-shadow: 0 0 30px #fff; }
.rs-vs { font-size: 28px; color: var(--text2); font-weight: 900; }
.rs-winner { font-size: clamp(16px, 2.5vw, 22px); color: var(--neon-green); text-shadow: var(--glow-green); font-weight: 900; margin-bottom: 20px; }



/* MEDIA PLAYER */
.media-player {

  box-shadow: var(--glow-cyan);
  border-radius: 16px;

}

  box-shadow: var(--glow-yellow);

  color: var(--neon-yellow);

}

.media-name { font-size: 14px; font-weight: 700; color: #fff; }

/* SECTION TITLE SLIDE */
.section-title-slide {
  text-align: center;

  align-items: center; justify-content: center;
  gap: 20px;
  width: 100%;
  min-height: calc(100vh - 120px);
  overflow: hidden;
}
.section-title-slide .big-number {

  color: rgba(0,239,255,0.07);

  position: absolute;
}

/* AUDIO INDICATOR */
.audio-indicator {

}
.audio-bar {

}
.audio-bar:nth-child(2) { animation-delay: 0.1s; }
.audio-bar:nth-child(3) { animation-delay: 0.2s; }
.audio-bar:nth-child(4) { animation-delay: 0.15s; }
.audio-bar:nth-child(5) { animation-delay: 0.05s; }
@keyframes audio-bounce {
  0%,100% { height: 6px; }
  50% { height: 20px; }
}

/* TOAST */
.toast {
  position: fixed; top: 90px; left: 50%; transform: translateX(-50%);

  border: 2px solid var(--neon-yellow);
  box-shadow: var(--glow-yellow);
  border-radius: 12px;
  padding: 12px 28px;

  color: var(--neon-yellow);
  text-shadow: var(--glow-yellow);

  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* QUESTION GRID (for image rounds) */
.q-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 700px;
}
.q-grid-btn {

/* CLOSE GUESS */

/* ANIMATIONS */
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

@keyframes slideIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }

        const text = await res.text();
        return { key, text };
      } catch(e) { return { key, text: null }; }
    });
    const results = await Promise.all(fetches);
    if (loadGen && loadGen < _driveLoadGen) return false;
    const csvData = {};
    results.forEach(({ key, text }) => { if (text) csvData[key] = text; });
    if (Object.keys(csvData).length > 0) {
      await loadCSVData(csvData, '', loadGen);
      return true;
    }
    return false;
  } catch(e) { return false; }
}

async function applyEventCode() {

  if (!code) {

async function fetchWithRetry(url, options = {}, retries = 3, delay = 2000) {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url, { redirect: 'follow', ...options });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res;
    } catch(err) {
      if (i < retries - 1) {
        setLoadProgress(0);
        document.getElementById('auto-load-status') && (
          document.getElementById('auto-load-status').querySelector('div').textContent = `⏳ محاولة ${i + 2} من ${retries}...`
        );
        await new Promise(r => setTimeout(r, delay));
      } else {
        throw err;
      }
    }
  }
}

let _driveLoadGen = 0; // increments on each load — stale loads are ignored

async function loadFromDrive(urlOverride) {
  const myGen = ++_driveLoadGen;
  const url = urlOverride || DRIVE_SCRIPT_URL;
  if (!url) return;

  const code = (window._eventCode || '').trim().toUpperCase();

  try {
    if (!code) {
      // ── DEFAULT GAME: Load CSVs from GitHub (fast!) + images from Drive ──
      const [githubOk] = await Promise.all([
        loadCSVsFromGitHub(myGen),  // instant from GitHub CDN
        (async () => {
          // Still need Drive for images list
          const listUrl = `${url}?action=list&t=${Date.now()}`;
          try {
            const res  = await fetchWithRetry(listUrl);
            const text = await res.text();
            const data = JSON.parse(text);
            if (data.error) return;
            if (myGen < _driveLoadGen) return;
            // Process images and videos only
            const images = shuffle([...data.images]);
            const videos = shuffle([...data.videos]);
            processImagesAndVideos(url, images, videos, code, myGen, data);
          } catch(e) {}
        })()
      ]);
      setLoadProgress(100);
      setTimeout(() => updateDataStatus(), 100);
      return;
    }

    // ── EVENT GAME: Everything from Apps Script ──
    const listUrl = `${url}?action=list&t=${Date.now()}&code=${encodeURIComponent(code)}`;
    const csvUrl  = `${url}?action=listcsv&t=${Date.now()}&code=${encodeURIComponent(code)}`;

    const csvPromise = fetch(csvUrl, { redirect: 'follow' })
      .then(r => r.json()).catch(() => null);

    const res  = await fetchWithRetry(listUrl);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch(e) { throw new Error(`الرد غير صالح\n${text.substring(0,200)}`); }
    if (data.error) throw new Error(data.error);

    try {
      const csvData = await csvPromise;
      if (csvData && !csvData.error && Object.keys(csvData).length > 0) {
        data.csvData = csvData;
      } else {
        try {
          const csvRetry = await fetch(`${url}?action=listcsv&nocache=true&t=${Date.now()}&code=${encodeURIComponent(code)}`, { redirect: 'follow' });
          const csvRetryData = await csvRetry.json();
          if (csvRetryData && !csvRetryData.error && Object.keys(csvRetryData).length > 0) {
            data.csvData = csvRetryData;
          }
        } catch(e2) {}
      }
    } catch(e) {}

    if (data.eventName) {
      window._eventName = data.eventName;
      const statusEl = document.getElementById('event-code-status');
      if (statusEl) { statusEl.textContent = `✅ ${data.eventName}`; statusEl.style.color = '#39FF14'; }
    }

    const images = shuffle([...data.images]);
    const videos = shuffle([...data.videos]);

    const codeAtLoadTime = code;
    if (data.csvData && Object.keys(data.csvData).length > 0) {
      setLoadProgress(30);
      await loadCSVData(data.csvData, codeAtLoadTime, myGen);
    } else if (data.csvFiles && Object.keys(data.csvFiles).length > 0) {
      setLoadProgress(30);
      await loadCSVFiles(data.csvFiles, codeAtLoadTime, myGen);
    }

    processImagesAndVideos(url, images, videos, code, myGen, data);
    setLoadProgress(100);
    setTimeout(() => updateDataStatus(), 100);

  } catch(err) {
    setTimeout(() => loadFromDrive(DRIVE_SCRIPT_URL), 3000);
  }
}

        try {
          const res = await fetch(`${url}?action=file&id=${item.id}&t=${Date.now()}`);
          const d2 = await res.json();
          if (d2.data) {
            const bytes = Uint8Array.from(atob(d2.data), c => c.charCodeAt(0));

            item.url = URL.createObjectURL(blob);

      })).then(() => { updateDataStatus(); });
    } else {

        url: f.url || `https://drive.google.com/thumbnail?id=${f.id}&sz=w800`,

      }
      setTimeout(() => { imageItems.forEach(item => { const img = new Image(); img.src = item.url; }); }, 500);
    }

  // Waiting screen / wallpaper
  if (data.waitingScreen) {

      const fbRef = window._fbRef;

        update(fbRef(window._fbDb, `rooms/${cat3RoomId}`), { waitingScreenUrl: G.waitingScreenUrl });
      });
    }
  }
  if (data.hostWallpaper) G.hostWallpaperUrl = data.hostWallpaper.url;

  // Audio — pre-fetch as blob URLs at load time for instant playback
  if (data.winnerSong) {
    G.winnerSongId = data.winnerSong.id;
    G.winnerSongScriptUrl = url;
    // Pre-fetch in background
    fetch(`${url}?action=file&id=${data.winnerSong.id}&t=${Date.now()}`, { redirect: 'follow' })
      .then(r => r.json())
      .then(d => {
        if (d.data) {
          const bytes = Uint8Array.from(atob(d.data), c => c.charCodeAt(0));
          const blob = new Blob([bytes], { type: d.mimeType || 'audio/mpeg' });
          G.winnerSongUrl = URL.createObjectURL(blob);
        }
      }).catch(() => {});
  }
  if (data.jingle) {
    G.jingleDriveId = data.jingle.id;
    G.jingleScriptUrl = url;
    // Pre-fetch in background
    fetch(`${url}?action=file&id=${data.jingle.id}&t=${Date.now()}`, { redirect: 'follow' })
      .then(r => r.json())
      .then(d => {
        if (d.data) {
          const bytes = Uint8Array.from(atob(d.data), c => c.charCodeAt(0));
          const blob = new Blob([bytes], { type: d.mimeType || 'audio/mpeg' });
          G.jingleUrl = URL.createObjectURL(blob);
        }
      }).catch(() => {});
  }

  // Videos
  if (videos.length > 0) {
    setLoadProgress(90);
    G.media['r5'] = shuffle([...videos]).map(f => ({
      url: f.directUrl || f.url, directUrl: f.directUrl || null,

      return { name, url: `https://3albalcon.github.io/3al-balcon-game/videos/${encodeURIComponent(name)}`, driveId: null, type: 'video' };
    }).filter(x => x.name);
  }
}

async function fetchDriveFile(baseUrl, fileInfo) {
  try {
    const res = await fetch(`${baseUrl}?action=file&id=${fileInfo.id}&t=${Date.now()}`, { redirect: 'follow' });
    const text = await res.text();
    const data = JSON.parse(text);
    if (data.error) return null;
    const blob = base64ToBlob(data.data, data.mimeType);
    const url = URL.createObjectURL(blob);
    return {
      url, blob,
      name: fileInfo.name,
      answer: fileInfo.name.replace(/\.[^/.]+$/, ''),
      type: data.mimeType.startsWith('video') ? 'video' : 'image'
    };
  } catch(e) { return null; }
}

function base64ToBlob(base64, mimeType) {
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType });
}


function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function parseCharadesCSV(line) {
  const cols = []; let col = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { cols.push(col.trim()); col = ''; }
    else { col += ch; }
  }
  cols.push(col.trim());
  return cols;
}

function buildCharadesFromRaw() {
  const lang = _lang;
  CH.dbStructure = {};
  CH.allCards    = [];
  CH.selectedSubs = new Set();

  CH.rawRows.forEach(r => {
    const word = (lang === 'en' ? r.word_en : r.word_ar).trim();
    const cat  = (lang === 'en' ? r.cat_en  : r.cat_ar).trim();
    const sub  = (lang === 'en' ? r.sub_en  : r.sub_ar).trim();
    if (!word || !cat || !sub) return;
    if (!CH.dbStructure[cat]) CH.dbStructure[cat] = {};
    if (!CH.dbStructure[cat][sub]) CH.dbStructure[cat][sub] = [];
    CH.dbStructure[cat][sub].push({ word, category: cat, subcategory: sub });
    CH.allCards.push({ word, category: cat, subcategory: sub, group: r.group || null });
  });

  CH.selectedCats = new Set(Object.keys(CH.dbStructure));
  // Title/Language format: start with only the titles that match the game language
  const want = lang === 'en' ? 'en' : 'ar';
  const langCats = new Set(CH.allCards.filter(c => c.group === want).map(c => c.category));
  if (langCats.size) CH.selectedCats = langCats;
  CH.selectedSubs = new Set();
}

// Called with pre-parsed rows from the CSV pipeline.
// Supports two layouts of category_9.csv:
//   2 columns: Title | Language (English / Arabic)          ← current file
//   6 columns: word_ar | word_en | cat_ar | sub_ar | cat_en | sub_en
function chLangGroup(v) {
  v = (v || '').trim().toLowerCase();
  if (v === 'arabic' || v === 'ar' || v === 'عربي' || v === 'عربية') return 'ar';
  if (v === 'english' || v === 'en' || v === 'انجليزي' || v === 'إنجليزي') return 'en';
  return null;
}
function loadCharadesFromRows(rows) {
  rows = (rows || []).filter(r => r && (r[0] || '').trim());
  const isLangFormat = rows.length > 0 && rows.some(r => chLangGroup(r[1]));

  if (isLangFormat) {
    CH.rawRows = rows.map(cols => {
      const word  = (cols[0] || '').replace(/^\uFEFF/, '').trim();
      const group = chLangGroup(cols[1]) || 'en';
      const cat_ar = group === 'ar' ? 'أفلام ومسلسلات عربية' : 'أفلام ومسلسلات أجنبية';
      const cat_en = group === 'ar' ? 'Arabic titles' : 'English titles';
      return { word_ar: word, word_en: word, cat_ar, sub_ar: cat_ar, cat_en, sub_en: cat_en, group };
    }).filter(r => r.word_ar);
  } else {
    CH.rawRows = rows.map(cols => ({
      word_ar: (cols[0] || '').trim(),
      word_en: (cols[1] || cols[0] || '').trim(),
      cat_ar:  (cols[2] || 'عام').trim(),
      sub_ar:  (cols[3] || cols[2] || 'عام').trim(),
      cat_en:  (cols[4] || cols[2] || 'General').trim(),
      sub_en:  (cols[5] || cols[3] || cols[4] || 'General').trim(),
    })).filter(r => r.word_ar);
  }

  if (!CH.rawRows.length) {
    G.questions.r8 = [];
    const loadingEl = document.getElementById('ch-loading');
    if (loadingEl) loadingEl.textContent = _lang === 'en' ? '⚠️ category_9.csv is empty' : '⚠️ ملف category_9.csv فارغ';
    return;
  }

  buildCharadesFromRaw();
  CH.loaded = true;
  renderCharadesAccordion();
  const loadingEl = document.getElementById('ch-loading');
  if (loadingEl) loadingEl.style.display = 'none';
  const accEl = document.getElementById('ch-accordion');
  if (accEl) accEl.style.display = 'block';
  // Only show card if not an event load
  if (!window._eventCode) {
    const card = document.getElementById('charades-settings-card');
    if (card) card.style.display = 'block';
  }
  applyCharadesFilter();
}

function renderCharadesAccordion() {
  const wrap = document.getElementById('ch-accordion');
  if (!wrap) return;
  const cats = Object.keys(CH.dbStructure).sort();

  wrap.innerHTML = cats.map(cat => {
    const subs  = Object.keys(CH.dbStructure[cat]);
    const count = subs.reduce((n, s) => n + CH.dbStructure[cat][s].length, 0);
    const active = CH.selectedCats.has(cat);
    const isOpen = CH.openAccCat === cat;
    const enc    = encodeURIComponent(cat);
    const catSubKeys = [...CH.selectedSubs].filter(k => k.startsWith(cat + '|||'));
    const allSubsSelected = catSubKeys.length === 0;

    const subHtml = subs.length > 1 ? `
      <div class="ph-acc-subcat-wrap ${isOpen ? 'open' : ''}" id="ch-sub-${enc}">
        <div class="ph-acc-subcat-inner">
          <button class="ph-subchip ${active && allSubsSelected ? 'active' : ''}"
            onclick="chSetAllSubs('${enc}')">${_lang === 'en' ? 'All' : 'الكل'}</button>
          ${subs.map(sub => {
            const subKey   = cat + '|||' + sub;
            const subCount = CH.dbStructure[cat][sub].length;
            const subActive = active && CH.selectedSubs.has(subKey);
            return `<button class="ph-subchip ${subActive ? 'active' : ''}"
              onclick="chToggleSubcat('${enc}','${encodeURIComponent(sub)}')">${sub} (${subCount})</button>`;
          }).join('')}
        </div>
      </div>` : '';

    return `
      <div class="ph-acc-cat-row ${active ? 'active' : ''}" onclick="chToggleCat('${enc}')">
        <div class="ph-acc-cat-left">
          <div class="ph-acc-cat-check">${active ? '✓' : ''}</div>
          <span class="ph-acc-cat-name">${cat}</span>
          <span class="ph-acc-cat-count">(${count})</span>
        </div>
        ${subs.length > 1 ? `<div class="ph-acc-arrow ${isOpen ? 'open' : ''}"
          onclick="event.stopPropagation();chToggleAccordion('${enc}')">▼</div>` : ''}
      </div>
      ${subHtml}`;

// Unified panel toggle — closes others when opening one
function toggleCatPanel(panel) {
  const panels = {
    photo:    { body: 'photo-settings-body',    arrow: 'photo-settings-arrow' },
    trivia:   { body: 'trivia-settings-body',   arrow: 'trivia-settings-arrow' },
    charades: { body: 'charades-settings-body', arrow: 'charades-settings-arrow' },
    cat5lang: { body: 'cat5lang-settings-body', arrow: 'cat5-lang-arrow' },
  };
  const target   = panels[panel];
  const isOpen   = document.getElementById(target.body).classList.contains('open');
  // Close all
  Object.values(panels).forEach(p => {
    document.getElementById(p.body).classList.remove('open');
    document.getElementById(p.arrow).style.transform = '';
  });
  // Open target if it was closed
  if (!isOpen) {
    document.getElementById(target.body).classList.add('open');
    document.getElementById(target.arrow).style.transform = 'rotate(180deg)';
    // Re-render accordion content when opened in case data loaded after initial render
    if (panel === 'trivia' && TR.loaded) renderTriviaAccordion();
    if (panel === 'charades' && CH.loaded) { buildCharadesFromRaw(); renderCharadesAccordion(); }
    if (panel === 'photo' && PH.loaded) renderPhotoAccordion();
  }
}

function normalizeAnswer(str) {
  return (str || '').toLowerCase().trim()
    .replace(/_/g, ' ')           // underscores → spaces
    .replace(/\s*\(\d+\)\s*$/, '') // remove trailing (1), (2) etc
    .replace(/\s+/g, ' ')         // collapse spaces
    .trim();
}

function matchPhotosAndApply(imageItems) {
  const urlMap = {};
  imageItems.forEach(img => {
    if (img.answer) urlMap[normalizeAnswer(img.answer)] = img;
  });
  PH.allPhotos = PH.allPhotos.map(p => ({
    ...p,
    url: urlMap[normalizeAnswer(p.answer)]?.url || null,
  }));
  if (!window._eventCode) {
    const card = document.getElementById('photo-settings-card');
    if (card) card.style.display = 'block';
    const phLoad = document.getElementById('ph-loading');
    if (phLoad) phLoad.style.display = 'none';
    const phAcc = document.getElementById('ph-accordion');
    if (phAcc) phAcc.style.display = 'block';
    renderPhotoAccordion();

  applyPhotoFilter();
}

  });

function applyPhotoFilter() {
  if (!PH.loaded) return;
  if (window._eventCode) return;
  const filtered = shuffle([...getFilteredPhotos()]);
  const allDriveImages = [...(G.media['r1'] || []), ...(G.media['r2'] || [])];
  if (allDriveImages.length > 0) {
    // Build URL map from Drive images
    const urlMap = {};
    allDriveImages.forEach(img => {
      if (img.answer) urlMap[normalizeAnswer(img.answer)] = img;
    });
    // Match filtered CSV entries to Drive images
    const matched = filtered
      .map(p => urlMap[normalizeAnswer(p.answer)])
      .filter(Boolean); // only keep entries with a Drive image

    if (matched.length > 0) {
      // Use matched images — respects category selection even if < 10
      const sh = shuffle([...matched]);
      G.media['r1'] = sh.slice(0, 10);
      G.media['r2'] = sh.slice(10, 20);
    } else {
      // Zero matches — CSV and Drive filenames don't match at all, use all Drive images
      const sh = shuffle([...allDriveImages]);
      G.media['r1'] = sh.slice(0, 10);
      G.media['r2'] = sh.slice(10, 20);
    }
  } else {
    G.media['r1'] = filtered.slice(0, 10);
    G.media['r2'] = filtered.slice(10, 20);
  }
}

function t(key, ...args) {
  const L = LANG[_lang];
  const val = L[key];
  if (typeof val === 'function') return val(...args);
  return val || LANG.ar[key] || key;
}

function toggleLang() {
  _lang = _lang === 'ar' ? 'en' : 'ar';
  applyLang();
  // Push lang to Firebase so phones follow
  if (window._fbDb && window._fbRef && window._fbSet && window._gameSession) {
    window._fbSet(window._fbRef(window._fbDb, `sessions/${window._gameSession}/lang`), _lang);
  }
}

function applyLang() {
  const L = LANG[_lang];
  const isAr = _lang === 'ar';

  // Update start screen
  const teamTitle = document.getElementById('team-title');
  const startBtn = document.getElementById('start-btn');
  const langBtn = document.getElementById('lang-btn');
  const inputA = document.getElementById('team-a-name');
  const inputB = document.getElementById('team-b-name');

  if (teamTitle) teamTitle.textContent = L.teamTitle;
  if (startBtn) startBtn.textContent = L.startBtn;
  if (langBtn) langBtn.textContent = isAr ? '🌐 English / عربي' : '🌐 عربي / English';
  if (inputA) { inputA.setAttribute('data-placeholder', L.placeholderA); }
  if (inputB) { inputB.setAttribute('data-placeholder', L.placeholderB); }

  // Update static HTML elements
  const backBtn = document.getElementById('back-btn-main');
  if (backBtn) backBtn.textContent = L.menu;

  // Update static menu buttons
  const mainMenuLbl = document.getElementById('tr-main-menu');
  if (mainMenuLbl) mainMenuLbl.textContent = isAr ? 'القائمة الرئيسية' : 'Main Menu';

  const eventInput = document.getElementById('event-code-input');
  if (eventInput) eventInput.placeholder = isAr ? 'كود الحفلة (اختياري)' : 'Event Code (optional)';

  document.querySelectorAll('.tr-close-game').forEach(el => el.textContent = isAr ? 'اغلاق اللعبة' : 'Close Game');
  document.querySelectorAll('.tr-host-mode').forEach(el => el.textContent = isAr ? 'مقدّم البرنامج' : 'Host Mode');
  const hostOnly = document.getElementById('tr-host-only');
  if (hostOnly) hostOnly.textContent = isAr ? 'للمقدّم فقط' : 'Host Only';
  const spinBtn = document.getElementById('tr-spin-opener');
  if (spinBtn) spinBtn.textContent = isAr ? 'إختيار الفقرة' : 'Spin the Wheel';
  const startBtnLbl = document.getElementById('start-btn-lbl');
  if (startBtnLbl) startBtnLbl.textContent = isAr ? 'يــــلا نـــلـــعـــب 🎮' : "Let's Play 🎮";
  const photoLbl = document.getElementById('photo-settings-label');
  if (photoLbl) photoLbl.textContent = isAr ? '📸 اختيار فئات الصور' : '📸 Select Photo Categories';
  const triviaLbl = document.getElementById('trivia-settings-label');
  if (triviaLbl) triviaLbl.textContent = isAr ? '📝 اختيار فئات الأسئلة' : '📝 Select Question Categories';
  const charadesLbl = document.getElementById('charades-settings-label');
  if (charadesLbl) charadesLbl.textContent = isAr ? '🤐 اختيار فئات التمثيل' : '🤐 Select Charades Categories';
  const songsLbl = document.getElementById('cat5-lang-label');
  if (songsLbl) songsLbl.textContent = isAr ? '🎵 اختيار لغة الأغاني' : '🎵 Song Language';
  const cat5All = document.getElementById('cat5-lbl-all');
  if (cat5All) cat5All.textContent = isAr ? 'الكل' : 'All';
  const cat5Ar = document.getElementById('cat5-lbl-ar');
  if (cat5Ar) cat5Ar.textContent = isAr ? 'عربي' : 'Arabic';
  const cat5En = document.getElementById('cat5-lbl-en');
  if (cat5En) cat5En.textContent = 'English';
  const celebBtn = document.getElementById('tr-celebration');
  if (celebBtn) celebBtn.textContent = isAr ? 'احتفال!' : 'Celebrate!';
  const spin1 = document.getElementById('tr-spin1');
  if (spin1) spin1.textContent = isAr ? 'دوّر!' : 'Spin!';
  const startRound = document.getElementById('tr-start-round');
  if (startRound) startRound.textContent = isAr ? '← ابدأ الفقرة' : '← Start Round';
  const cat3StartLbl = document.getElementById('cat3-start-btn-lbl');
  if (cat3StartLbl) cat3StartLbl.textContent = isAr ? 'ابدأ المزاد' : 'Start Auction';

  const statusText = document.getElementById('data-status-text');
  if (statusText && statusText.textContent.includes('يتم تحضير') || statusText?.textContent.includes('Loading'))
    statusText.textContent = t('loadingAll');

  // Rebuild menu to refresh category labels
  if (typeof buildMenu === 'function' && document.getElementById('rounds-grid')) buildMenu();

  // Refresh photo settings label
  if (photoLbl) photoLbl.textContent = isAr ? '📸 اختيار فئات الصور' : '📸 Select Photo Categories';

  // Refresh trivia settings label
  if (triviaLbl) triviaLbl.textContent = isAr ? '📝 اختيار فئات الأسئلة' : '📝 Select Question Categories';

  // Re-apply photos with new language if loaded
  // Rebuild photo accordion when language changes
  if (PH.loaded && !window._eventCode && PH.rawRows?.length) {
    PH.allPhotos = PH.rawRows.map(p => ({
      answer: p.answer, url: null,
      cat:    isAr ? (p.cat_ar    || p.cat_en)    : (p.cat_en    || p.cat_ar),
      subcat: isAr ? (p.subcat_ar || p.subcat_en) : (p.subcat_en || p.subcat_ar),
    }));
    PH.selectedCats = new Set(PH.allPhotos.map(p => p.cat));
    PH.selectedSubcats = new Set();
    renderPhotoAccordion();
  } else if (PH.loaded && !window._eventCode) {
    // Fallback: just update label
    const phAcc = document.getElementById('ph-accordion');
    const catLabel = isAr ? 'كل الصور' : 'All Photos';
    const totalImgs = PH.allPhotos.length;
    if (phAcc) phAcc.innerHTML = `<div class="ph-acc-cat-row active">
      <div class="ph-acc-cat-left">
        <div class="ph-acc-cat-check">✓</div>
        <span class="ph-acc-cat-name">${catLabel}</span>
        <span class="ph-acc-cat-count">(${totalImgs})</span>
      </div>
    </div>`;
    const phCount = document.getElementById('ph-count-display');
    if (phCount) phCount.textContent = isAr
      ? `${Math.min(totalImgs,10)} للفقرة 1 · ${Math.min(Math.max(totalImgs-10,0),10)} للفقرة 2`
      : `${Math.min(totalImgs,10)} for Cat 1 · ${Math.min(Math.max(totalImgs-10,0),10)} for Cat 2`;
  }

  // Refresh charades settings label
  if (charadesLbl) charadesLbl.textContent = isAr ? '🤐 اختيار فئات التمثيل' : '🤐 Select Charades Categories';

  // Refresh cat5 language label
  if (songsLbl) songsLbl.textContent = isAr ? '🎵 اختيار لغة الأغاني' : '🎵 Song Language';
  updateCat5Count();

  // Re-apply trivia with new language if loaded
  if (TR.loaded && TR.rawQuestions.length) {
    TR.openAccCat = null;
    const lang2 = _lang;
    TR.allQuestions = TR.rawQuestions.map(q => ({
      q:      lang2==='en'?(q.q_en||q.q_ar||''):(q.q_ar||''),
      a:      lang2==='en'?(q.a_en||q.a_ar||''):(q.a_ar||''),
      cat:    lang2==='en'?(q.cat_en||q.cat_ar||'General'):(q.cat_ar||'عام'),
      subcat: lang2==='en'?(q.subcat_en||q.subcat_ar||null):(q.subcat_ar||null),
    })).filter(q=>q.q&&q.a);
    TR.selectedCats = new Set(TR.allQuestions.map(q=>q.cat));
    TR.selectedSubcats = new Set();
    renderTriviaAccordion();
  }

  // Re-apply charades with new language if loaded
  if (CH.loaded) {
    CH.openAccCat = null;
    buildCharadesFromRaw();
    renderCharadesAccordion();
    applyCharadesFilter();
  }

  // Update ROUNDS names
  ROUNDS.forEach(r => {
    if (L[r.id]) r.name = L[r.id];
  });

  // Update RULES
  Object.keys(L.RULES).forEach(id => {
    RULES[id] = L.RULES[id];
  });

  // Update direction
  document.body.style.direction = isAr ? 'rtl' : 'ltr';
  document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
  document.documentElement.lang = isAr ? 'ar' : 'en';
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startGame() {
  const rawA = document.getElementById('team-a-name').textContent.trim();
  const rawB = document.getElementById('team-b-name').textContent.trim();
  G.teamA = rawA.length > 0 ? rawA : (LANG[_lang].placeholderA || 'الفريق الأول');
  G.teamB = rawB.length > 0 ? rawB : (LANG[_lang].placeholderB || 'الفريق الثاني');
  // Generate unique session ID for this game
  window._gameSession = 's' + Date.now().toString(36) + Math.random().toString(36).substr(2,4);
  window._usedPhotoAnswers = new Set();
  window._eventImagePool = null;
  window._usedTriviaIds  = new Set();
  window._usedClosestIds = new Set();
  // Regenerate host QR if host mode already active
  if (window._hostMode) {
    setTimeout(() => {
      const qrEl = document.getElementById('host-qr');
      if (qrEl && typeof QRCode !== 'undefined') {
        qrEl.innerHTML = '';
        const hostUrl = `https://3albalcon.github.io/3al-balcon-game/host.html?s=${window._gameSession}&l=${_lang}`;
        new QRCode(qrEl, { text: hostUrl, width: 100, height: 100, colorDark: '#000', colorLight: '#fff' });
        // Remove warning now that game has started
        const warn = document.getElementById('host-qr-warn');
        if (warn) warn.remove();
      }
    }, 100);
  }
  // Push current lang immediately after session created
  setTimeout(() => {
    if (window._fbDb && window._fbRef && window._fbSet) {
      window._fbSet(window._fbRef(window._fbDb, `sessions/${window._gameSession}/lang`), _lang);
      window._fbSet(window._fbRef(window._fbDb, `sessions/${window._gameSession}/shutdown`), false);
    }
  }, 300);
  // Restart host cmd listener on new session path (it ignores any leftover command)
  startHostCmdListener();
  buildMenu();
  show('menu-screen');
  // Push state immediately so host phone shows teams right away
  setTimeout(() => {
    pushHostState();
    // Push wallpaper to dedicated path for host screen
    if (G.waitingScreenUrl || G.hostWallpaperUrl) {
      const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
      if (db && fbSet) fbSet(fbRef(db, _path('hostWallpaper')), G.waitingScreenUrl || G.hostWallpaperUrl);
    }
  }, 200);
}

  const details = [];
  function getRows(sheetName, twoCol) {
    const sheet = wb.Sheets[sheetName];
    if (!sheet) return null;
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' }).slice(1);
    if (twoCol) return rows.map(r => ({ q:(r[0]||'').toString().trim(), a:(r[1]||'').toString().trim() })).filter(x=>x.q);
    return rows.map(r => (r[0]||'').toString().trim()).filter(Boolean);
  }
  const s3 = getRows('Category 3', false);
  if (s3) { G.questions.r3 = shuffle([...s3]); details.push(`✅ ${_lang==="en"?"Auction":"مزاد علني"}: ${s3.length} ${_lang==="en"?"questions":"سؤال"}`); }
  else details.push(`⚠️ Category 3: ${_lang==="en"?"not found":"مش موجود"}`);

  const s410 = getRows('Category 4-10', true);
  if (s410 && s410.length > 0 && !window._eventCode) {
    const sh = shuffle([...s410]); const half = Math.floor(sh.length/2);
    G.questions.r10 = sh.slice(0, half); G.questions.r9 = sh.slice(half);
    details.push(`✅ ${_lang==="en"?"Trivia":"متفرقات"}: ${s410.length} ${_lang==="en"?"questions":"سؤال"}`);
  } else if (!TR.loaded) details.push(`⚠️ Category 4-10: ${_lang==="en"?"not found":"مش موجود"}`);

  const sheet6 = wb.Sheets['Category 6'];
  if (sheet6) {
    G.questions.r5 = XLSX.utils.sheet_to_json(sheet6, { header:1, defval:'' }).slice(1)
      .map(r => ({ v:(r[0]||'').toString().trim(), q:(r[1]||'').toString().trim(), a:(r[2]||'').toString().trim() }))
      .filter(x => x.v || x.q);
    details.push(`✅ سكوت و ركز: ${G.questions.r5.length} سؤال`);
  } else details.push(`⚠️ Category 6: مش موجود`);

  const s5 = getRows('Category 5', true);
  if (s5) { G.questions.r4 = shuffle([...s5]); details.push(`✅ الدندنة: ${s5.length} سؤال`); }
  else details.push(`⚠️ Category 5: مش موجود`);

  const s78 = getRows('Category 7-8', true);
  if (s78 && s78.length > 0) {
    const sh = shuffle([...s78]); const half = Math.floor(sh.length/2);
    G.questions.r6 = sh.slice(0, half); G.questions.r7 = sh.slice(half);
    details.push(`✅ يا حبيبي + يا قريب: ${s78.length} سؤال — ${G.questions.r6.length} و ${G.questions.r7.length}`);
  } else details.push(`⚠️ Category 7-8: مش موجود`);

  const s9 = getRows('Category 9', false);
  if (s9) { G.questions.r8 = shuffle([...s9]); details.push(`✅ سكر تمك: ${s9.length} اسم`); }
  else details.push(`⚠️ Category 9: مش موجود`);

  document.getElementById('status-excel').textContent = `✅ تم تحميل ملف Excel بنجاح`;
  document.getElementById('excel-details').innerHTML = details.join('<br>');
}

// ══════════════════════════════════════════
// CSV LOADING (direct from Google Drive)
// ══════════════════════════════════════
// DATA — CSV Loader (Google Drive)
// ══════════════════════════════════════
// ── Fast path: CSVs embedded in list response ──
async function loadCSVData(csvData, eventCodeSnapshot, loadGen) {
  function parseCSV(text) {
    const lines = text.split('\n').slice(1);
    return lines.map(line => {
      const cols = [];
      let col = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(col.trim()); col = ''; }
        else { col += ch; }
      }
      cols.push(col.trim());
      return cols;
    }).filter(r => r[0] && r[0].length > 0);
  }
  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }

  if (loadGen && loadGen < _driveLoadGen) return;

  // Convert csvData {key: textContent} to same format as loadCSVFiles results
  const results = Object.entries(csvData).map(([key, text]) => ({
    key, rows: parseCSV(text)
  }));

  // Reuse the same processing logic from loadCSVFiles
  await processCSVResults(results, eventCodeSnapshot, loadGen, shuffle);
}

async function loadCSVFiles(csvFiles, eventCodeSnapshot, loadGen) {
  function parseCSV(text) {
    const lines = text.split('\n').slice(1);
    return lines.map(line => {
      const cols = [];
      let col = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(col.trim()); col = ''; }
        else { col += ch; }
      }
      cols.push(col.trim());
      return cols;
    }).filter(r => r[0] && r[0].length > 0);
  }
  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }

  const fetches = Object.entries(csvFiles).map(async ([key, fileIdOrUrl]) => {
    try {
      // csvFiles now stores file IDs directly (not download URLs)
      const fileId = fileIdOrUrl.includes('/') 
        ? (fileIdOrUrl.match(/id=([^&]+)/)?.[1] || fileIdOrUrl)  // legacy URL format
        : fileIdOrUrl; // new ID-only format
      const res = await fetch(`${DRIVE_SCRIPT_URL}?action=file&id=${fileId}&t=${Date.now()}`, { redirect: 'follow' });
      const data = await res.json();
      if (data.error || !data.data) return { key, rows: null };
      const bytes = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
      const text = new TextDecoder('utf-8').decode(bytes);
      return { key, rows: parseCSV(text) };
    } catch(e) { return { key, rows: null }; }
  });

  const results = await Promise.all(fetches);
  await processCSVResults(results, eventCodeSnapshot, loadGen, shuffle);
}

async function processCSVResults(results, eventCodeSnapshot, loadGen, shuffle) {

  // If a newer load has started, discard these results
  if (loadGen && loadGen < _driveLoadGen) return;

  results.forEach(({ key, rows }) => {
    if (!rows || rows.length === 0) return;
    if (key === 'images_csv') {
      // Format: answer | cat_ar | subcat_ar | cat_en | subcat_en
      const mapped = rows.map(r => ({
        answer:    (r[0]||'').trim(),
        cat_ar:    (r[1]||'').trim(),
        subcat_ar: (r[2]||'').trim(),
        cat_en:    (r[3]||r[1]||'').trim(),
        subcat_en: (r[4]||r[2]||'').trim(),
      })).filter(x => x.answer);
      const shuffled = shuffle(mapped);
      G.questions.r1csv = shuffled.slice(0, 10);
      G.questions.r2csv = shuffled.slice(10, 20);

      // Build PH for photo selector with categories/subcategories
      PH.allPhotos = mapped.map(p => ({
        answer: p.answer,
        url: null, // URL will be matched from G.media.r1/r2 at game time
        cat:    _lang==='en' ? (p.cat_en    || p.cat_ar)    : (p.cat_ar    || p.cat_en),
        subcat: _lang==='en' ? (p.subcat_en || p.subcat_ar) : (p.subcat_ar || p.subcat_en),
      }));
      PH.selectedCats    = new Set(PH.allPhotos.map(p => p.cat));
      PH.selectedSubcats = new Set();
      PH.loaded = true;
      PH.rawRows = mapped; // store raw for language rebuild

      if (!eventCodeSnapshot) {
        // If Drive images already loaded — match now; otherwise Drive handler will match
        if (window._driveImageItems?.length) {
          matchPhotosAndApply(window._driveImageItems);
        } else {
          // Drive images not ready yet — show card with loading state
          const card = document.getElementById('photo-settings-card');
          if (card) card.style.display = 'block';
        }
      }
    } else if (key === 'cat3') {
      // col0=Q_AR, col1=Q_EN
      G.questions.r3 = shuffle(rows.map(r => ({ q_ar: r[0], q_en: r[1] || r[0] })).filter(x => x.q_ar));
    } else if (key === 'cat410') {
      const items410 = rows.map(r => ({
        q_ar: (r[0]||'').trim(), q_en: (r[1]||r[0]||'').trim(),
        a_ar: (r[2]||'').trim(), a_en: (r[3]||r[2]||'').trim(),
        cat_ar: (r[4]||'متفرقات').trim(), subcat_ar: (r[5]||'').trim(),
        cat_en: (r[6]||r[4]||'General').trim(), subcat_en: (r[7]||r[5]||'').trim(),
      })).filter(x => x.q_ar && x.a_ar);
      const sh410 = shuffle([...items410]); const half410 = Math.floor(sh410.length/2);
      G.questions.r10 = sh410.slice(0, half410);
      G.questions.r9  = sh410.slice(half410);
      TR.rawQuestions = items410;
      TR.allQuestions = items410.map(q => ({
        q: _lang==='en'?(q.q_en||q.q_ar||''):(q.q_ar||''),
        a: _lang==='en'?(q.a_en||q.a_ar||''):(q.a_ar||''),
        cat: _lang==='en'?(q.cat_en||q.cat_ar||'General'):(q.cat_ar||'عام'),
        subcat: _lang==='en'?(q.subcat_en||q.subcat_ar||null):(q.subcat_ar||null),
      })).filter(q=>q.q&&q.a);
      TR.selectedCats = new Set(TR.allQuestions.map(q=>q.cat));
      TR.selectedSubcats = new Set();
      TR.loaded = true;
      if (!eventCodeSnapshot) {
        const card = document.getElementById('trivia-settings-card');
        if (card) card.style.display = 'block';
        const trLoad = document.getElementById('tr-loading');
        if (trLoad) trLoad.style.display = 'none';
        const trAcc = document.getElementById('tr-accordion');
        if (trAcc) trAcc.style.display = 'block';
        renderTriviaAccordion();
        applyTriviaFilter(); // set r10/r9 from full question set
      }
    } else if (key === 'cat5') {
      G.questions.r4 = shuffle(rows.map(r => ({ q: r[0], a: r[1], lang: (r[2]||'').trim().toLowerCase() })).filter(x => x.q));
      setTimeout(updateCat5Count, 100);
    } else if (key === 'cat6') {
      // col0=video, col1=Q_AR, col2=A_AR, col3=Q_EN, col4=A_EN
      G.questions.r5 = shuffle(rows.map(r => ({ v: r[0], q: r[1], a: r[2], q_en: r[3]||r[1], a_en: r[4]||r[2] })).filter(x => x.v || x.q));
    } else if (key === 'cat78') {
      // col0=Q_AR, col1=Q_EN, col2=A (number — same both langs)
      const items = rows.map(r => ({ q: r[0], q_en: r[1]||r[0], a: r[2] })).filter(x => x.q);
      const sh = shuffle(items); const half = Math.floor(sh.length/2);
      G.questions.r6 = sh.slice(0, half); G.questions.r7 = sh.slice(half);
    } else if (key === 'cat9') {
      loadCharadesFromRows(rows);
    }
  });
}

// OPEN ROUND
// ══════════════════════════════════════
// GAME FLOW — Open Round
// ══════════════════════════════════════
// Track which photos have been shown across rounds
window._usedPhotoAnswers = new Set();

function refreshPhotoBatch(roundId) {
  // Get all available photos with URLs
  let allPhotos;
  if (window._eventCode) {
    // Event game — use the full stored image list
    allPhotos = window._eventImagePool || [...(G.media.r1 || []), ...(G.media.r2 || [])];
    // Store the full pool on first call
    if (!window._eventImagePool) window._eventImagePool = [...allPhotos];
  } else {
    allPhotos = getFilteredPhotos().map(p => {
      const driveImgs = [...(window._driveImageItems || [])];
      const match = driveImgs.find(img => normalizeAnswer(img.answer) === normalizeAnswer(p.answer));
      return match ? { ...match, cat: p.cat, subcat: p.subcat } : null;
    }).filter(Boolean);
  }

  if (allPhotos.length === 0) return;

  // Separate unused and used photos
  let unused = allPhotos.filter(p => !window._usedPhotoAnswers.has(p.answer));

  // If not enough unused photos — reset the used pool and start fresh
  if (unused.length < 10) {
    window._usedPhotoAnswers = new Set();
    unused = [...allPhotos];
  }

  const sh = shuffle([...unused]);
  const batch = sh.slice(0, 10); // only 10 per call

  // Mark this batch as used
  batch.forEach(p => window._usedPhotoAnswers.add(p.answer));

  // Assign to the correct category only
  if (roundId === 'r1') G.media['r1'] = batch;
  else G.media['r2'] = batch;
}

// ── Question pool deduplication ──
window._usedTriviaIds   = new Set();
window._usedClosestIds  = new Set();

function refreshQuestionBatch(ids, pool, usedSet) {
  // ids: array of question pool keys e.g. ['r9','r10']
  // pool: combined array of all questions for these categories
  if (!pool || pool.length === 0) return;
  let unused = pool.filter((_, i) => !usedSet.has(i));
  if (unused.length < 5) {
    usedSet.clear();
    unused = [...pool];
  }
  const sh = shuffle([...unused.map((q, i) => ({ q, i: pool.indexOf(q) }))]);
  // Mark as used and split evenly
  const perCat = Math.ceil(sh.length / ids.length);
  ids.forEach((id, idx) => {
    const slice = sh.slice(idx * perCat, (idx + 1) * perCat);
    slice.forEach(({ i }) => usedSet.add(i));
    G.questions[id] = slice.map(({ q }) => q);
  });
}

function openRound(id) {
  if (G.done.has(id)) return;
  // Stop jingle and videos when starting a round
  _celebrationCleanup();
  document.querySelectorAll('video').forEach(v => { try { v.pause(); v.currentTime = 0; } catch(e) {} });
  _resetScoreState();
  // Fresh phone rooms for this visit (created on the rules slide)
  if (cat3Listener) { cat3Listener(); cat3Listener = null; }
  cat3RoomId = null;
  window._cat3BothConnected = false;
  window._cat3CanAdvance = false;
  window._cat6RoomId = null;

  // For photo categories — pick a fresh batch excluding already-used photos
  if (id === 'r1' || id === 'r2') {
    refreshPhotoBatch(id);
  }
  // For trivia categories — deduplicate questions between Cat 4 and Cat 10
  if (id === 'r9' || id === 'r10') {
    const pool = [...(G.questions.r9 || []), ...(G.questions.r10 || [])];
    if (pool.length > 0) refreshQuestionBatch(['r9', 'r10'], pool, window._usedTriviaIds);
  }
  // For closest categories — deduplicate questions between Cat 7 and Cat 8
  if (id === 'r6' || id === 'r7') {
    const pool = [...(G.questions.r6 || []), ...(G.questions.r7 || [])];
    if (pool.length > 0) refreshQuestionBatch(['r6', 'r7'], pool, window._usedClosestIds);
  }

  const round = ROUNDS.find(r => r.id === id);

  // Check if data is ready for this round
  const dataMap = {
    'r1':  () => G.media.r1.length > 0,
    'r2':  () => G.media.r2.length > 0,
    'r3':  () => G.questions.r3.length > 0,
    'r4':  () => (G.questions.r4 || []).length > 0,
    'r5':  () => (G.media.r5 || []).length > 0,
    'r6':  () => (G.questions.r6 || []).length > 0 || (G.questions.r7 || []).length > 0,
    'r7':  () => (G.questions.r6 || []).length > 0 || (G.questions.r7 || []).length > 0,
    'r8':  () => (G.questions.r8 || []).length > 0,
    'r9':  () => (G.questions.r9 || []).length > 0,
    'r10': () => (G.questions.r10 || []).length > 0,
  };

  if (dataMap[id] && !dataMap[id]()) {
    showToast(t('almostReady'));
    return;
  }

  G.currentRound = round;
  G.currentQ = -1;
  document.getElementById('gh-title').textContent = round.name;
  updateHeaderScores();
  show('game-screen');
  renderSlide();
  pushHostState();
}

// ══════════════════════════════════════
// GAME FLOW — Next Question
// ══════════════════════════════════════
function nextQ() {
  _resetScoreState();
  const r = G.currentRound;
  if (!r) return;

  // Block next question if answer not yet revealed (skip for title/rules slides and cat3/cat6)
  const skipRevealCheck = G.currentQ <= 0 || r.id === 'r3' || r.id === 'r5';
  if (!skipRevealCheck && !window._answerRevealed) {
    showToast(t('revealFirst'));
    return;
  }

  // For closest categories: also need reveal done
  if ((r.id === 'r6' || r.id === 'r7') && G.currentQ >= 1 && !window._closestRevealDone) {
    showToast(t('revealFirst'));
    return;
  }

  if (G.currentQ >= r.count) {
    showResult();
    return;
  }
  G.currentQ++;
  window._answerRevealed = false; // reset for new question
  renderSlide();
  pushHostState();
}

// ══════════════════════════════════════
// RENDERING — Slide Dispatcher
// ══════════════════════════════════════
function renderSlide() {
  const r = G.currentRound;
  const sa = document.getElementById('slide-area');
  stopTimer();
  setTimeout(pushHostState, 150);
  window._answerRevealed = false; // reset on each new slide

  // Reset slide-area styles for all rounds
  sa.style.overflow = '';
  sa.style.paddingTop = '';
  sa.style.justifyContent = '';
  sa.style.alignItems = '';

  if (r.slides === 'team+video') {
    sa.style.alignItems = 'center';
  }

  // === TITLE SLIDE (q=-1) ===
  if (G.currentQ === -1) {
    sa.style.overflow = 'hidden';
    sa.style.justifyContent = 'center';
    sa.innerHTML = `
      <div class="section-title-slide fade-in">
        <div class="big-number">${r.num}</div>
        <h1>${r.name}</h1>
        <button class="nav-btn primary" onclick="nextQ()" style="margin-top:16px;">${t('gameRules')}</button>
      </div>`;
    updateHostView(r.name, 'العنوان', r.name, '');
    return;
  }

  // === RULES SLIDE (q=0) ===
  if (G.currentQ === 0) {
    renderRules(r, sa);
    updateHostView(r.name, 'القوانين', `قوانين: ${r.name}`, '');
    return;
  }

  // === QUESTION SLIDES ===
  const qIndex = G.currentQ - 1;

  if (r.slides === 'buzzer+image') renderBuzzerImage(r, qIndex, sa);
  else if (r.slides === 'bidding') renderBidding(r, qIndex, sa);
  else if (r.slides === 'buzzer+audio') renderBuzzerAudio(r, qIndex, sa);
  else if (r.slides === 'team+video') renderTeamVideo(r, qIndex, sa);
  else if (r.slides === 'closest') renderClosest(r, qIndex, sa);
  else if (r.slides === 'charades') renderCharades(r, qIndex, sa);
  else if (r.slides === 'buzzer+question') renderBuzzerQuestion(r, qIndex, sa);
}

// SCORE PANEL
// ══════════════════════════════════════
// UI — Score Panel
// ══════════════════════════════════════
// ── Per-question score state: null | {team, val} — one action per question, undoable ──
let _scoreState = null; // { a: val|null, b: val|null }

let _scoreApplied = { a: 0, b: 0 }; // what addScore really changed, for undo
function _resetScoreState() { _scoreState = { a: null, b: null }; _scoreApplied = { a: 0, b: 0 }; }
_resetScoreState();

function scorePanelHTML(plus=2, minus=1) {
  const stA = _scoreState?.a;
  const stB = _scoreState?.b;

  const teamHTML = (team) => {
    const st = team === 'a' ? stA : stB;
    const scored = st !== null;
    const name = team === 'a' ? G.teamA : G.teamB;
    const score = team === 'a' ? G.scoreA : G.scoreB;

    if (scored) {
      // Show undo button
      const label = st > 0 ? `+${st}` : `${st}`;
      return `
        <div class="sp-team">
          <button class="sp-btn minus" onclick="undoScore('${team}')" title="${t('undo')||'Undo'}" style="font-size:18px">↩</button>
          <div>
            <div class="sp-name">${name}</div>
            <div class="sp-score" id="sp-${team}">${score}</div>
          </div>
          <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:${st>0?'var(--neon-green)':'var(--neon-red)'}">
            ${label} ✓
          </div>
        </div>`;
    }

    // Normal — show +/- buttons
    const minusBtn = minus > 0
      ? `<button class="sp-btn minus" onclick="scoreOnce('${team}', ${-minus})">-${minus}</button>`
      : `<div style="width:44px"></div>`;
    return `
      <div class="sp-team">
        ${minusBtn}
        <div>
          <div class="sp-name">${name}</div>
          <div class="sp-score" id="sp-${team}">${score}</div>
        </div>
        <button class="sp-btn plus" onclick="scoreOnce('${team}', ${plus})">+${plus}</button>
      </div>`;
  };

  return `
    <div class="score-panel" data-plus="${plus}" data-minus="${minus}">
      ${teamHTML('a')}
      <div class="sp-divider"></div>
      ${teamHTML('b')}
    </div>`;
}

// Re-render only the score panel. Never re-render the whole slide here: that
// hides an already revealed answer and re-locks the Next button.
function _refreshScorePanel() {
  const panel = document.querySelector('.score-panel');
  if (!panel) return;
  const p = parseInt(panel.dataset.plus || 2);
  const m = parseInt(panel.dataset.minus || 1);
  panel.outerHTML = scorePanelHTML(p, m);
}

function scoreOnce(team, val) {
  if (!_scoreState) _resetScoreState();
  if (_scoreState[team] !== null) return; // already scored this question
  _scoreState[team] = val;
  _scoreApplied[team] = addScore(team, val);
  _refreshScorePanel();
  pushHostState();
}

function undoScore(team) {
  if (!_scoreState || _scoreState[team] === null) return;
  _scoreState[team] = null;
  // Reverse what was actually applied — scores are floored at 0, so a -2 on a
  // team with 1 point only took 1 away and undo must only give 1 back.
  addScore(team, -_scoreApplied[team]);
  _scoreApplied[team] = 0;
  _refreshScorePanel();
  pushHostState();
}

// ══════════════════════════════════════
// Escape text typed on a phone before putting it into innerHTML.
function escHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Returns the change actually applied (scores never go below 0).
function addScore(team, val) {
  const before = team === 'a' ? G.scoreA : G.scoreB;
  if(team==='a') G.scoreA = Math.max(0, G.scoreA + val);
  else G.scoreB = Math.max(0, G.scoreB + val);
  const applied = (team === 'a' ? G.scoreA : G.scoreB) - before;
  updateHeaderScores();
  document.getElementById('sp-a') && (document.getElementById('sp-a').textContent = G.scoreA);
  document.getElementById('sp-b') && (document.getElementById('sp-b').textContent = G.scoreB);
  document.getElementById('mn-a-score') && (document.getElementById('mn-a-score').textContent = G.scoreA);
  document.getElementById('mn-b-score') && (document.getElementById('mn-b-score').textContent = G.scoreB);
  showToast(val > 0 ? `+${val} ${_lang==='en'?'pts':'نقطة'}! 🎉` : `${val} ${_lang==='en'?'pts':'نقطة'}`);
  // Score flash overlay
  showScoreFlash(val, team);
  const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
  if (db && fbSet && fbRef) {
    fbSet(fbRef(db, _path('hostState/scoreA')), G.scoreA);
    fbSet(fbRef(db, _path('hostState/scoreB')), G.scoreB);
  }
  return applied;
}

let timerInterval = null;
let timerVal = 0;
let timerMax = 60;
const CIRCUMFERENCE = 2 * Math.PI * 54;

// ══════════════════════════════════════
// TIMER
// ══════════════════════════════════════
function timerHTML(seconds=60) {
  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div class="timer-display">
        <svg class="timer-circle" width="160" height="160" viewBox="0 0 120 120">
          <circle class="timer-bg" cx="60" cy="60" r="54"/>
          <circle class="timer-fill" id="timer-fill" cx="60" cy="60" r="54"
            stroke-dasharray="${CIRCUMFERENCE}"
            stroke-dashoffset="0"/>
        </svg>
        <div class="timer-number" id="timer-num">${seconds}</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="timer-btn" style="padding:5px 16px" onclick="startTimer(${seconds})">${t('startTimer')}</button>
      </div>
    </div>`;
}

function startTimer(seconds) {
  stopTimer();
  timerMax = seconds;
  timerVal = seconds;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerVal--;
    updateTimerUI();
    if(timerVal <= 0) { stopTimer(); playBuzzer(); showTimerEnd(); }
  }, 1000);
}

function showTimerEnd() {
  // For cat6 — show reveal button when timer ends
  if (G.currentRound?.id === 'r5') {
    showCat6AnswerReveal();
  }
  const el = document.createElement('div');
  el.id = 'timer-end-overlay';
  el.style.cssText = `
    position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,5,30,0);
    pointer-events:none;
    transition:background 0.2s;
  `;
  el.innerHTML = `
    <div id="timer-end-text" style="
      font-family:'Cairo',sans-serif;
      font-size:clamp(60px,18vw,200px);
      font-weight:900;
      color:var(--neon-red);
      text-shadow:0 0 40px #FF2D2D,0 0 80px rgba(255,45,45,0.6);
      text-align:center;
      opacity:0;
      transform:scale(0.3);
      transition:opacity 0.15s,transform 0.25s cubic-bezier(0.17,0.67,0.12,1.5);
      line-height:1;
      letter-spacing:2px;
    ">${t('timesUp')}</div>
  `;
  document.body.appendChild(el);
  // Animate in
  requestAnimationFrame(() => {
    el.style.background = 'rgba(0,5,30,0.7)';
    const txt = document.getElementById('timer-end-text');
    if(txt) { txt.style.opacity='1'; txt.style.transform='scale(1)'; }
  });
  // Animate out after 1.8s
  setTimeout(() => {
    el.style.background = 'rgba(0,5,30,0)';
    const txt = document.getElementById('timer-end-text');
    if(txt) { txt.style.opacity='0'; txt.style.transform='scale(2)'; txt.style.transition='opacity 0.4s,transform 0.4s'; }
    setTimeout(() => el.remove(), 500);
  }, 1800);
}

function stopTimer() {
  if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ── BUZZER SOUND (Web Audio API — no file needed) ──
function playBuzzer() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(400, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, c.currentTime + 1.2);
    g.gain.setValueAtTime(0.5, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.2);
    o.start(c.currentTime);
    o.stop(c.currentTime + 1.2);
    setTimeout(() => c.close(), 2000);
  } catch(e) {}
}

function updateTimerUI() {
  const numEl = document.getElementById('timer-num');
  const fillEl = document.getElementById('timer-fill');
  if(!numEl) return;
  numEl.textContent = timerVal;
  numEl.className = 'timer-number' + (timerVal <= 10 ? ' urgent' : '');
  if(fillEl) {
    const pct = timerVal / timerMax;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    fillEl.style.stroke = timerVal <= 10 ? 'var(--neon-red)' : 'var(--neon-cyan)';
  }
}

// Firebase server time — see _fbServerOffset
function srvNow() { return Date.now() + (window._fbServerOffset || 0); }

// Who currently holds the auction: highest bid; on a draw, whoever reached
// that number first. Returns null when nobody has bid yet.
function cat3Leader(vA, vB, tA, tB) {
  if (!vA && !vB) return null;
  if (vA !== vB) return vA > vB ? 'a' : 'b';
  return (tA || Infinity) <= (tB || Infinity) ? 'a' : 'b';
}

// Normalise an answer so trivial differences (case, spaces, Arabic hamza /
// taa marbuta / tashkeel, a leading "ال") don't make the same answer count twice.
function normAnswer(txt) {
  return String(txt || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[^\p{L}\p{N}]+/gu, ' ').trim()
    .split(' ').map(w => w.length > 3 ? w.replace(/^ال/, '') : w).join(' ');
}

// Next is only allowed once the auction for this question is settled. The flag
// is mirrored to the host phone through hostState.
function setCat3CanAdvance(v) {
  if (!!window._cat3CanAdvance === v) return;
  window._cat3CanAdvance = v;
  pushHostState();
}

function initCat3Room(teamA, teamB) {
  // Generate one roomId for the whole session
  cat3RoomId = `cat3_${Date.now()}`;
  const db = window._fbDb;
  const fbRef = window._fbRef;
  const fbSet = window._fbSet;
  if (!db) return;
  setTimeout(pushHostState, 300);
  // Push current lang so bid phones get it immediately
  if (fbSet && window._gameSession) fbSet(fbRef(db, `sessions/${window._gameSession}/lang`), _lang);
  fbSet(fbRef(db, `rooms/${cat3RoomId}`), {
    teamA, teamB,
    phase: 'waiting',
    questionIndex: -1,
    question: '',
    bids: { a: { value: 0, time: 0 }, b: { value: 0, time: 0 } },
    readyA: false, readyB: false,
    connected: { a: false, b: false },
    auctionWinner: null, winningBid: null,
    answers: [], gaveUp: null,
    waitingScreenUrl: G.waitingScreenUrl || null,
  });
  return cat3RoomId;
}
