  // Reset celebrate button appearance
  const btn = document.getElementById('celebration-btn');
  if (btn) { btn.style.borderColor = 'rgba(255,230,0,0.3)'; btn.style.color = 'rgba(255,230,0,0.5)'; }
}

function goToStartScreen() {
  stopAllMedia();
  // Signal all phones game ended
  pushShutdown();
  // Reset game state so next Start is a fresh game
  G.scoreA = 0; G.scoreB = 0;
  G.done = new Set();
  G.currentRound = null; G.currentQ = 0;
  G.bids = [0, 0];
  window._gameSession = null;
  window._answerRevealed = false;
  // Show setup screen
  show('setup-screen');
  document.getElementById('team-entry').style.display = 'flex';
  document.getElementById('auto-load-status').style.display = 'none';
}
function pushShutdown() {
  const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
  if (db && fbSet && fbRef && window._gameSession) {
    fbSet(fbRef(db, `sessions/${window._gameSession}/shutdown`), true);
  }
}
function closeGame() {
  pushShutdown();
  setTimeout(() => { window.location.href = 'https://www.3albalcon.com'; }, 400);
}

function resetGame() {
  pushShutdown();
  const teamA = G.teamA;
  const teamB = G.teamB;
  // Reset everything except team names
  G.scoreA = 0; G.scoreB = 0;
  G.media = { r1:[], r2:[], r4:[], r5:[] };
  G.questions = { r3:[], r6:[], r7:[], r8:[], r9:[], r10:[] };
  G.done = new Set();
  G.currentRound = null; G.currentQ = 0;
  G.bids = [0, 0];
  G.teamA = teamA; G.teamB = teamB;
  const popup = document.getElementById('reset-popup');
  if (popup) popup.remove();
  stopTimer();
  // Reload all data from Drive
  autoLoad().then(() => {
    buildMenu();
    show('menu-screen');
    showToast('🔄 تم إعادة تشغيل اللعبة!');
  });
}

// ══════════════════════════════════════════
// WINNER ANNOUNCEMENT
// ══════════════════════════════════════
// CELEBRATION — Confetti + Jingle Button
// ══════════════════════════════════════
window._jingleAudio   = null;
window._jingleFrame   = null;
window._jingleCanvas  = null;
window._jingleTimeout = null;

function _celebrationCleanup() {
  if (window._jingleTimeout)  { clearTimeout(window._jingleTimeout);          window._jingleTimeout  = null; }
  if (window._jingleFrame)    { cancelAnimationFrame(window._jingleFrame);    window._jingleFrame    = null; }
  if (window._jingleCanvas)   { window._jingleCanvas.remove();                window._jingleCanvas   = null; }
  if (window._jingleAudio)    { try { window._jingleAudio.pause(); } catch(e){} window._jingleAudio  = null; }
  const btn = document.getElementById('celebration-btn');
  if (btn) { btn.style.borderColor = 'rgba(255,230,0,0.3)'; btn.style.color = 'rgba(255,230,0,0.5)'; }
}

function playCelebration() {
  const btn = document.getElementById('celebration-btn');

  // Toggle off if already playing
  if (window._jingleAudio || window._jingleCanvas) { _celebrationCleanup(); return; }

  if (btn) { btn.style.borderColor = 'var(--neon-yellow)'; btn.style.color = 'var(--neon-yellow)'; }

  // Hard timeout — always clean up after 13s
  window._jingleTimeout = setTimeout(_celebrationCleanup, 13000);

  // Audio
  function startAudio(url) {
    window._jingleAudio = new Audio(url);
    window._jingleAudio.volume = 0.85;
    window._jingleAudio.onended = _celebrationCleanup;
    window._jingleAudio.onerror = _celebrationCleanup;
    window._jingleAudio.play().catch(_celebrationCleanup);
  }
  if (G.jingleUrl) {
    startAudio(G.jingleUrl);
  } else if (G.jingleDriveId && G.jingleScriptUrl) {
    fetch(`${G.jingleScriptUrl}?action=file&id=${G.jingleDriveId}&t=${Date.now()}`, { redirect: 'follow' })
      .then(r => r.json()).then(d => {
        if (d.data) {
          const bytes = Uint8Array.from(atob(d.data), c => c.charCodeAt(0));
          G.jingleUrl = URL.createObjectURL(new Blob([bytes], { type: d.mimeType || 'audio/mpeg' }));
          startAudio(G.jingleUrl);
        } else { _celebrationCleanup(); }
      }).catch(_celebrationCleanup);
  }

  // Spotlights from bottom + falling confetti
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  window._jingleCanvas = canvas;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Spotlights — fixed positions at bottom, beams sweep left/right
  const spotlights = [
    { baseX: W*0.15, hue: 280, phase: 0,   speed: 0.5, amp: W*0.25 },
    { baseX: W*0.35, hue: 45,  phase: 1.1, speed: 0.7, amp: W*0.22 },
    { baseX: W*0.5,  hue: 10,  phase: 2.0, speed: 0.6, amp: W*0.20 },
    { baseX: W*0.65, hue: 160, phase: 3.1, speed: 0.8, amp: W*0.22 },
    { baseX: W*0.85, hue: 200, phase: 0.7, speed: 0.5, amp: W*0.25 },
  ];

  // Confetti pieces
  const pieces = Array.from({length:120}, () => ({
    x: Math.random()*W, y: Math.random()*H - H,
    w: Math.random()*14+5, h: Math.random()*7+4,
    color: ['#FF2D78','#FFE600','#39FF14','#00EFFF','#FF8C00','#FF2D2D','#A855F7'][Math.floor(Math.random()*7)],
    speed: Math.random()*4+2, angle: Math.random()*360,
    spin: (Math.random()-0.5)*6, wobble: Math.random()*3,
    wobbleSpeed: Math.random()*0.05+0.02, wobbleAngle: Math.random()*Math.PI*2,
  }));

  const duration = 12000, start = Date.now();
  let t = 0;

  function draw() {
    if (!window._jingleCanvas) return;
    const elapsed = Date.now() - start;
    if (elapsed > duration) { _celebrationCleanup(); return; }
    const fade = elapsed > duration-2000 ? Math.max(0, 1-(elapsed-(duration-2000))/2000) : 1;

    ctx.clearRect(0, 0, W, H);

    // Draw spotlights — fixed origin at bottom, beam sweeps left/right at top
    spotlights.forEach(sp => {
      const tipX = sp.baseX + Math.sin(t * sp.speed + sp.phase) * sp.amp;
      const h = sp.hue + Math.sin(t * 0.3 + sp.phase) * 20;

      // Beam as a triangle gradient from base (bottom) to tip (top)
      const grd = ctx.createLinearGradient(sp.baseX, H, tipX, H * 0.05);
      grd.addColorStop(0, `hsla(${h},100%,65%,${0.0*fade})`);
      grd.addColorStop(0.3, `hsla(${h},100%,65%,${0.18*fade})`);
      grd.addColorStop(1, `hsla(${h},100%,75%,${0.35*fade})`);

      // Draw cone shape
      ctx.beginPath();
      ctx.moveTo(sp.baseX - 8, H);
      ctx.lineTo(sp.baseX + 8, H);
      ctx.lineTo(tipX + W*0.12, H * 0.02);
      ctx.lineTo(tipX - W*0.12, H * 0.02);
      ctx.closePath();
      ctx.fillStyle = grd;
      ctx.fill();

      // Bright tip circle/glow at top
      const tipGrd = ctx.createRadialGradient(tipX, H*0.05, 0, tipX, H*0.05, W*0.08);
      tipGrd.addColorStop(0, `hsla(${h},100%,90%,${0.4*fade})`);
      tipGrd.addColorStop(1, 'transparent');
      ctx.fillStyle = tipGrd;
      ctx.fillRect(tipX - W*0.1, 0, W*0.2, H*0.2);

      // Fixed base dot
      ctx.beginPath();
      ctx.arc(sp.baseX, H - 4, 6, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${h},100%,80%,${0.8*fade})`;
      ctx.fill();
    });

    // Draw confetti on top
    ctx.globalAlpha = fade;
    pieces.forEach(p => {
      ctx.save();
      p.wobbleAngle += p.wobbleSpeed;
      p.x += Math.sin(p.wobbleAngle)*p.wobble; p.y += p.speed; p.angle += p.spin;
      ctx.translate(p.x, p.y); ctx.rotate(p.angle*Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      if (p.y > H) { p.y = -10; p.x = Math.random()*W; }
    });
    ctx.globalAlpha = 1;
    t += 0.04;
    window._jingleFrame = requestAnimationFrame(draw);
  }
  window._jingleFrame = requestAnimationFrame(draw);
}

// ══════════════════════════════════════
// GAME FLOW — Final Winner Announcement
// ══════════════════════════════════════
function announceWinner() {
  const winnerName = G.scoreA > G.scoreB ? G.teamA : G.scoreB > G.scoreA ? G.teamB : null;
  const isTie = !winnerName;
  const msg = isTie ? '🤝 تعادل!' : t('winner', winnerName);

  // Play winner song — use pre-cached blob URL for instant playback
  let winnerAudio = null;
  if (G.winnerSongUrl) {
    winnerAudio = new Audio(G.winnerSongUrl);
    winnerAudio.volume = 0.8;
    winnerAudio.play().catch(() => {});
  } else if (G.winnerSongId && G.winnerSongScriptUrl) {
    // Not cached yet — fetch now
    fetch(`${G.winnerSongScriptUrl}?action=file&id=${G.winnerSongId}&t=${Date.now()}`, { redirect: 'follow' })
      .then(r => r.json()).then(d => {
        if (d.data) {
          const bytes = Uint8Array.from(atob(d.data), c => c.charCodeAt(0));
          const blob = new Blob([bytes], { type: d.mimeType || 'audio/mpeg' });
          G.winnerSongUrl = URL.createObjectURL(blob);
          winnerAudio = new Audio(G.winnerSongUrl);
          winnerAudio.volume = 0.8;
          winnerAudio.play().catch(() => {});
        }
      }).catch(() => {});
  }

  const overlay = document.createElement('div');
  overlay.id = 'winner-overlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,5,30,0.93);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:32px;
    opacity:0;transition:opacity 0.5s;
    overflow:hidden;
  `;

  overlay.innerHTML = `
    <div id="winner-text" style="
      font-family:'Cairo',sans-serif;
      font-size:clamp(40px,9vw,110px);
      font-weight:900;
      color:#39FF14;
      text-shadow:0 0 30px #39FF14,0 0 60px rgba(57,255,20,0.5);
      text-align:center;
      animation:pulse 0.8s infinite;
      line-height:1.2;
    ">${msg}</div>
    <div style="font-size:clamp(16px,2.5vw,24px);color:rgba(255,255,255,0.6);font-family:'Cairo',sans-serif">
      ${isTie ? `${G.scoreA} — ${G.scoreB}` : `${G.scoreA > G.scoreB ? G.scoreA : G.scoreB} نقطة`}
    </div>
    <canvas id="confetti-canvas" style="position:absolute;inset:0;pointer-events:none;width:100%;height:100%"></canvas>
  `;

  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.style.opacity = '1');

  // Confetti animation
  const canvas = overlay.querySelector('#confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const pieces = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 12 + 5,
    h: Math.random() * 6 + 4,
    color: ['#FF2D78','#FFE600','#39FF14','#00EFFF','#FF8C00','#FF2D2D'][Math.floor(Math.random()*6)],
    speed: Math.random() * 3 + 1.5,
    angle: Math.random() * 360,
    spin: (Math.random() - 0.5) * 4,
  }));

  let frame;
  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.speed;
      p.angle += p.spin;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    });
    frame = requestAnimationFrame(drawConfetti);
  }
  drawConfetti();

  // Dismiss after 10 seconds
  setTimeout(() => {
    cancelAnimationFrame(frame);
    if (winnerAudio) { winnerAudio.pause(); winnerAudio.currentTime = 0; }
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 500);
  }, 15000);
}

// ══════════════════════════════════════════
// ROULETTE
// ══════════════════════════════════════════
let rouletteTarget = null;

// ══════════════════════════════════════
// ROULETTE — Category Spinner
// ══════════════════════════════════════
function toggleRoulette() {
  const panel = document.getElementById('roulette-panel');
  const isOpen = panel.style.display === 'flex';
  panel.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) {
    document.getElementById('roulette-result').textContent = '';
    document.getElementById('roulette-go-btn').style.display = 'none';
    document.getElementById('roulette-spin-btn').innerHTML = '🎰 <span id="tr-spin1">' + (_lang==="en"?"Spin!":"دوّر!") + '</span>';
    document.getElementById('roulette-spin-btn').disabled = false;
    rouletteTarget = null;
    buildStrip();
  }
}

function closeRoulette() {
  document.getElementById('roulette-panel').style.display = 'none';
}

function buildStrip() {
  const strip = document.getElementById('roulette-strip');
  const remaining = ROUNDS.filter(r => !G.done.has(r.id));
  if (remaining.length === 0) {
    document.getElementById('roulette-result').textContent = t('allDone');
    return;
  }
  // Use exactly 10 repetitions so spinRoulette offset math works
  const items = [];
  for (let i = 0; i < 10; i++) items.push(...remaining);
  strip.innerHTML = items.map(r => `
    <div style="height:32px;display:flex;align-items:center;justify-content:center;
      font-family:'Cairo',sans-serif;font-size:17px;font-weight:700;color:#fff;
      width:100%;flex-shrink:0;padding:0 12px;text-align:center;white-space:nowrap">
      ${r.name}
    </div>
  `).join('');
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(16px)';
}

function spinRoulette() {
  const remaining = ROUNDS.filter(r => !G.done.has(r.id));
  if (remaining.length === 0) {
    document.getElementById('roulette-result').textContent = t('allDone');
    return;
  }
  // Rebuild strip fresh each spin with only unplayed categories
  buildStrip();

  const winner = remaining[Math.floor(Math.random() * remaining.length)];
  rouletteTarget = winner;

  const strip = document.getElementById('roulette-strip');
  const itemH = 32;
  // Land on repetition 7 (index 6) so there's plenty of scroll before landing
  const baseOffset = remaining.length * 6;
  const winnerIdx = baseOffset + remaining.findIndex(r => r.id === winner.id);
  const targetY = -(winnerIdx * itemH) + 16;

  strip.style.transition = 'none';
  strip.style.transform = 'translateY(16px)';

  document.getElementById('roulette-result').textContent = '';
  document.getElementById('roulette-go-btn').style.display = 'none';
  document.getElementById('roulette-spin-btn').textContent = '⏳';
  document.getElementById('roulette-spin-btn').disabled = true;

  setTimeout(() => {
    strip.style.transition = 'transform 3s cubic-bezier(0.17, 0.67, 0.12, 1.0)';
    strip.style.transform = `translateY(${targetY}px)`;
  }, 50);

  setTimeout(() => {
    document.getElementById('roulette-result').textContent = '';
    document.getElementById('roulette-go-btn').style.display = 'inline-flex';
    document.getElementById('roulette-spin-btn').innerHTML = '🎰 <span id="tr-spin1">' + (_lang==='en'?'Spin Again':'دوّر مجدداً') + '</span>';
    document.getElementById('roulette-spin-btn').disabled = false;
    pushHostState();
    const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
    if (db && fbSet) fbSet(fbRef(db, _path('rouletteResult')), { id: winner.id, name: winner.name, ts: Date.now() });
  }, 3200);
}

function goToRouletteRound() {
  if (!rouletteTarget) return;
  closeRoulette();
  // Clear roulette highlight
  const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
  if (db && fbSet) fbSet(fbRef(db, 'rouletteResult'), null);
  openRound(rouletteTarget.id);
}

// TOAST
// ══════════════════════════════════════════
let toastTimer = null;
// ══════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════
// QUESTION HELPERS — handle {q,a} objects from Excel
// ══════════════════════════════════════════
function getQ(item) {
  if (!item) return '';
  if (typeof item === 'string') return item.includes('|') ? item.split('|')[0].trim() : item;
  if (_lang === 'en' && item.q_en) return item.q_en;
  return item.q || item.q_ar || '';
}
function getA(item) {
  if (!item) return '';
  if (typeof item === 'string') return item.includes('|') ? (item.split('|')[1]||'').trim() : '';
  if (_lang === 'en' && item.a_en) return item.a_en;
  return item.a || item.a_ar || '';
}

// Dynamic font size — 23px average, scales down for long text, up for short
function dynFont(text) {
  const len = (text || '').length;
  const isTV = window.innerWidth >= 2560;
  const scale = isTV ? 1.5 : 1;
  if (len <= 20)  return Math.round(44 * scale) + 'px';
  if (len <= 40)  return Math.round(36 * scale) + 'px';
  if (len <= 70)  return Math.round(30 * scale) + 'px';
  if (len <= 100) return Math.round(25 * scale) + 'px';
  if (len <= 140) return Math.round(21 * scale) + 'px';
  return Math.round(18 * scale) + 'px';
}

// ── FORCE FULL HEIGHT when embedded in Squarespace ──
function fixHeight() {
  const vh = window.innerHeight;
  document.documentElement.style.setProperty('--real-vh', vh + 'px');
  document.querySelectorAll('.screen').forEach(s => {
    s.style.height = vh + 'px';
  });
}
window.addEventListener('resize', fixHeight);
window.addEventListener('orientationchange', fixHeight);
fixHeight();

// ── AUTO LOAD ON STARTUP ──
function setLoadProgress(pct) {
  const bar = document.getElementById('loading-bar');
  if (bar) bar.style.width = pct + '%';
}

// ── APPS SCRIPT WARM-UP PING ──
// Fire immediately on script parse — wakes up Apps Script cold start
// before the user even finishes entering team names
(function() {
  try {
    fetch(DRIVE_SCRIPT_URL + '?action=ping&t=' + Date.now(), { redirect: 'follow' })
      .catch(() => {}); // silent — we don't care about the response
  } catch(e) {}
})();

document.addEventListener('DOMContentLoaded', () => {
  autoLoad();
  applyLang(); // apply current language on load
});

// ══════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const screen = document.getElementById('game-screen');
    if(!screen.classList.contains('hidden')) nextQ();
  }
  if(e.key === 'Escape') backToMenu();
  if(e.key === ' ') {
    e.preventDefault();
    const audio = document.getElementById('audio-el');
    if(audio) toggleAudio();
    const video = document.getElementById('video-el');
    if(video) video.paused ? video.play() : video.pause();
  }
});

// ── Reliable shutdown on browser close ──
function pushShutdownSync() {
  const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
  if (!db || !fbSet || !fbRef || !window._gameSession) return;
  const url = `https://al-balcon-default-rtdb.firebaseio.com/sessions/${window._gameSession}/shutdown.json`;
  try { navigator.sendBeacon(url, JSON.stringify(true)); } catch(e) {}
  try { fbSet(fbRef(db, `sessions/${window._gameSession}/shutdown`), true); } catch(e) {}
}
window.addEventListener('beforeunload', pushShutdownSync);
window.addEventListener('pagehide', pushShutdownSync);
