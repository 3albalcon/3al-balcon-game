      <div id="winner-announce" style="font-size:clamp(24px,5vw,48px);font-weight:900;color:var(--neon-green);text-shadow:var(--glow-green);text-align:center"></div>
      <div id="answers-display" style="width:100%;display:flex;flex-direction:column;gap:8px;align-items:center"></div>
      <div id="validation-wrap" style="display:none"></div>
      <div id="score-result" style="font-size:18px;font-weight:700;text-align:center;display:none"></div>
    </div>

    <!-- FORCE SKIP button for host (stalemate) -->
    <div id="cat3-force-skip" style="display:none;margin-top:8px">
      <button onclick="forceCat3Skip('${roomId}')" style="padding:8px 24px;border-radius:100px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">
        ↩ ${_lang==='en'?'Skip question':'تجاوز السؤال'}
      </button>
    </div>

    <!-- BID FLASH OVERLAY -->
    <div id="bid-flash" style="position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.1s">
      <div id="bid-flash-text" style="font-size:clamp(60px,20vw,160px);font-weight:900;text-align:center;line-height:1"></div>
    </div>

    <div class="nav-btns" id="cat3-nav-btns" style="display:none">
      ${isLast
        ? `<button class="nav-btn primary" onclick="showResult()">${t('results')}</button>`
        : `<button class="nav-btn primary" onclick="nextCat3Question()">${t('nextQuestion')}</button>`
      }
    </div>`;

  startCat3Listener(roomId, q, qIndex, isLast);
}

function startCat3Bidding(roomId) {
  import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
    const db = window._fbDb; const fbRef = window._fbRef;
    if (!db || !fbRef) return;
    update(fbRef(db, `rooms/${roomId}`), { phase: 'countdown' });
  });
}

function showBidFlash(msg, color) {
  const overlay = document.getElementById('bid-flash');
  const text = document.getElementById('bid-flash-text');
  if (!overlay || !text) return;
  text.textContent = msg;
  text.style.color = color;
  overlay.style.background = color === '#39FF14' ? 'rgba(0,20,0,0.88)' : 'rgba(20,15,0,0.88)';
  overlay.style.opacity = '1';
  setTimeout(() => { overlay.style.opacity = '0'; }, 900);
}

let cat3BidCountdownInterval = null;
let cat3LastBidder = null;

function forceCat3Skip(roomId) {
  // Host force-skips a question with no bidder (stalemate)
  import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
    const db = window._fbDb; const fbRef = window._fbRef;
    if (!db || !fbRef) return;
    update(fbRef(db, `rooms/${roomId}`), {
      phase: 'answering',
      auctionWinner: null,
      winningBid: 0,
      answerTimerEnd: srvNow(),
      answers: [],
      gaveUp: 'skip'
    });
  });
}

function startCat3Listener(roomId, q, qIndex, isLast) {
  const db = window._fbDb;
  const fbRef = window._fbRef;
  const fbSet = window._fbSet;
  const fbUpdate = (path, data) => {
    import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => update(fbRef(db, path), data));
  };

  if (!db) return;
  if (cat3Listener) cat3Listener();

  // Kept so a deadline can re-run the handler even if no new snapshot arrives
  // (e.g. the winning team's phone was closed before its timer ran out).
  let lastData = null;
  const handle = (data) => {
    if (!data) return;

    // Reject stale snapshots left over from the previous question.
    // Firebase can deliver the old document before the reset lands.
    if (data.questionIndex !== undefined && data.questionIndex !== qIndex) return;

    const conn = data.connected || {};
    const bids = data.bids || {};
    const bidA = bids.a?.value;
    const bidB = bids.b?.value;

    // Support both data.connected.a and data.connectedA formats
    const connA = conn.a || data.connectedA || false;
    const connB = conn.b || data.connectedB || false;

    // Both connected — show start button
    if (!connA || !connB) return;

    // Show ready phase with start button when waiting or ready
    if (data.phase === 'waiting' || data.phase === 'ready') {
      const readyPhase = document.getElementById('cat3-ready-phase');
      if (readyPhase) readyPhase.style.display = 'flex';
      const startBtn = document.getElementById('cat3-start-btn');
      if (startBtn) startBtn.style.display = 'flex';
    }

    // Ready indicators
    if (data.readyA) { const d=document.getElementById('dot-ready-a'); if(d){d.style.background='#39FF14';d.style.boxShadow='0 0 10px #39FF14';} }
    if (data.readyB) { const d=document.getElementById('dot-ready-b'); if(d){d.style.background='#39FF14';d.style.boxShadow='0 0 10px #39FF14';} }

    // Both ready indicator — show on screen but host must press Start Auction
    // (removed auto-countdown — host controls timing)

    // Countdown — only trigger once
    if (data.phase === 'countdown' && !window._cat3CountdownRunning) {
      window._cat3CountdownRunning = true;
      const readyPhase = document.getElementById('cat3-ready-phase');
      const cdPhase = document.getElementById('cat3-countdown-phase');
      if (readyPhase) readyPhase.style.display = 'none';
      if (cdPhase) cdPhase.style.display = 'flex';
      let n = 3;
      const cdEl = document.getElementById('main-countdown');
      if (cdEl) cdEl.textContent = n;
      const cd = setInterval(() => {
        n--;
        if (cdEl) cdEl.textContent = n > 0 ? n : '🎯';
        if (n <= 0) {
          clearInterval(cd);
          fbUpdate(`rooms/${roomId}`, { phase: 'bidding' });
        }
      }, 1000);
    }

    // Bidding — always update bid displays regardless of phase change
    if (data.phase === 'bidding') {
      const cdPhase = document.getElementById('cat3-countdown-phase');
      const readyPhase = document.getElementById('cat3-ready-phase');
      const biddingPhase = document.getElementById('cat3-bidding-phase');
      if (cdPhase) cdPhase.style.display = 'none';
      if (readyPhase) readyPhase.style.display = 'none';
      if (biddingPhase) biddingPhase.style.display = 'flex';
      // Show question now that bidding starts
      const qTextEl = document.getElementById('q-text');
      if (qTextEl) qTextEl.style.display = 'block';
      window._cat3QuestionPlayed = true; // mark as played

      // Start 20s no-bid countdown only if no bids yet
      if (!window._cat3NoBidCountdownStarted && (!bidA || bidA === 0) && (!bidB || bidB === 0)) {
        window._cat3NoBidCountdownStarted = true;
        const noBidStart = Date.now();
        const noBidDur = 20000;
        const noBidEl = document.getElementById('no-bid-countdown');
        const noBidSecs = document.getElementById('no-bid-secs');
        const noBidFill = document.getElementById('no-bid-fill');
        if (noBidEl) noBidEl.style.display = 'flex';
        window._noBidInterval = setInterval(() => {
          // Cancel if any bid placed
          const curBidA = window._cat3CurBidA || 0;
          const curBidB = window._cat3CurBidB || 0;
          if (curBidA > 0 || curBidB > 0) {
            clearInterval(window._noBidInterval);
            if (noBidEl) noBidEl.style.display = 'none';
            return;
          }
          const rem = Math.max(0, noBidDur - (Date.now() - noBidStart));
          const secs = Math.ceil(rem / 1000);
          if (noBidSecs) noBidSecs.textContent = secs;
          if (noBidFill) noBidFill.style.width = (rem / noBidDur * 100) + '%';
          if (rem <= 0) {
            clearInterval(window._noBidInterval);
            // Auto-skip
            import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
              const db2 = window._fbDb; const fbRef2 = window._fbRef;
              if (db2 && fbRef2) update(fbRef2(db2, `rooms/${roomId}`), {
                phase: 'answering', auctionWinner: null, winningBid: 0,
                answerTimerEnd: srvNow(), answers: [], gaveUp: 'skip'
              });
            });
          }
        }, 100);
      }
      // Track current bids for the no-bid countdown AND for deciding the winner.
      // The countdown interval below closes over this snapshot, so it must read
      // these live values at expiry instead of the captured ones.
      window._cat3CurBidA = bidA || 0;
      window._cat3CurBidB = bidB || 0;
      window._cat3CurTimeA = bids.a?.time || 0;
      window._cat3CurTimeB = bids.b?.time || 0;

      // Always update bid displays
      const bidAEl = document.getElementById('bid-a');
      const bidBEl = document.getElementById('bid-b');
      if (bidAEl) bidAEl.textContent = bidA !== undefined && bidA > 0 ? bidA : '—';
      if (bidBEl) bidBEl.textContent = bidB !== undefined && bidB > 0 ? bidB : '—';

      // Handle new countdown
      if (data.bidCountdownEnd && data.lastBidder && data.bidCountdownEnd !== cat3LastBidCountdownEnd) {
        cat3LastBidder = data.lastBidder;
        cat3LastBidCountdownEnd = data.bidCountdownEnd;
        clearInterval(cat3BidCountdownInterval);

        // Name the team that actually leads (two bids can cross in flight, so
        // lastBidder is not always the leader)
        const lead = cat3Leader(bidA || 0, bidB || 0, bids.a?.time, bids.b?.time) || data.lastBidder;
        const winnerName = lead === 'a' ? G.teamA : G.teamB;
        const waitingName = lead === 'a' ? G.teamB : G.teamA;
        const bidVal = lead === 'a' ? bidA : bidB;

        // Flash on main screen
        showBidFlash(`${bidVal} 🔥`, lead === 'a' ? '#E50158' : '#E2DA51');
        document.getElementById('bid-event-msg').textContent = _lang==="en"?`🔥 ${winnerName} bid ${bidVal} — ${waitingName} has 10 seconds to respond!`:`🔥 ${winnerName} زايد ${bidVal} — ${waitingName} لديه 10 ثواني للرد!`;

        const numEl = document.getElementById('bid-countdown-num');
        const labelEl = document.getElementById('bid-countdown-label');
        numEl.style.display = 'block';
        labelEl.style.display = 'block';
        labelEl.textContent = _lang==="en"?`${waitingName} needs to respond`:`${waitingName} تحتاج أن ترد`;

        cat3BidCountdownInterval = setInterval(() => {
          const remaining = Math.max(0, Math.ceil((data.bidCountdownEnd - srvNow()) / 1000));
          numEl.textContent = remaining;
          if (remaining <= 0) {
            clearInterval(cat3BidCountdownInterval);
            numEl.style.display = 'none';
            labelEl.style.display = 'none';
            // Winner = highest bid. On a tie the team that got there first wins.
            // Read the LIVE values — the snapshot this interval closed over can be
            // several bids out of date by the time it expires.
            if (data.phase === 'bidding' && data.bidCountdownEnd === cat3LastBidCountdownEnd) {
              const vA = window._cat3CurBidA || 0, vB = window._cat3CurBidB || 0;
              const winner = cat3Leader(vA, vB, window._cat3CurTimeA, window._cat3CurTimeB) || 'a';
              const winnerBid = winner === 'a' ? vA : vB;
              fbUpdate(`rooms/${roomId}`, {
                phase: 'answering',
                auctionWinner: winner,
                winningBid: winnerBid,
                // Deadline to tap "Start writing"; the phone replaces it with the
                // real 60s writing deadline when the team taps it.
                answerTimerEnd: srvNow() + 60000,
                answers: []
              });
            }
          }
        }, 100);
      }

      // Draw: the team that reached the number first keeps the lead
      if (bidA > 0 && bidA === bidB) {
        const lead = cat3Leader(bidA, bidB, bids.a?.time, bids.b?.time);
        const leadName = lead === 'a' ? G.teamA : G.teamB;
        const otherName = lead === 'a' ? G.teamB : G.teamA;
        const msgEl = document.getElementById('bid-event-msg');
        if (msgEl) msgEl.textContent = _lang==='en'
          ? `⚖️ ${otherName} matched ${bidA} — ${leadName} still leads (reached ${bidA} first)`
          : `⚖️ ${otherName} عادل ${bidA} — ${leadName} لا يزال متقدماً (وصل إلى ${bidA} أولاً)`;
      }
    }

    // Answering phase
    if (data.phase === 'answering') {
      clearInterval(cat3BidCountdownInterval);
      if (window._noBidInterval) { clearInterval(window._noBidInterval); window._noBidInterval = null; }
      document.getElementById('cat3-bidding-phase').style.display = 'none';
      document.getElementById('cat3-winner-phase').style.display = 'flex';
      const winner = data.auctionWinner;

      // No bids — show skip message and nav button, no score
      if (!winner) {
        document.getElementById('winner-announce').textContent = _lang==='en' ? '⏩ No bids — moving to next question' : '⏩ لا مزايدات — ننتقل للسؤال التالي';
        const nav = document.getElementById('cat3-nav-btns');
        if (nav) nav.style.display = 'flex';
        setCat3CanAdvance(true);
        window._pendingCat3Score = null; // no score for skipped question
        return;
      }

      const winnerName = winner === 'a' ? G.teamA : G.teamB;
      const winnerBid = data.winningBid || 1;
      // Show question at top of winner area
      const winnerArea = document.getElementById('cat3-winner-phase');
      if (winnerArea && !document.getElementById('winner-q-display')) {
        const qDisplay = document.createElement('div');
        qDisplay.id = 'winner-q-display';
        qDisplay.style.cssText = 'width:100%;text-align:center;font-size:18px;font-weight:700;color:var(--neon-cyan);text-shadow:var(--glow-cyan);padding:12px 16px;background:rgba(0,239,255,0.06);border:2px solid var(--neon-cyan);border-radius:14px;';
        qDisplay.textContent = q;
        winnerArea.insertBefore(qDisplay, winnerArea.firstChild);
      }
      document.getElementById('winner-announce').textContent = t('auctionWon', winnerName, winnerBid);

      // Replace timer area with countdown timer for answering phase
      if (!document.getElementById('main-ans-timer')) {
        const timerDiv = document.createElement('div');
        timerDiv.id = 'main-ans-timer';
        timerDiv.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:8px 0';
        timerDiv.innerHTML = `
          <div style="font-size:13px;font-weight:700;color:rgba(200,224,255,0.5);letter-spacing:2px;text-align:center;text-transform:uppercase">
            ${_lang === 'en' ? 'Time to write' : 'وقت الكتابة'}
          </div>
          <div id="main-ans-secs" style="font-size:68px;font-weight:900;color:var(--neon-green);text-shadow:var(--glow-green);line-height:1">60</div>
          <div style="width:100%;max-width:400px;height:8px;background:rgba(255,255,255,0.08);border-radius:100px;overflow:hidden">
            <div id="main-ans-fill" style="height:100%;width:100%;background:var(--neon-green);border-radius:100px;transition:width 0.3s linear"></div>
          </div>`;
        document.getElementById('winner-announce').after(timerDiv);

        // Start countdown ONLY when player taps "Start Writing" (writingStarted: true)
        if (data.writingStarted && data.answerTimerEnd && !window._cat3AnsTimerStarted) {
          window._cat3AnsTimerStarted = true;
          const timerEnd = data.answerTimerEnd;
          window._cat3AnsTimerInterval = setInterval(() => {
            // Stop if answers confirmed
            if (window._cat3AnswersConfirmed) {
              clearInterval(window._cat3AnsTimerInterval);
              window._cat3AnsTimerInterval = null;
              const secsEl = document.getElementById('main-ans-secs');
              if (secsEl) secsEl.style.color = 'rgba(255,255,255,0.3)';
              return;
            }
            const rem = Math.max(0, timerEnd - srvNow());
            const secs = Math.ceil(rem / 1000);
            const pct = (rem / 60000) * 100;
            const secsEl = document.getElementById('main-ans-secs');
            const fillEl = document.getElementById('main-ans-fill');
            if (secsEl) { secsEl.textContent = secs; secsEl.style.color = pct < 25 ? 'var(--neon-red)' : 'var(--neon-green)'; }
            if (fillEl) { fillEl.style.width = pct + '%'; fillEl.style.background = pct < 25 ? 'var(--neon-red)' : 'var(--neon-green)'; }
            if (rem <= 0) { clearInterval(window._cat3AnsTimerInterval); window._cat3AnsTimerInterval = null; }
          }, 100);
        }
      }

      // Show answers in compact grid — max 25, no scroll, RTL if Arabic
      const answers = data.answers || [];
      const display = document.getElementById('answers-display');
      const answersConfirmed = data.answersConfirmed || false;
      const ansTimeUp = data.answerTimerEnd && data.answerTimerEnd <= srvNow();

      // Deadline handling that doesn't depend on the phone still being open:
      // re-check a moment after the deadline, and if writing had started but the
      // phone never confirmed, lock the answers ourselves so they get judged.
      if (!answersConfirmed && data.answerTimerEnd) {
        const graceLeft = data.answerTimerEnd + 2500 - srvNow();
        if (graceLeft > 0) {
          window._cat3RecheckLater?.(graceLeft + 50);
        } else if (data.writingStarted && !window._cat3AutoConfirmSent) {
          window._cat3AutoConfirmSent = true;
          fbUpdate(`rooms/${roomId}`, { answersConfirmed: true });
        }
      }
      const showResults = answersConfirmed; // only show ✅/❌ buttons after confirmed

      // Determine columns based on count
      // Scale columns to fit max 25 answers: 1→5, 6→10→2col, 11→15→3col, 16→20→4col, 21→25→5col
      // Readable from across the room: big text for few answers, smaller only as
      // the count grows (still fits 25 without scrolling). Text wraps, no "…".
      const n = answers.length;
      const cols = n <= 4 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : n <= 20 ? 4 : 5;
      const fs = n <= 4 ? 'clamp(22px,3vw,40px)' : n <= 8 ? 'clamp(18px,2.4vw,32px)' : n <= 15 ? 'clamp(15px,1.8vw,24px)' : 'clamp(13px,1.4vw,19px)';
      const pad = n <= 8 ? '8px 14px' : '5px 8px';
      display.style.cssText = `width:100%;max-width:${cols === 1 ? '900px' : '100%'};margin:0 auto;display:grid;grid-template-columns:repeat(${cols},1fr);gap:${n <= 8 ? 8 : 5}px;`;

      if (answers.length > 0) {
        display.innerHTML = answers.map((a, i) => {
          // Handle both plain string and {text, status} formats
          const txt     = typeof a === 'string' ? a : (a.text || '');
          const status  = typeof a === 'string' ? 'pending' : (a.status || 'pending');
          const isCorrect = status === 'correct';
          const isWrong   = status === 'wrong';
          const isPending = status === 'pending';
          const isArabic = /[\u0600-\u06FF]/.test(txt);
          const dir = isArabic ? 'rtl' : 'ltr';
          const bg  = isCorrect ? 'rgba(57,255,20,0.08)' : isWrong ? 'rgba(255,45,45,0.08)' : 'rgba(255,255,255,0.04)';
          const bdr = isCorrect ? 'var(--neon-green)' : isWrong ? 'var(--neon-red)' : 'rgba(255,255,255,0.12)';
          return `
            <div style="display:flex;align-items:center;gap:8px;padding:${pad};border-radius:10px;
              background:${bg};border:2px solid ${bdr};font-size:${fs}">
              <span style="font-size:0.6em;color:rgba(255,255,255,0.4);flex-shrink:0;min-width:1.4em">${i+1}.</span>
              <span style="flex:1;font-weight:900;color:#fff;direction:${dir};
                white-space:normal;word-break:break-word;line-height:1.25" title="${escHTML(txt)}">${escHTML(txt)}</span>
              <span style="font-size:0.8em;flex-shrink:0">${isPending?'⏳':isCorrect?'✅':'❌'}</span>
              ${showResults ? `
              <button data-i="${i}" data-s="correct" onclick="overrideVal(this)"
                style="padding:1px 4px;border-radius:4px;border:1px solid var(--neon-green);
                background:${isCorrect?'rgba(57,255,20,0.25)':'rgba(57,255,20,0.04)'};
                color:var(--neon-green);font-family:'Cairo',sans-serif;font-size:10px;cursor:pointer;flex-shrink:0">✅</button>
              <button data-i="${i}" data-s="wrong" onclick="overrideVal(this)"
                style="padding:1px 4px;border-radius:4px;border:1px solid var(--neon-red);
                background:${isWrong?'rgba(255,45,45,0.25)':'rgba(255,45,45,0.04)'};
                color:var(--neon-red);font-family:'Cairo',sans-serif;font-size:10px;cursor:pointer;flex-shrink:0">❌</button>` : ''}
            </div>`;
        }).join('');
      } else {
        display.innerHTML = '';
      }

      // Auto-validate only AFTER answers are confirmed (cannot be changed)
      if (answersConfirmed) {
        const pendingAnswers = answers.filter(a => !a.status || a.status === 'pending');
        if (pendingAnswers.length > 0) {
          autoValidateAnswers(answers, roomId, q, winnerBid, winner, winnerName);
        }
      }

      // Hide the old separate validation section
      const valWrap = document.getElementById('validation-wrap');
      if (valWrap) valWrap.style.display = 'none';

      // Stop timer when answers confirmed — freeze display
      if (data.answersConfirmed) {
        window._cat3AnswersConfirmed = true;
        window._cat3AnsTimerStarted = true; // prevent restart
        if (window._cat3AnsTimerInterval) { clearInterval(window._cat3AnsTimerInterval); window._cat3AnsTimerInterval = null; }
        if (window._cat3AnsTimerInterval2) { clearInterval(window._cat3AnsTimerInterval2); window._cat3AnsTimerInterval2 = null; }
        const secsEl = document.getElementById('main-ans-secs');
        if (secsEl) secsEl.style.color = 'rgba(255,255,255,0.3)';
      }

      // Update timer when writing starts — only if not yet confirmed
      if (data.writingStarted && data.answerTimerEnd && !window._cat3AnsTimerStarted && !data.answersConfirmed) {
        window._cat3AnsTimerStarted = true;
        const timerEnd = data.answerTimerEnd;
        window._cat3AnsTimerInterval2 = setInterval(() => {
          // Stop immediately if confirmed
          if (window._cat3AnswersConfirmed) {
            clearInterval(window._cat3AnsTimerInterval2);
            window._cat3AnsTimerInterval2 = null;
            const secsEl = document.getElementById('main-ans-secs');
            if (secsEl) secsEl.style.color = 'rgba(255,255,255,0.3)';
            return;
          }
          const rem = Math.max(0, timerEnd - srvNow());
          const secs = Math.ceil(rem / 1000);
          const pct = (rem / 60000) * 100;
          const secsEl = document.getElementById('main-ans-secs');
          const fillEl = document.getElementById('main-ans-fill');
          if (secsEl) { secsEl.textContent = secs; secsEl.style.color = pct < 25 ? 'var(--neon-red)' : 'var(--neon-green)'; }
          if (fillEl) { fillEl.style.width = pct + '%'; fillEl.style.background = pct < 25 ? 'var(--neon-red)' : 'var(--neon-green)'; }
          if (rem <= 0) { clearInterval(window._cat3AnsTimerInterval2); window._cat3AnsTimerInterval2 = null; }
        }, 100);
      }

      window._currentCat3Room = roomId;

      // Show score and nav button
      if (answers.length > 0) {
        // Answers arrive from the phone as plain strings and only become
        // {text,status} objects after validation — normalise before counting.
        const statusOf = a => (typeof a === 'string' ? 'pending' : (a.status || 'pending'));
        const allDone = answers.every(a => statusOf(a) === 'correct' || statusOf(a) === 'wrong');
        const correct = answers.filter(a => statusOf(a) === 'correct').length;
        const scoreEl = document.getElementById('score-result');
        const nav = document.getElementById('cat3-nav-btns');

        if (allDone && scoreEl) {
          scoreEl.style.display = 'block';
          scoreEl.style.color = correct >= winnerBid ? 'var(--neon-green)' : 'var(--neon-red)';
          scoreEl.textContent = correct >= winnerBid
            ? `✅ ${winnerName} ${_lang==="en"?"answered":"أجاب"} ${correct}/${winnerBid} ${_lang==="en"?"correct — +4 pts":"صح — +4 نقاط"}`
            : `❌ ${winnerName} ${_lang==="en"?"answered only":"أجاب"} ${correct}/${winnerBid} ${_lang==="en"?"— -2 pts":"فقط — -2 نقاط"}`;
          window._pendingCat3Score = { winner, correct, winnerBid };
          if (nav) nav.style.display = 'flex';
          setCat3CanAdvance(true);
        } else if (answersConfirmed || ansTimeUp) {
          // Validation still in flight. Keep the running score up to date on every
          // snapshot, and tell the host so they don't advance on a half-scored round.
          const tentativeCorrect = answers.filter(a => statusOf(a) === 'correct').length;
          window._pendingCat3Score = { winner, correct: tentativeCorrect, winnerBid };
          if (scoreEl) {
            scoreEl.style.display = 'block';
            scoreEl.style.color = 'var(--neon-yellow)';
            scoreEl.textContent = _lang === 'en'
              ? '⏳ Checking answers… you can also judge them yourself'
              : '⏳ جاري التحقق من الأجوبة… يمكنك أيضاً الحكم عليها بنفسك';
          }
          if (nav) nav.style.display = 'flex';
          setCat3CanAdvance(true);
        }
      } else if (answersConfirmed || ansTimeUp) {
        // No answers submitted
        const scoreEl = document.getElementById('score-result');
        if (scoreEl) {
          scoreEl.style.display = 'block';
          scoreEl.style.color = 'var(--neon-red)';
          scoreEl.textContent = `❌ ${winnerName} ${_lang==="en"?"submitted no answers — -2 pts":"لم يجب — -2 نقاط"}`;
          window._pendingCat3Score = { winner, correct: 0, winnerBid };
        }
        const nav = document.getElementById('cat3-nav-btns');
        if (nav) nav.style.display = 'flex';
        setCat3CanAdvance(true);
      }
    }

    // Give up / skip
    if (data.gaveUp) {
      const msgEl = document.getElementById('bid-event-msg') || document.getElementById('winner-announce');
      if (msgEl) {
        if (data.gaveUp === 'skip') {
          msgEl.textContent = _lang==='en' ? '⏩ Question skipped — no bids' : '⏩ تم تجاوز السؤال — لا مزايدات';
        } else {
          const gaveUpName = data.gaveUp === 'a' ? G.teamA : G.teamB;
          msgEl.textContent = t('gaveUp', gaveUpName);
        }
      }
    }

    // Handle null winner (skipped question) — show nav button immediately
    if (data.phase === 'answering' && data.auctionWinner === null) {
      const biddingEl = document.getElementById('cat3-bidding-phase');
      const winnerEl  = document.getElementById('cat3-winner-phase');
      if (biddingEl) biddingEl.style.display = 'none';
      if (winnerEl)  winnerEl.style.display  = 'flex';
      const winnerAnn = document.getElementById('winner-announce');
      if (winnerAnn) winnerAnn.textContent = _lang==='en' ? '⏩ No bids — question skipped' : '⏩ لا مزايدات — تم تجاوز السؤال';
      const nav = document.getElementById('cat3-nav-btns');
      if (nav) nav.style.display = 'flex';
      setCat3CanAdvance(true);
    }
  };

  cat3Listener = window._fbOnValue(fbRef(db, `rooms/${roomId}`), (snap) => {
    lastData = snap.val();
    handle(lastData);
  });

  // Re-check the room shortly after its writing deadline
  window._cat3RecheckLater = (ms) => {
    clearTimeout(window._cat3DeadlineTimer);
    window._cat3DeadlineTimer = setTimeout(() => {
      if (window._cat3QuestionIndex === qIndex && lastData) handle(lastData);
    }, ms);
  };
}

// ── AI VALIDATION via Cloudflare Worker ──
const WORKER_URL = 'https://3al-balcon-proxy.raed-harb.workers.dev';
const _validatingSet = new Set();
let _cat3ValidationRun = null;   // marks the question whose validation already started

async function autoValidateAnswers(answers, roomId, question, winnerBid, winner, winnerName) {
  const db = window._fbDb;
  const fbRef = window._fbRef;
  if (!db) return;

  // Run at most ONCE per question. Without this the listener re-fires on our own
  // write, sees the answers still pending, and calls back in — an endless write
  // loop that makes the grid flicker and hammers Firebase.
  const runKey = `${roomId}#${window._cat3QuestionIndex}`;
  if (_cat3ValidationRun === runKey) return;
  _cat3ValidationRun = runKey;
  const myQIdx = window._cat3QuestionIndex;

  const { update, get } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js");

  // Normalize plain strings -> {text,status}. Only write if it actually changes
  // something, so we don't bounce our own snapshot back through the listener.
  const normalized = answers.map(a => typeof a === 'string' ? { text: a, status: 'pending' } : { ...a });
  let needsNormalize = answers.some(a => typeof a === 'string');
  // The same answer only counts once: later repeats are marked wrong up front
  // (the host can still override).
  const seen = new Set();
  normalized.forEach(a => {
    const k = normAnswer(a.text);
    if (k && seen.has(k)) {
      if (a.status !== 'wrong') { a.status = 'wrong'; a.dup = true; needsNormalize = true; }
    } else if (k) seen.add(k);
  });
  if (needsNormalize) await update(fbRef(db, `rooms/${roomId}`), { answers: normalized });

  // Ask the AI about every answer in parallel
  const results = await Promise.all(normalized.map(async (ans, i) => {
    if (ans.status && ans.status !== 'pending') return null;
    const key = `${roomId}_${myQIdx}_${i}_${ans.text}`;
    if (_validatingSet.has(key)) return null;
    _validatingSet.add(key);
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, answer: ans.text })
      });
      if (!response.ok) return null;
      const data = await response.json();
      const status = data.status || 'pending';
      return status === 'pending' ? null : { i, status };
    } catch (e) { return null; }
  }));

  // Question moved on while we were waiting — drop the results
  if (window._cat3QuestionIndex !== myQIdx) return;

  const decided = results.filter(Boolean);
  if (!decided.length) return;

  // Merge onto the LIVE answers, never the stale copy, so a judgement the host
  // made by hand while the AI was thinking is not overwritten.
  const snap = await get(fbRef(db, `rooms/${roomId}/answers`));
  const live = (snap.val() || normalized).map(a => typeof a === 'string' ? { text: a, status: 'pending' } : a);
  let changed = false;
  decided.forEach(({ i, status }) => {
    if (live[i] && (!live[i].status || live[i].status === 'pending')) {
      live[i] = { text: live[i].text, status };
      changed = true;
    }
  });
  if (changed) await update(fbRef(db, `rooms/${roomId}`), { answers: live });
}

// Override validation result
function overrideVal(btn) {
  const idx = parseInt(btn.dataset.i);
  const status = btn.dataset.s;
  validateCat3(idx, status, window._currentCat3Room);
}

async function validateCat3(idx, status, roomId) {
  const db = window._fbDb; const fbRef = window._fbRef;
  if (!db) return;
  const { get, update } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js");
  const snap = await get(fbRef(db, `rooms/${roomId}/answers`));
  const answers = (snap.val() || []).map(a => typeof a === 'string' ? { text: a, status: 'pending' } : a);
  if (answers[idx]) {
    answers[idx] = { text: answers[idx].text, status };
    await update(fbRef(db, `rooms/${roomId}`), { answers });
  }
}

function nextCat3Question() {
  if (!window._cat3QuestionPlayed) { showToast(t('startFirst')); return; }
  if (!window._cat3CanAdvance) { showToast(_lang==='en' ? 'Finish this auction first' : 'أنهِ هذا المزاد أولاً'); return; }
  window._cat3QuestionPlayed = false;
  if (window._pendingCat3Score) {
    const { winner, correct, winnerBid } = window._pendingCat3Score;
    if (correct >= winnerBid) addScore(winner, 4); else addScore(winner, -2);
    window._pendingCat3Score = null;
  }
  // Clear local flags and timers
  cat3LastBidder = null;
  window._cat3CountdownRunning = false;
  window._cat3AnsTimerStarted = false;
  window._cat3AnswersConfirmed = false;
  window._cat3ForceSkipShown = false;
  _validatingSet.clear();
  _cat3ValidationRun = null;                 // stop stale AI validation callbacks
  cat3LastBidCountdownEnd = null;
  window._cat3NoBidCountdownStarted = false;
  window._cat3CurBidA = 0; window._cat3CurBidB = 0;
  window._cat3CurTimeA = 0; window._cat3CurTimeB = 0;
  window._cat3AutoConfirmSent = false;
  clearTimeout(window._cat3DeadlineTimer);
  setCat3CanAdvance(false);
  clearInterval(cat3BidCountdownInterval);
  if (window._noBidInterval) { clearInterval(window._noBidInterval); window._noBidInterval = null; }
  if (window._cat3AnsTimerInterval) { clearInterval(window._cat3AnsTimerInterval); window._cat3AnsTimerInterval = null; }
  if (window._cat3AnsTimerInterval2) { clearInterval(window._cat3AnsTimerInterval2); window._cat3AnsTimerInterval2 = null; }
  // Clear visual state
  const elId = id => document.getElementById(id);
  if (elId('winner-announce')) elId('winner-announce').textContent = '';
  if (elId('answers-display')) elId('answers-display').innerHTML = '';
  if (elId('cat3-winner-phase')) elId('cat3-winner-phase').style.display = 'none';
  if (elId('cat3-bidding-phase')) elId('cat3-bidding-phase').style.display = 'none';
  if (elId('cat3-nav-btns')) elId('cat3-nav-btns').style.display = 'none';
  if (elId('main-ans-timer')) elId('main-ans-timer').remove();
  if (elId('winner-q-display')) elId('winner-q-display').remove();
  if (elId('score-result')) { elId('score-result').textContent = ''; elId('score-result').style.display = 'none'; }
  if (elId('bid-event-msg')) elId('bid-event-msg').textContent = '';
  if (elId('no-bid-countdown')) elId('no-bid-countdown').style.display = 'none';
  if (elId('bid-countdown-num')) elId('bid-countdown-num').style.display = 'none';
  if (elId('bid-countdown-label')) elId('bid-countdown-label').style.display = 'none';

  const db = window._fbDb; const fbRef = window._fbRef;
  if (db && cat3RoomId) {
    const qIdx = (window._cat3QuestionIndex ?? -1) + 1;
    import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(async ({ update }) => {
      // Step 1: tell the phones a new question is coming so they show the wait screen
      await update(fbRef(db, `rooms/${cat3RoomId}`), { phase: 'nextquestion', questionIndex: qIdx });
      // Step 2: wipe every per-question field. MUST complete before the slide
      // advances, otherwise the new listener reads the previous question's data.
      await update(fbRef(db, `rooms/${cat3RoomId}`), {
        phase: 'ready',
        questionIndex: qIdx,
        readyA: false, readyB: false,
        bids: { a: { value: 0, time: 0 }, b: { value: 0, time: 0 } },
        lastBidder: null, bidCountdownEnd: null,
        auctionWinner: null, winningBid: null,
        answers: [], gaveUp: null,
        answersConfirmed: false,
        writingStarted: false,
        answerTimerEnd: null,
        connectedA: true, connectedB: true,
        teamA: G.teamA, teamB: G.teamB,
      });
      // Step 3: only now advance — renderBidding rebuilds the DOM and re-registers
      // the listener, which will read the clean document.
      nextQ();
    });
  } else {
    nextQ();
  }
}

function cat6PlayVideo(qIndex) {
  const item = G.media.r5?.[qIndex];
  if (!item) return;
  const container = document.getElementById('video-container-' + qIndex);
  if (!container) return;
  let fileName = item.name || '';
  if (fileName && !fileName.includes('.')) fileName = fileName + '.mp4';
  const src = fileName
    ? `https://3albalcon.github.io/3al-balcon-game/videos/${encodeURIComponent(fileName)}`
    : item.url || '';
  container.innerHTML = `
    <video autoplay controls playsinline
      style="width:100%;height:100%;display:block;object-fit:contain;background:#000;"
      id="video-el-${qIndex}">
      <source src="${src}" type="video/mp4">
    </video>`;
  container.style.cursor = 'default';
  container.onclick = null;
  // Replaying never re-opens a question that was already shown / revealed
  if (!window._cat6Phase || window._cat6Phase === 'video') window._cat6Phase = 'video';

    const showBtn = document.getElementById('cat6-show-q-btn');
    if (showBtn) showBtn.style.display = 'flex';

function cat6ShowQuestion(qIndex) {
  if (window._cat6Phase !== 'video') return;   // shown once per question
  window._cat6Phase = 'question';
  pushHostState();
  const container = document.getElementById('video-container-' + qIndex);
  const showBtn = document.getElementById('cat6-show-q-btn');
  const qArea = document.getElementById('video-question-area');
  const vid = document.getElementById('video-el-' + qIndex);
  if (vid) vid.pause();
  if (container) container.style.display = 'none';
  if (showBtn) showBtn.style.display = 'none';
  if (qArea) qArea.style.display = 'flex';
  startTimer(30);

  // Push question to Firebase so phones show it
  const roomId = window._cat6RoomId;
  const q = window._cat6Q;
  if (roomId && q) {
    import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
      const db = window._fbDb; const fbRef = window._fbRef;
      if (db && fbRef) update(fbRef(db, `cat6/${roomId}`), {
        phase: 'active', question: q,
        timerEnd: Date.now() + 30000,
        answerA: null, answerB: null
      });
    });
    // Listen for answers (one listener per question)
    if (window._cat6AnswersUnsub) window._cat6AnswersUnsub();
    window._cat6AnswersUnsub = window._fbOnValue(window._fbRef(window._fbDb, `cat6/${roomId}`), (snap) => {
      const d = snap.val(); if (!d) return;
      // Store timestamps for first-submit scoring
      if (d.answeredAtA) window._cat6TimestampA = d.answeredAtA;
      if (d.answeredAtB) window._cat6TimestampB = d.answeredAtB;
      const subA = document.getElementById('cat6-sub-a');
      const subB = document.getElementById('cat6-sub-b');
      if (subA && d.answerA) subA.style.display = 'block';
      if (subB && d.answerB) subB.style.display = 'block';
      // When both answered or timer ends show reveal button
      if (d.answerA && d.answerB) {
        stopTimer();
        showCat6AnswerReveal();
      }
    });
  }
}

function showCat6AnswerReveal() {
  const revealBtn = document.getElementById('cat6-reveal-btn');
  if (revealBtn) revealBtn.style.display = 'flex';
}

function cat6RevealAnswer() {
  // The answer is revealed once per question, and only after the question was
  // shown. A second reveal (e.g. from the host phone) must not rebuild the
  // judging area — that used to allow judging the same answers twice.
  if (window._cat6Phase !== 'question') return;
  window._cat6Phase = 'answer';
  window._answerRevealed = true;
  unlockNextButton();
  stopTimer();
  if (window._cat6AnswersUnsub) { window._cat6AnswersUnsub(); window._cat6AnswersUnsub = null; }

  const area = document.getElementById('vq-answer-area');
  const ans = window._cat6A || '';
  const roomId = window._cat6RoomId;
  const db = window._fbDb; const fbRef = window._fbRef;

  const build = (d) => {
    const txtA = (d.answerA || '').toString().trim();
    const txtB = (d.answerB || '').toString().trim();
    window._cat6TsA = d.answeredAtA || null;
    window._cat6TsB = d.answeredAtB || null;
    // No answer written = wrong, decided automatically and not changeable
    window._cat6NoAnswer = { a: !txtA, b: !txtB };
    if (!txtA) window._cat6Judgement.a = false;
    if (!txtB) window._cat6Judgement.b = false;

    const teamBox = (team) => {
      const name = team === 'a' ? G.teamA : G.teamB;
      const color = team === 'a' ? '#E50158' : '#E2DA51';
      const rgb = team === 'a' ? '229,1,88' : '226,218,81';
      const txt = team === 'a' ? txtA : txtB;
      return `
        <div id="cat6-box-${team}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:12px;background:rgba(${rgb},0.08);border:1.5px solid rgba(${rgb},0.3);transition:all 0.3s;min-width:0">
          <div id="cat6-name-${team}" style="font-size:clamp(14px,1.8vw,20px);color:${color};font-weight:900;transition:all 0.3s">${escHTML(name)}</div>
          <div style="font-size:clamp(18px,2.6vw,30px);font-weight:900;color:${txt ? '#fff' : 'rgba(255,255,255,0.35)'};text-align:center;word-break:break-word">${txt ? escHTML(txt) : (_lang==='en' ? 'No answer' : 'لا جواب')}</div>
          <div id="cat6-judge-${team}" style="display:flex;gap:6px;align-items:center;justify-content:center;min-height:36px"></div>
        </div>`;
    };

    if (area) area.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
        <div class="answer-box fade-in" style="display:inline-block;width:auto;max-width:90%;align-self:center;font-size:clamp(18px,2.6vw,28px) !important">
          ${_lang==='en'?'✅ Answer':'✅ الجواب'}: ${escHTML(ans)}
        </div>
        <div style="display:flex;gap:12px;width:100%;align-items:stretch">
          ${teamBox('a')}
          <div id="cat6-result-center" style="display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px;min-width:90px;text-align:center">
            <div id="cat6-result-emoji" style="font-size:32px;line-height:1"></div>
            <div id="cat6-result-text" style="font-size:13px;font-weight:900;text-align:center"></div>
          </div>
          ${teamBox('b')}
        </div>
      </div>`;

    // Apply the automatic "no answer" verdicts (and any points they imply)
    cat6SetJudgement('a', window._cat6Judgement.a);
    cat6SetJudgement('b', window._cat6Judgement.b);
  };

  if (db && fbRef && roomId) {
    import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ get, update }) => {
      get(fbRef(db, `cat6/${roomId}`)).then(snap => build(snap.val() || {}));
      update(fbRef(db, `cat6/${roomId}`), { phase: 'answer' });
    });
  } else {
    build({});
  }
}

// ── Cat 6 judging ──
// One verdict per team per question, given from the TV or the host phone and
// shown on both. Judging opens only once the answer is revealed. The 3 points
// always follow the current verdicts: changing a verdict moves (or removes)
// the points instead of stacking or losing them.
function cat6Winner() {
  const J = window._cat6Judgement || {};
  if (J.a === undefined || J.b === undefined) return null;
  if (J.a && J.b) {
    // Both correct — fastest wins
    const tsA = window._cat6TsA || window._cat6TimestampA || 0;
    const tsB = window._cat6TsB || window._cat6TimestampB || 0;
    if (tsA && tsB) return tsA <= tsB ? 'a' : 'b';
    return (tsB && !tsA) ? 'b' : 'a';
  }
  if (J.a) return 'a';
  if (J.b) return 'b';
  return null; // both wrong
}

function cat6SetJudgement(team, verdict) { // verdict: true | false | null/undefined (clear)
  if (team !== 'a' && team !== 'b') return;
  if (window._cat6Phase !== 'answer') return;           // reveal first
  if (!window._cat6Judgement) window._cat6Judgement = {};
  if (window._cat6NoAnswer?.[team]) verdict = false;     // no answer is always wrong
  if (verdict === null || verdict === undefined) delete window._cat6Judgement[team];
  else window._cat6Judgement[team] = !!verdict;

  const winner = cat6Winner();
  const prev = window._cat6Award || null;
  if ((prev ? prev.team : null) !== winner) {
    if (prev) addScore(prev.team, -prev.applied);
    window._cat6Award = winner ? { team: winner, applied: addScore(winner, 3) } : null;
  }
  renderCat6JudgeUI();
  pushHostState();
}

function cat6Judge(team, isCorrect) { cat6SetJudgement(team, isCorrect); }
function cat6UndoJudge(team) { cat6SetJudgement(team, null); }

function renderCat6JudgeUI() {
  const J = window._cat6Judgement || {};
  const btn = (bg, bd, col, label, onclick) =>
    `<button onclick="${onclick}" style="padding:6px 14px;border-radius:8px;border:2px solid ${bd};color:${col};background:${bg};font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">${label}</button>`;
  ['a', 'b'].forEach(team => {
    const box = document.getElementById(`cat6-judge-${team}`);
    if (!box) return;
    const j = J[team];
    if (window._cat6NoAnswer?.[team]) {
      box.innerHTML = `<span style="font-size:14px;font-weight:900;color:#FF2D2D">❌ ${_lang==='en'?'Wrong':'خطأ'}</span>`;
    } else if (j === undefined) {
      box.innerHTML = btn('rgba(57,255,20,0.08)', '#39FF14', '#39FF14', t('correct'), `cat6Judge('${team}',true)`)
                    + btn('rgba(255,45,45,0.08)', '#FF2D2D', '#FF2D2D', t('wrong'), `cat6Judge('${team}',false)`);
    } else {
      box.innerHTML = `<span style="font-size:14px;font-weight:900;color:${j ? '#39FF14' : '#FF2D2D'}">${j ? '✅ ' + (_lang==='en'?'Correct':'صح') : '❌ ' + (_lang==='en'?'Wrong':'خطأ')}</span>`
        + `<button onclick="cat6UndoJudge('${team}')" title="${_lang==='en'?'Change':'تغيير'}" style="padding:3px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.5);background:transparent;font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">↩</button>`;
    }
  });

  const center  = document.getElementById('cat6-result-center');
  const emoji   = document.getElementById('cat6-result-emoji');
  const resText = document.getElementById('cat6-result-text');
  // Back to neutral, then decorate the current result
  ['a', 'b'].forEach(team => {
    const box = document.getElementById(`cat6-box-${team}`);
    const name = document.getElementById(`cat6-name-${team}`);
    const rgb = team === 'a' ? '229,1,88' : '226,218,81';
    if (box) { box.style.border = `1.5px solid rgba(${rgb},0.3)`; box.style.background = `rgba(${rgb},0.08)`; box.style.boxShadow = 'none'; box.style.opacity = '1'; }
    if (name) { name.style.color = team === 'a' ? '#E50158' : '#E2DA51'; name.style.fontSize = 'clamp(14px,1.8vw,20px)'; name.style.textShadow = 'none'; name.textContent = team === 'a' ? G.teamA : G.teamB; }
  });

  const bothJudged = J.a !== undefined && J.b !== undefined;
  if (!bothJudged) { if (center) center.style.display = 'none'; return; }

  const winner = cat6Winner();
  if (!winner) {
    if (emoji)   emoji.textContent = '🤝';
    if (resText) { resText.textContent = _lang==='en'?'No points':'لا نقاط'; resText.style.color = 'rgba(255,255,255,0.5)'; }
  } else {
    const bothCorrect = J.a && J.b;
    const winBox  = document.getElementById(`cat6-box-${winner}`);
    const winName = document.getElementById(`cat6-name-${winner}`);
    const loseBox = document.getElementById(`cat6-box-${winner === 'a' ? 'b' : 'a'}`);
    // Same highlight as categories 7-8: yellow frame, winner's name in yellow
    if (winBox) {
      winBox.style.border     = '3px solid #FFE600';
      winBox.style.background = 'rgba(255,230,0,0.1)';
      winBox.style.boxShadow  = '0 0 20px rgba(255,230,0,0.4)';
    }
    if (winName) {
      winName.textContent = '🏆 ' + (winner === 'a' ? G.teamA : G.teamB);
      winName.style.color = '#FFE600';
      winName.style.fontSize = 'clamp(18px,2.4vw,28px)';
      winName.style.textShadow = '0 0 12px rgba(255,230,0,0.7)';
    }
    if (loseBox && !bothCorrect) loseBox.style.opacity = '0.5';
    if (emoji)   emoji.textContent = '🏆';
    if (resText) {
      resText.innerHTML = `<span style="color:#39FF14">+3 ${_lang==='en'?'pts':'نقاط'}</span>${bothCorrect ? ('<br><span style="font-size:11px;color:rgba(255,255,255,0.5)">'+(_lang==='en'?'⚡ fastest':'⚡ أسرع')+'</span>') : ''}`;
    }
  }
  if (center) center.style.display = 'flex';
}

function openVideoOverlay(driveId, directUrl, qIndex) {
  const container = document.getElementById('video-container-' + qIndex);

// ROUND: CLOSEST NUMBER
// ══════════════════════════════════════
// CATEGORY 7 & 8 — Closest Number
// ══════════════════════════════════════
function renderClosest(r, qIndex, sa) {
  const qs = r.id === 'r6' ? G.questions.r6 : G.questions.r7;
  const raw = qs[qIndex] || null;
  const q = raw ? getQ(raw) : `${_lang==="en"?"Question":"السؤال"} ${qIndex+1}`;
  const ans = raw ? getA(raw) : '?';
  const isLast = qIndex >= r.count - 1;
  const pts = r.id === 'r6' ? 2 : 4;

  updateHostView(r.name, `${_lang==="en"?"Question":"سؤال"} ${qIndex+1} ${_lang==="en"?"of":"من"} ${r.count}`, q, ans);

  // Reuse existing room from rules page
  const roomId = window._closestRoomId || `closest_${r.id}_${qIndex}_${Date.now()}`;
  window._closestRoomId = roomId;
  window._closestCorrect = ans;
  window._closestPts = pts;
  window._closestAnswers = { a: null, b: null };
  window._closestRevealDone = false; // reset guard each question

  const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet; const fbOnValue = window._fbOnValue;
  if (db && fbSet) {
    import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
      update(fbRef(db, `closest/${roomId}`), { answerA: null, answerB: null, phase: 'waiting', question: q });
      // For questions after the first, auto-activate immediately
      if (qIndex > 0) {
        setTimeout(() => {
          update(fbRef(db, `closest/${roomId}`), { phase: 'active', timerEnd: Date.now() + 30000 });
          document.getElementById('timer-area') && (document.getElementById('timer-area').style.display = 'flex');
          document.getElementById('btn-reveal-ans') && (document.getElementById('btn-reveal-ans').style.display = 'inline-flex');
          startTimer(30);
        }, 300);
      }
    });

    fbOnValue(fbRef(db, `closest/${roomId}`), (snap) => {
      const d = snap.val(); if (!d) return;
      window._closestAnswers = { a: d.answerA, b: d.answerB, tsA: d.answeredAtA, tsB: d.answeredAtB };
      const dotA = document.getElementById('dot-a');
      const dotB = document.getElementById('dot-b');
      if (dotA) dotA.style.background = d.connectedA ? '#39FF14' : 'rgba(255,255,255,0.2)';
      if (dotB) dotB.style.background = d.connectedB ? '#39FF14' : 'rgba(255,255,255,0.2)';
      closestMarkSubmitted('a', d.answerA !== null && d.answerA !== undefined);
      closestMarkSubmitted('b', d.answerB !== null && d.answerB !== undefined);
      const bothDone = d.answerA !== null && d.answerA !== undefined &&
                       d.answerB !== null && d.answerB !== undefined;
      if (bothDone) showClosestAnswers();
    });
  }

  sa.innerHTML = `
    <div class="question-number">${_lang==="en"?"Question":"سؤال"} ${qIndex+1} ${_lang==="en"?"of":"من"} ${r.count}</div>

    <!-- Hidden question hint -->
    <div id="q-hidden-msg" style="font-size:14px;color:rgba(255,255,255,0.3);text-align:center;font-style:italic;${qIndex > 0 ? 'display:none' : ''}">
      ⏳ اضغط "عرض السؤال" لبدء الجولة
    </div>
    <div id="q-visible" style="${qIndex > 0 ? '' : 'display:none'}">
      <div class="question-text-box slide-in" style="font-size:${dynFont(q)}">${q}</div>
    </div>

    <!-- One card per team: name, then submitted status, then (when shown) the answer -->
    <div id="closest-answers-area" style="width:100%">
      <div style="display:flex;gap:14px;justify-content:center;width:100%;max-width:1000px;margin:0 auto">
        ${['a', 'b'].map(tm => {
          const rgb = tm === 'a' ? '229,1,88' : '226,218,81';
          const col = tm === 'a' ? '#E50158' : '#E2DA51';
          return `
        <div id="closest-card-${tm}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px;border-radius:14px;background:rgba(${rgb},0.07);border:2px solid rgba(${rgb},0.35);min-width:0;transition:all 0.3s">
          <div style="display:flex;align-items:center;gap:8px;max-width:100%">
            <div id="dot-${tm}" style="width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all 0.4s;flex-shrink:0"></div>
            <div style="font-size:clamp(16px,2vw,24px);font-weight:900;color:${col};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHTML(tm === 'a' ? G.teamA : G.teamB)}</div>
          </div>
          <div id="sub-${tm}" style="font-size:clamp(14px,1.7vw,20px);font-weight:700;color:rgba(255,255,255,0.45)">⏳ ${_lang==='en'?'Waiting for answer…':'بانتظار الجواب…'}</div>
          <div id="ans-box-${tm}" style="display:none;font-size:clamp(26px,4vw,46px);font-weight:900;color:#39FF14;line-height:1.2;text-align:center;min-height:50px;align-items:center;justify-content:center">—</div>
        </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Timer -->
    <!-- Timer -->
    <div id="timer-area" style="${qIndex > 0 ? '' : 'display:none'}">${timerHTML(30)}</div>


    <div id="closest-result"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="answer-reveal-btn" id="btn-show-q" style="font-size:clamp(12px,1.6vw,16px);padding:9px 20px;${qIndex > 0 ? 'display:none' : ''}" onclick="showClosestQuestion('${roomId}')">${t('showQuestion')}</button>
      <button class="answer-reveal-btn" id="btn-reveal-ans" style="${qIndex > 0 ? 'font-size:clamp(12px,1.6vw,16px);padding:9px 20px' : 'display:none;font-size:clamp(12px,1.6vw,16px);padding:9px 20px'}" onclick="revealClosestNow()">${t('revealCorrect')}</button>
    </div>

    <div class="nav-btns" style="padding:8px 0">
      ${isLast
        ? `<button class="nav-btn primary" onclick="showResult()" style="font-size:clamp(12px,1.6vw,16px);padding:9px 28px;min-width:140px">${t('results')}</button>`
        : `<button class="nav-btn primary" onclick="nextQ()" style="font-size:clamp(12px,1.6vw,16px);padding:9px 28px;min-width:140px">${t('nextQuestion')}</button>`
      }
    </div>`;
}

function showClosestQuestion(roomId) {
  document.getElementById('q-hidden-msg') && (document.getElementById('q-hidden-msg').style.display = 'none');
  document.getElementById('q-visible') && (document.getElementById('q-visible').style.display = 'block');
  document.getElementById('timer-area') && (document.getElementById('timer-area').style.display = 'flex');
  document.getElementById('btn-show-q') && (document.getElementById('btn-show-q').style.display = 'none');
  document.getElementById('btn-reveal-ans') && (document.getElementById('btn-reveal-ans').style.display = 'inline-flex');
  import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ update }) => {
    const db = window._fbDb; const fbRef = window._fbRef;
    if (db && fbRef) update(fbRef(db, `closest/${roomId}`), { phase: 'active', timerEnd: Date.now() + 30000 });
  });
  startTimer(30);
}

// Submitted status inside the team's card (the answer itself appears below it)
function closestMarkSubmitted(team, sent) {
  const sub = document.getElementById('sub-' + team);
  const card = document.getElementById('closest-card-' + team);
  if (!sub) return;
  sub.textContent = sent ? `✅ ${_lang==='en'?'Answer submitted':'تم إرسال الجواب'}` : `⏳ ${_lang==='en'?'Waiting for answer…':'بانتظار الجواب…'}`;
  sub.style.color = sent ? '#39FF14' : 'rgba(255,255,255,0.45)';
  if (card && sent) card.style.boxShadow = '0 0 14px rgba(57,255,20,0.25)';
}

function showClosestAnswers() {
  const area = document.getElementById('closest-answers-area');
  const boxA = document.getElementById('ans-box-a');
  const boxB = document.getElementById('ans-box-b');
  if (!area) return;
  if (boxA) boxA.style.display = 'flex';
  if (boxB) boxB.style.display = 'flex';
  const a = window._closestAnswers?.a;
  const b = window._closestAnswers?.b;
  if (boxA) boxA.textContent = a !== null && a !== undefined ? a : '—';
  if (boxB) boxB.textContent = b !== null && b !== undefined ? b : '—';
  if (a !== null && a !== undefined && b !== null && b !== undefined) stopTimer();
}

function revealClosestNow() {
  window._answerRevealed = true;
  unlockNextButton();
  if (window._closestRevealDone) return;
  window._closestRevealDone = true;
  const revealBtn = document.getElementById('btn-reveal-ans');
  if (revealBtn) { revealBtn.disabled = true; revealBtn.style.opacity = '0.4'; }

  showClosestAnswers();
  const a = window._closestAnswers?.a;
  const b = window._closestAnswers?.b;
  const tsA = window._closestAnswers?.tsA || 0;
  const tsB = window._closestAnswers?.tsB || 0;
  const correct = parseFloat(window._closestCorrect) || 0;
  const pts = window._closestPts || 2;
  const boxA = document.getElementById('ans-box-a');
  const boxB = document.getElementById('ans-box-b');
  let msg = '';
  const aValid = a !== null && a !== undefined;
  const bValid = b !== null && b !== undefined;

  if (!aValid && !bValid) {
    msg = `${_lang==="en"?"Correct Answer":"الجواب الصحيح"}: ${window._closestCorrect}`;
  } else if (aValid && !bValid) {
    // Only team A answered
    addScore('a', pts);
    msg = `🏆 ${G.teamA} ${_lang==="en"?"answered! (+"+pts+" pts)":"أجاب! (+"+pts+" نقاط)"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;
    if (boxA) boxA.style.cssText += ';border:3px solid #FFE600;border-radius:8px;padding:4px 8px;background:rgba(255,230,0,0.1)';
  } else if (bValid && !aValid) {
    // Only team B answered
    addScore('b', pts);
    msg = `🏆 ${G.teamB} ${_lang==="en"?"answered! (+"+pts+" pts)":"أجاب! (+"+pts+" نقاط)"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;
    if (boxB) boxB.style.cssText += ';border:3px solid #FFE600;border-radius:8px;padding:4px 8px;background:rgba(255,230,0,0.1)';
  } else {
    // Both answered
    const diffA = Math.abs(parseFloat(a) - correct);
    const diffB = Math.abs(parseFloat(b) - correct);
    if (diffA < diffB) {
      addScore('a', pts);
      msg = `🏆 ${G.teamA} ${_lang==="en"?"closest! (+"+pts+" pts)":"أقرب! (+"+pts+" نقاط)"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;
      if (boxA) boxA.style.cssText += ';border:3px solid #FFE600;border-radius:8px;padding:4px 8px;background:rgba(255,230,0,0.1)';
    } else if (diffB < diffA) {
      addScore('b', pts);
      msg = `🏆 ${G.teamB} ${_lang==="en"?"closest! (+"+pts+" pts)":"أقرب! (+"+pts+" نقاط)"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;
      if (boxB) boxB.style.cssText += ';border:3px solid #FFE600;border-radius:8px;padding:4px 8px;background:rgba(255,230,0,0.1)';
    } else {
      // Same distance — first submitted wins
      if (tsA && tsB && tsA < tsB) {
        addScore('a', pts);
        msg = `🏆 ${G.teamA} ${_lang==="en"?"fastest! (+"+pts+" pts)":"أسرع! (+"+pts+" نقاط)"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;

      } else if (tsB && tsA && tsB < tsA) {

        if (boxB) boxB.style.cssText += ';border:3px solid #FFE600;border-radius:8px;padding:4px 8px;background:rgba(255,230,0,0.1)';
      } else {
        msg = `${_lang==="en"?"Tied!":"تعادل!"} — ${_lang==="en"?"Answer":"الجواب"}: ${window._closestCorrect}`;
      }
    }
  }
  const result = document.getElementById('closest-result');
  if (result) result.innerHTML = `<div class="answer-box fade-in" style="font-size:clamp(16px,2.5vw,22px) !important">${msg}</div>`;

}

function _sess() { return window._gameSession || 'main'; }
function _path(p) { return `sessions/${_sess()}/${p}`; }

function pushHostView(data) {
  const db = window._fbDb;
  const fbRef = window._fbRef;
  const fbSet = window._fbSet;
  if (!db || !fbSet || !fbRef) return;
  try {
    fbSet(fbRef(db, _path('hostView')), { ...data, ts: Date.now() });
  } catch(e) { console.error('pushHostView error:', e); }
}

function pushHostState() {
  const db = window._fbDb;
  const fbRef = window._fbRef;
  const fbSet = window._fbSet;
  if (!db || !fbSet || !fbRef) return;
  const gameScreenVisible = document.getElementById('game-screen')?.style?.display !== 'none';
  const r = G.currentRound;
  fbSet(fbRef(db, _path('hostState')), {
    done: [...(G.done || [])],
    currentRound: r?.id || null,
    currentRoundName: r?.name || null,
    currentRoundPts: r?.pts || null,
    currentRoundPlus: r?.plus || null,
    currentRoundMinus: r?.minus || null,
    currentRoundCount: r?.count || null,
    currentQ: G.currentQ,
    teamA: G.teamA,
    teamB: G.teamB,
    scoreA: G.scoreA,
    scoreB: G.scoreB,
    cat3RoomId: cat3RoomId || null,
    cat3CanAdvance: !!window._cat3CanAdvance,
    cat6RoomId: window._cat6RoomId || null,
    cat6Judgement: { ...(window._cat6Judgement || {}) },
    cat6Phase: G.currentRound?.id === 'r5' ? (window._cat6Phase || 'video') : null,
    cat6NoAnswer: { ...(window._cat6NoAnswer || {}) },

    onGameScreen: gameScreenVisible,
    sessionId: window._gameSession || null,
    hostWallpaper: G.hostWallpaperUrl || null,
    lang: _lang,
  });

let _lastHostCmdKey = null;
let _hostCmdUnsubscribe = null;
function startHostCmdListener() {
  const db = window._fbDb;
  const fbRef = window._fbRef;
  const fbOnValue = window._fbOnValue;
  if (!db || !fbOnValue || !fbRef) {
    console.warn('startHostCmdListener: Firebase not ready, retrying...');
    setTimeout(startHostCmdListener, 1000);
    return;
  }
  // Unsubscribe previous listener
  if (_hostCmdUnsubscribe) { _hostCmdUnsubscribe(); _hostCmdUnsubscribe = null; }
  const path = _path('hostCmd');
  let firstValue = true;
  _hostCmdUnsubscribe = fbOnValue(fbRef(db, path), (snap) => {
    const d = snap.val();
    // The first value is whatever command was left in Firebase before we
    // subscribed (e.g. after a reload) — remember it but never replay it.
    if (firstValue) { firstValue = false; _lastHostCmdKey = d ? (d.id || d.ts || null) : null; return; }
    if (!d || !d.ts) return;
    // Commands are told apart by their id (or ts for older host pages), not by
    // comparing clocks — a host phone whose clock is behind must still work.
    const key = d.id || d.ts;
    if (key === _lastHostCmdKey) return;
    _lastHostCmdKey = key;
    const cmd = d.cmd;

    if (cmd === 'next') {
      if (G.currentRound) {
        const r = G.currentRound;
        // Block for closest if not yet revealed
        if ((r.id === 'r6' || r.id === 'r7') && G.currentQ >= 1 && !window._closestRevealDone) return;
        // Cat 3: same gates as the TV — both phones connected before leaving the
        // rules, and no moving on until the auction for this question is settled.
        if (r.id === 'r3' && G.currentQ === 0 && !window._cat3BothConnected) {
          showToast(_lang==='en' ? 'Waiting for both teams to connect' : 'انتظر اتصال الفريقين');
          return;
        }
        if (r.id === 'r3' && G.currentQ >= 1 && !window._cat3CanAdvance) {
          showToast(_lang==='en' ? 'Finish this auction first' : 'أنهِ هذا المزاد أولاً');
          return;
        }
        if (G.currentQ >= r.count) {
          showResult();
        } else if (r.id === 'r3' && G.currentQ >= 1) {
          // Cat 3 must go through its own handler: it applies the round score and
          // resets the Firebase room. A bare nextQ() would skip both and leave the
          // phones holding the previous question.
          nextCat3Question();
        } else {
          nextQ();
        }
      }
      else { console.warn('next: no currentRound'); }
    } else if (cmd === 'prev') {
      // Cat 3 questions can't be revisited: the room only holds the current
      // question, so going back would replay (and re-score) the auction.
      if (G.currentRound?.id === 'r3' && G.currentQ >= 1) return;
      if (G.currentRound && G.currentQ > -1) {
        G.currentQ--;
        _resetScoreState();
        renderSlide();
        pushHostState();
      }
    } else if (cmd === 'result') {
      showResult();
    } else if (cmd === 'menu') {
      G.currentRound = null;
      G.currentQ = -1;
      show('menu-screen');
      buildMenu();
      // Clear host view so phone shows clean state
      pushHostView({ active: false, question: '', answer: '', categoryName: '', questionNum: '' });
      pushHostState();
    } else if (cmd === 'openCat') {
      const roundId = d.data?.id;
      if (roundId && !G.done.has(roundId) && ROUNDS.some(r => r.id === roundId)) {
        // Same path as tapping the round on the TV, so photo batches, question
        // de-duplication and the data-ready check also happen for the host.
        openRound(roundId);
        const db = window._fbDb; const fbRef = window._fbRef; const fbSet = window._fbSet;
        if (db && fbSet) fbSet(fbRef(db, _path('rouletteResult')), null);
      }
    } else if (cmd === 'roulette') {
      G.currentRound = null;
      show('menu-screen');
      buildMenu();
      setTimeout(() => {
        // Show roulette panel
        const panel = document.getElementById('roulette-panel');
        const toggleBtn = document.getElementById('roulette-toggle-btn');
        if (panel && panel.style.display === 'none') {
          if (toggleBtn) toggleBtn.click();
        }
      }, 300);
      setTimeout(() => {
        // Click spin button to show full animation
        const spinBtn = document.getElementById('roulette-spin-btn');
        if (spinBtn && !spinBtn.disabled) spinBtn.click();
      }, 700);
    } else if (cmd === 'videoPlay') {
      const qIdx = window._cat6QIndex !== undefined ? window._cat6QIndex : (G.currentQ - 1);
      const v = document.getElementById('video-el-' + qIdx);
      if (v) { v.play(); }
      else cat6PlayVideo(qIdx);
    } else if (cmd === 'videoRepeat') {
      const qIdx = window._cat6QIndex !== undefined ? window._cat6QIndex : (G.currentQ - 1);
      const v = document.getElementById('video-el-' + qIdx);
      if (v) { v.currentTime = 0; v.play(); }
      else cat6PlayVideo(qIdx);
    } else if (cmd === 'videoReveal') {
      const qIdx = window._cat6QIndex !== undefined ? window._cat6QIndex : (G.currentQ - 1);
      cat6ShowQuestion(qIdx);
    } else if (cmd === 'revealCat6Answer') {
      cat6RevealAnswer();
    } else if (cmd === 'showQuestion') {
      const btnShowQ = document.getElementById('btn-show-q');
      if (btnShowQ && btnShowQ.style.display !== 'none') btnShowQ.click();
    } else if (cmd === 'revealAnswer') {
      // For closest categories
      if (G.currentRound?.id === 'r6' || G.currentRound?.id === 'r7') {
        revealClosestNow();
      } else {
        const btn = document.querySelector('.answer-reveal-btn');
        if (btn) btn.click();
      }
    } else if (cmd === 'overrideCat3') {
      const idx = d.data?.idx;
      const status = d.data?.status;
      if (idx !== undefined && status) overrideVal({ dataset: { i: idx, s: status } });
    } else if (cmd === 'startCat3') {
      const roomId = cat3RoomId;
      if (roomId) startCat3Bidding(roomId);
    } else if (cmd === 'skipCat3') {
      const roomId = cat3RoomId;
      if (roomId) forceCat3Skip(roomId);
    } else if (cmd === 'startTimer') {
      const secs = d.data?.seconds || 60;
      startTimer(secs);
    } else if (cmd === 'judgeTeam') {
      const team = d.data?.team;
      cat6SetJudgement(team, d.data?.undo ? null : !!d.data?.correct);
    } else if (cmd === 'celebrate') {
      playCelebration();
    } else if (cmd === 'scoreTeam') {
      // Shares the TV's per-question score state: one score per team, undoable
      const team = d.data?.team;
      const pts = Number(d.data?.pts) || 0;
      if ((team === 'a' || team === 'b') && pts) scoreOnce(team, pts);
    } else if (cmd === 'undoScoreTeam') {
      const team = d.data?.team;
      if (team === 'a' || team === 'b') undoScore(team);
    } else if (cmd === 'addScore') {
      // Older host pages
      const team = d.data?.team;
      const pts = d.data?.pts || 0;
      if (team) addScore(team, pts);
    }
  });
}

function updateHostView(categoryName, questionNum, question, answer) {
  // Always push — host phone needs this data
  pushHostView({ active: true, categoryName, questionNum, question: question || '', answer: answer || '' });
}
