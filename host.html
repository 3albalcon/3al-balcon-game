<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Host — 3AL BALCON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --dark:#060d1f; --yellow:#FFE600; --green:#39FF14; --cyan:#00EFFF; --red:#FF2D2D; }
body { font-family:'Cairo',sans-serif; background:var(--dark); color:#fff; min-height:100dvh; display:flex; flex-direction:column; background-size:cover; background-position:center; }
.overlay { position:fixed; inset:0; background:rgba(6,13,31,0.87); z-index:0; pointer-events:none; }
.wrap { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100dvh; padding:10px 12px max(16px,env(safe-area-inset-bottom)); gap:8px; overflow-y:auto; }

.logo { font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:3px; text-align:center; flex-shrink:0; }

.status-bar { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:10px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.12); flex-shrink:0; }
.s-cat { font-weight:900; color:var(--cyan); font-size:13px; }
.s-q { color:rgba(255,255,255,0.4); font-size:11px; }

.score-bar { display:flex; gap:8px; align-items:center; padding:7px 12px; border-radius:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
.sc-team { flex:1; display:flex; flex-direction:column; align-items:center; }
.sc-name { font-size:11px; font-weight:700; }
.sc-pts { font-size:26px; font-weight:900; line-height:1; }

/* Content cards */
.card { background:rgba(0,0,0,0.4); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.1); }
.q-card { border-color:var(--cyan); background:rgba(0,239,255,0.06); font-size:16px; font-weight:700; text-align:center; line-height:1.5; direction:rtl; }
.a-card { border-color:var(--green); background:rgba(57,255,20,0.06); font-size:20px; font-weight:900; text-align:center; color:var(--green); text-shadow:0 0 10px rgba(57,255,20,0.3); direction:rtl; }
.info-card { font-size:13px; font-weight:700; text-align:center; color:rgba(255,255,255,0.5); padding:10px; }
.waiting { font-size:13px; color:rgba(255,255,255,0.3); text-align:center; animation:pulse 2s infinite; padding:16px; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

/* Buttons */
.btn-row { display:flex; gap:6px; }
.btn { flex:1; padding:12px 0; border-radius:10px; font-family:'Cairo',sans-serif; font-size:13px; font-weight:900; cursor:pointer; border:2px solid; text-align:center; transition:all 0.15s; }
.btn:active { transform:scale(0.93); }
.btn:disabled { opacity:0.2; cursor:default; transform:none; }
.btn-g { border-color:var(--green); color:var(--green); background:rgba(57,255,20,0.06); }
.btn-c { border-color:var(--cyan); color:var(--cyan); background:rgba(0,239,255,0.06); }
.btn-y { border-color:var(--yellow); color:var(--yellow); background:rgba(255,230,0,0.06); }
.btn-w { border-color:rgba(255,255,255,0.18); color:rgba(255,255,255,0.45); background:rgba(255,255,255,0.03); }
.btn-r { border-color:var(--red); color:var(--red); background:rgba(255,45,45,0.06); }
.btn-sm { font-size:12px; padding:9px 0; }

/* Score buttons */
.score-btns { display:flex; flex-direction:column; gap:6px; }
.score-btns .btn-row .btn { font-size:12px; }

/* Cat grid */
.lbl { font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:2px; text-align:center; }
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.cat-btn { padding:10px 6px; border-radius:9px; border:1.5px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.3); color:rgba(255,255,255,0.6); font-family:'Cairo',sans-serif; font-size:11px; font-weight:700; cursor:pointer; text-align:center; line-height:1.4; transition:all 0.2s; }
.cat-btn:active { transform:scale(0.93); }
.cat-btn.done { opacity:0.15; cursor:not-allowed; text-decoration:line-through; }
.cat-btn.current { border-color:var(--yellow); color:var(--yellow); background:rgba(255,230,0,0.07); cursor:not-allowed; }
.cat-btn.roulette { border-color:var(--green); color:var(--green); background:rgba(57,255,20,0.08); animation:pulse 1s infinite; box-shadow:0 0 10px rgba(57,255,20,0.25); }
.cat-btn.locked { opacity:0.3; cursor:not-allowed; }

/* Cat3 */
.bid-row { display:flex; gap:8px; }
.bid-card { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px; border-radius:10px; }
.bid-a { background:rgba(229,1,88,0.08); border:1.5px solid #E50158; }
.bid-b { background:rgba(226,218,81,0.08); border:1.5px solid #E2DA51; }
.bid-n { font-size:11px; font-weight:700; }
.bid-v { font-size:36px; font-weight:900; line-height:1; }
.ans-chip { padding:7px 10px; border-radius:7px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
.chip-p { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); }
.chip-ok { background:rgba(57,255,20,0.07); border:1px solid var(--green); color:var(--green); }
.chip-no { background:rgba(255,45,45,0.07); border:1px solid var(--red); color:var(--red); }
</style>
</head>
<body>
<div class="overlay" id="bg-overlay"></div>
<div class="wrap" id="main-wrap">
  <div class="logo">🎙 HOST — 3AL BALCON</div>
  <div id="debug-session" style="font-size:11px;color:#FFE600;text-align:center;padding:4px;background:rgba(255,230,0,0.1);border-radius:6px;letter-spacing:1px">⏳ connecting...</div>

  <div class="status-bar">
    <span class="s-cat" id="s-cat">—</span>
    <span class="s-q" id="s-q"></span>
  </div>

  <div class="score-bar">
    <div class="sc-team">
      <div class="sc-name" id="sc-na" style="color:#E50158">أ</div>
      <div class="sc-pts" id="sc-a" style="color:#E50158">0</div>
    </div>
    <div style="font-size:12px;color:rgba(255,255,255,0.15)">VS</div>
    <div class="sc-team">
      <div class="sc-name" id="sc-nb" style="color:#E2DA51">ب</div>
      <div class="sc-pts" id="sc-b" style="color:#E2DA51">0</div>
    </div>
  </div>

  <!-- Dynamic content -->
  <div id="dyn"></div>

  <!-- Nav controls — always visible -->
  <div class="btn-row" id="nav-row">
    <button class="btn btn-c btn-sm" id="btn-prev" onclick="c('prev')" disabled>← <span id='h-prev-lbl'>السابق</span></button>
    <button class="btn btn-g" id="btn-next" onclick="c('next')" disabled style="font-size:18px;padding:16px 0"><span id='h-next-lbl'>التالي</span> →</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-sm" onclick="goMenu()" style="flex:1;border-color:#FF8C00;color:#FF8C00;background:rgba(255,140,0,0.08);box-shadow:0 0 8px rgba(255,140,0,0.3)">🏠 <span id='h-menu-lbl'>القائمة</span></button>
    <button class="btn btn-r btn-sm" id="btn-roulette" onclick="c('roulette')">🎰 <span id='h-spin-lbl'>دوّر</span></button>
  </div>

  <!-- Category grid — always at bottom -->
  <div class="lbl"><span id='h-select-lbl'>— اختر فقرة —</span></div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyAY-zBQnRPTZLUDMCbod-NFkmuIG4W0XxE",
  authDomain:"al-balcon.firebaseapp.com",
  databaseURL:"https://al-balcon-default-rtdb.firebaseio.com",
  projectId:"al-balcon",
  storageBucket:"al-balcon.firebasestorage.app",
  messagingSenderId:"556294454945",
  appId:"1:556294454945:web:770c330e71a4e484277ae0"
};
const app = initializeApp(cfg);
const db = getDatabase(app);

let state={}, view={}, cat3=null, cat3Room=null, roulette=null, ansShown=false;

// Session ID from URL
const params = new URLSearchParams(window.location.search);
const SESSION = params.get('s') || 'main';
const P = (path) => `sessions/${SESSION}/${path}`;

// Language — read from URL immediately
let _lang = params.get('l') || 'ar';

// ROUNDS — defined after _lang so name() can use it
const ROUNDS_AR = ['وين شايفو هالوجه؟','ما تذكرتني بعد؟','مزاد علني','متفرقات سريعة','سمعني الدندنة','سكوت و ركز','يا حبيبي قرب ليي','يا قريب يا غريب','سكر تمك','من كل وادي عصا'];
const ROUNDS_EN = ["Who's That Face?","Still Don't Remember Me?",'Public Auction','Quick Trivia','Hum It!','Watch & Focus','Get Closer!','Close or Far?','Zip It!','General Knowledge'];
const ROUNDS_IDS  = ['r1','r2','r3','r10','r4','r5','r6','r7','r8','r9'];
const ROUNDS_PLUS = [2,2,4,2,2,3,2,4,3,2];
const ROUNDS_MINUS= [0,1,-2,1,0,0,-1,-2,-1,1];
function getRounds() {
  return ROUNDS_IDS.map((id,i) => ({
    id, num:i+1,
    name: _lang==='en' ? ROUNDS_EN[i] : ROUNDS_AR[i],
    plus: ROUNDS_PLUS[i],
    minus: ROUNDS_MINUS[i]
  }));
}
// Use getter so ROUNDS always reflects current language
const ROUNDS = new Proxy([], {
  get(_, prop) {
    const arr = getRounds();
    if (prop === 'find') return arr.find.bind(arr);
    if (prop === 'map')  return arr.map.bind(arr);
    if (prop === 'filter') return arr.filter.bind(arr);
    if (prop === 'length') return arr.length;
    if (!isNaN(prop)) return arr[+prop];
    return arr[prop];
  }
});
const HOST_T = {
  ar: {
    catLabel: (num, name) => `فقرة ${num}: ${name}`,
    titleSlide: 'العنوان', rulesSlide: 'القوانين',
    questionNum: (q) => q >= 1 ? `سؤال ${q}` : '',
    noRound: '—', score: 'النتيجة',
    teamA: 'الفريق أ', teamB: 'الفريق ب',
    correct: '✅ صح', wrong: '❌ خطأ',
    correctDone: '✅ صح ✓', wrongDone: '❌ خطأ ✓',
    addScore: (pts, name) => `+${pts} ${name}`,
    deductScore: (pts, name) => `${pts} ${name}`,
    menu: '← القائمة',
    hostMode: 'مقدّم البرنامج',
    noAnswers: 'لا أجوبة بعد',
    waitingAnswers: 'بانتظار الأجوبة...',
    goMenu: '🏠 القائمة',
    roundInfo: (name, q, total) => `${name} — ${q}/${total}`,
  },
  en: {
    catLabel: (num, name) => `Cat ${num}: ${name}`,
    titleSlide: 'Title', rulesSlide: 'Rules',
    questionNum: (q) => q >= 1 ? `Question ${q}` : '',
    noRound: '—', score: 'Score',
    teamA: 'Team A', teamB: 'Team B',
    correct: '✅ Correct', wrong: '❌ Wrong',
    correctDone: '✅ Correct ✓', wrongDone: '❌ Wrong ✓',
    addScore: (pts, name) => `+${pts} ${name}`,
    deductScore: (pts, name) => `${pts} ${name}`,
    menu: '← Menu',
    hostMode: 'Host Mode',
    noAnswers: 'No answers yet',
    waitingAnswers: 'Waiting for answers...',
    goMenu: '🏠 Menu',
    roundInfo: (name, q, total) => `${name} — ${q}/${total}`,
  }
};
function ht(key, ...args) {
  const L = HOST_T[_lang] || HOST_T.ar;
  const v = L[key];
  return typeof v === 'function' ? v(...args) : (v || HOST_T.ar[key] || key);
}


// Send command to main screen
window.c = (cmd, data={}) => {
  const path = P('hostCmd');
  set(ref(db, path), {cmd, data, ts:Date.now()});
  const dbg = document.getElementById('debug-session');
  if (dbg) dbg.textContent = `✓ sent: ${cmd} → ${path}`;
};

let _cat6RoomListener = null;
let _cat6RoomWatching = null;
let _cat6Judged = { a: null, b: null };

function loadCat6Answers() {
  const roomId = state.cat6RoomId;
  if (!roomId || roomId === _cat6RoomWatching) return;
  _cat6RoomWatching = roomId;
  _cat6Judged = { a: null, b: null };
  if (_cat6RoomListener) { _cat6RoomListener(); _cat6RoomListener = null; }
  _cat6RoomListener = onValue(ref(db, `cat6/${roomId}`), snap => {
    const d = snap.val(); if (!d) return;
    // Reset judgement when new question starts
    if (d.phase === 'waiting') {
      _cat6Judged = { a: null, b: null };
      const area = document.getElementById('cat6-judge-area');
      if (area) area.innerHTML = '';
      return;
    }
    const area = document.getElementById('cat6-judge-area');
    if (!area) return;
    const ansA = d.answerA || null;
    const ansB = d.answerB || null;
    if (!ansA && !ansB) { area.innerHTML = ''; return; }
    renderJudgeArea(area, ansA, ansB, d.answeredAtA, d.answeredAtB);
  });
}

function renderJudgeArea(area, ansA, ansB, tsA, tsB) {
  const bothJudged = _cat6Judged.a !== null && _cat6Judged.b !== null;
  // Show who was faster only after both judged
  let speedLabel = '';
  if (bothJudged && tsA && tsB) {
    speedLabel = tsA < tsB
      ? `<div style="font-size:10px;color:#FFE600;text-align:center;margin-top:4px">⚡ ${state.teamA||(_lang==='en'?'A':'أ')} ${_lang==='en'?'faster':'أسرع'}</div>`
      : `<div style="font-size:10px;color:#FFE600;text-align:center;margin-top:4px">⚡ ${state.teamB||(_lang==='en'?'B':'ب')} ${_lang==='en'?'faster':'أسرع'}</div>`;
  }

  area.innerHTML = `
    <div style="font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:2px;text-align:center;margin-top:6px">${_lang==='en'?'— Team Answers —':'— أجوبة الفرق —'}</div>
    ${speedLabel}
    <div style="display:flex;gap:8px;width:100%;margin-top:4px">
      ${buildTeamCard('a', ansA, state.teamA||'أ', '#E50158', 'rgba(229,1,88,')}
      ${buildTeamCard('b', ansB, state.teamB||'ب', '#E2DA51', 'rgba(226,218,81,')}
    </div>`;
}

function buildTeamCard(team, ans, name, color, rgba) {
  const judged = _cat6Judged[team];
  let statusBadge = '';
  if (judged === true) statusBadge = `<div style="font-size:12px;color:#39FF14;font-weight:700">${_lang==='en'?'✅ Correct':'✅ صح'}</div>`;
  else if (judged === false) statusBadge = `<div style="font-size:12px;color:#FF2D2D;font-weight:700">${_lang==='en'?'❌ Wrong':'❌ خطأ'}</div>`;

  return `<div style="flex:1;padding:8px;border-radius:10px;background:${rgba}0.07);border:1px solid ${rgba}0.3);display:flex;flex-direction:column;align-items:center;gap:5px">
    <div style="font-size:10px;color:${color};font-weight:700">${name}</div>
    <div style="font-size:13px;font-weight:700;color:#fff;text-align:center;direction:rtl">${ans || '—'}</div>
    ${!ans ? '' : judged !== null ? statusBadge : `
      <div style="display:flex;gap:4px">
        <button onclick="hostJudge('${team}',true)" style="padding:4px 10px;border-radius:6px;border:1.5px solid #39FF14;color:#39FF14;background:rgba(57,255,20,0.07);font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">✅</button>
        <button onclick="hostJudge('${team}',false)" style="padding:4px 10px;border-radius:6px;border:1.5px solid #FF2D2D;color:#FF2D2D;background:rgba(255,45,45,0.07);font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">❌</button>
      </div>`}
  </div>`;
}

window.hostJudge = (team, correct) => {
  _cat6Judged[team] = correct;
  c('judgeTeam', { team, correct });
  if (correct) {
    // Lock all judge buttons once a team gets points
    document.querySelectorAll('button[onclick*="hostJudge"]').forEach(b => { b.disabled = true; b.style.opacity = '0.3'; });
  } else {
    document.querySelectorAll(`button[onclick*="hostJudge('${team}'"]`).forEach(b => { b.disabled = true; b.style.opacity = '0.3'; });
  }
  // Re-render judge area
  const roomId = state.cat6RoomId;
  if (!roomId) return;
  import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ get }) => {
    get(ref(db, `cat6/${roomId}`)).then(snap => {
      const d = snap.val() || {};
      const area = document.getElementById('cat6-judge-area');
      if (area) renderJudgeArea(area, d.answerA, d.answerB, d.answeredAtA, d.answeredAtB);
    });
  });
};

window.overrideCat3 = (idx, status) => {
  c('overrideCat3', { idx, status });
};

window.goMenu = () => {
  c('menu');
  state = {...state, currentRound:null, currentQ:-1, onGameScreen:false};
  view = {};
  render();
};

function render() {
  const sCat = document.getElementById('s-cat');
  const sQ = document.getElementById('s-q');
  const scNa = document.getElementById('sc-na');
  const scNb = document.getElementById('sc-nb');
  const scA = document.getElementById('sc-a');
  const scB = document.getElementById('sc-b');
  const dyn = document.getElementById('dyn');
  const btnNext = document.getElementById('btn-next');
  const btnPrev = document.getElementById('btn-prev');
  const catGrid = document.getElementById('cat-grid');

  if (!state.teamA) {
    dyn.innerHTML = `<div class="waiting">⏳ ${SESSION === 'main' ? 'No session — scan QR from main game' : 'Waiting for game data...'}</div>
    <div style="font-size:10px;color:rgba(255,255,255,0.2);text-align:center;margin-top:4px">path: sessions/${SESSION}/hostState</div>`;
    btnNext.disabled = false; btnPrev.disabled = false;
    return;
  }

  // Scores
  scNa.textContent = state.teamA || 'أ';
  scNb.textContent = state.teamB || 'ب';
  scA.textContent = state.scoreA || 0;
  scB.textContent = state.scoreB || 0;

  // Status
  const round = ROUNDS.find(r => r.id === state.currentRound);
  const q = state.currentQ;
  sCat.textContent = round ? ht('catLabel', round.num, round.name) : _lang==='en'?'Menu':'القائمة';
  sQ.textContent = q===-1?ht('titleSlide'):q===0?ht('rulesSlide'):q>=1?ht('questionNum',q):'';

  // Nav buttons
  const inGame = state.onGameScreen && !!state.currentRound;
  const maxQ = state.currentRoundCount || 10;
  btnNext.disabled = !inGame;
  btnPrev.disabled = !inGame || q <= -1;

  // Hide roulette button when inside a category
  const rouletteBtn = document.getElementById('btn-roulette');
  if (rouletteBtn) rouletteBtn.style.display = inGame ? 'none' : 'flex';

  // Category grid
  const done = state.done || [];
  const inCat = !!state.currentRound && state.onGameScreen;
  catGrid.innerHTML = ROUNDS.map(r => {
    const isDone = done.includes(r.id);
    const isCurrent = state.currentRound === r.id;
    const isRoulette = roulette?.id === r.id && !isCurrent && !isDone;
    const isLocked = (inCat && !isCurrent) || isDone; // lock all others when in a category + done
    const cls = isDone?'done':isCurrent?'current':isRoulette?'roulette':isLocked&&!isDone?'locked':'';
    const disabled = isDone || isCurrent || isLocked;
    return `<button class="cat-btn ${cls}" ${disabled?'disabled':''}
      onclick="${disabled?'':'c(\'openCat\',{id:\''+r.id+'\'})'} ">
      ${isRoulette?'🎯 ':''}${r.num}. ${r.name}
    </button>`;
  }).join('');

  // Dynamic content
  if (!round || !state.onGameScreen) {
    dyn.innerHTML = roulette
      ? `<div class="card info-card" style="color:var(--green);border-color:var(--green);font-size:16px;font-weight:900">🎯 ${_lang==='en'?'Spinning to:':'اللعبة اختارت:'}<br>${roulette.name}</div>`
      : `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0">
          <div style="font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:3px">${_lang==='en'?'Teams':'الفريقان'}</div>
          <div style="display:flex;gap:16px;justify-content:center;width:100%">
            <div style="flex:1;text-align:center;padding:12px;background:rgba(229,1,88,0.08);border:2px solid #E50158;border-radius:12px">
              <div style="font-size:11px;color:rgba(229,1,88,0.7)">${_lang==='en'?'Team A':'الفريق أ'}</div>
              <div style="font-size:20px;font-weight:900;color:#E50158">${state.teamA||'—'}</div>
              <div style="font-size:22px;font-weight:900;color:#E50158">${state.scoreA||0}</div>
            </div>
            <div style="flex:1;text-align:center;padding:12px;background:rgba(226,218,81,0.08);border:2px solid #E2DA51;border-radius:12px">
              <div style="font-size:11px;color:rgba(226,218,81,0.7)">${_lang==='en'?'Team B':'الفريق ب'}</div>
              <div style="font-size:20px;font-weight:900;color:#E2DA51">${state.teamB||'—'}</div>
              <div style="font-size:22px;font-weight:900;color:#E2DA51">${state.scoreB||0}</div>
            </div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.25);text-align:center">${_lang==='en'?'Select a round below':'اختر فقرة من القائمة أدناه'}</div>
        </div>`;
    return;
  }

  if (q === -1) {
    dyn.innerHTML = `<div class="card q-card" style="color:var(--yellow);border-color:var(--yellow);font-size:18px">🎬 ${round.name}</div>
      <div class="info-card">${_lang==='en'?'Next → Rules':'التالي → قوانين اللعبة'}</div>`;
    return;
  }
  if (q === 0) {
    dyn.innerHTML = `<div class="card q-card" style="color:var(--cyan)">${_lang==='en'?'📋 Rules:':'📋 قوانين:'} ${round.name}</div>
      <div class="info-card">${_lang==='en'?'Next → First Question':'التالي → السؤال الأول'}</div>`;
    return;
  }

  // Cat 3
  if (state.currentRound === 'r3') {
    if (!cat3) { dyn.innerHTML = _lang==='en'?'<div class="waiting">Waiting for auction...</div>':'<div class="waiting">انتظر بدء المزاد...</div>'; return; }
    const bids = cat3.bids||{};
    const answers = cat3.answers||[];
    const phase = cat3.phase || 'waiting';
    const connA = cat3.connected?.a;
    const connB = cat3.connected?.b;
    const bothConnected = connA && connB;
    dyn.innerHTML = `
      ${cat3.question?`<div class="card q-card">${cat3.question}</div>`:''}
      ${(phase === 'waiting' || phase === 'ready') && !cat3.auctionWinner ? `
        <div style="display:flex;gap:8px;justify-content:center;font-size:12px">
          <span style="color:${connA?'#39FF14':'rgba(255,255,255,0.3)'}">● ${cat3.teamA||'أ'}</span>
          <span style="color:${connB?'#39FF14':'rgba(255,255,255,0.3)'}">● ${cat3.teamB||'ب'}</span>
        </div>
        ${bothConnected ? `<button class="btn btn-g btn-sm" onclick="c('startCat3')" style="width:100%;font-size:15px">${_lang==='en'?'🎯 Start Auction':'🎯 ابدأ المزاد'}</button>` : _lang==='en'?'<div class="waiting" style="font-size:12px">Waiting for both teams...</div>':'<div class="waiting" style="font-size:12px">انتظر اتصال الفريقين...</div>'}
      ` : ''}
      ${phase === 'bidding' || phase === 'answering' || cat3.auctionWinner ? `
        <div class="bid-row">
          <div class="bid-card bid-a"><div class="bid-n" style="color:#E50158">${cat3.teamA||'أ'}</div><div class="bid-v" style="color:#E50158">${bids.a?.value||'—'}</div></div>
          <div style="font-size:12px;color:rgba(255,255,255,0.2);align-self:center">VS</div>
          <div class="bid-card bid-b"><div class="bid-n" style="color:#E2DA51">${cat3.teamB||'ب'}</div><div class="bid-v" style="color:#E2DA51">${bids.b?.value||'—'}</div></div>
        </div>
        ${cat3.auctionWinner?`<div class="info-card" style="color:var(--green)">🏆 ${cat3.auctionWinner==='a'?cat3.teamA:cat3.teamB} — ${cat3.winningBid} ${_lang==='en'?'answers':'أجوبة'}</div>`:''}
        <div style="display:flex;flex-direction:column;gap:5px">
          ${answers.length?answers.map((a,i)=>`
            <div class="ans-chip chip-${a.status==='correct'?'ok':a.status==='wrong'?'no':'p'}" style="justify-content:space-between">
              <span>${i+1}. ${a.text}</span>
              <span style="display:flex;gap:4px;flex-shrink:0">
                <button onclick="overrideCat3(${i},'correct')" style="padding:2px 7px;border-radius:5px;border:1.5px solid #39FF14;color:#39FF14;background:${a.status==='correct'?'rgba(57,255,20,0.25)':'rgba(57,255,20,0.05)'};font-size:11px;cursor:pointer">✅</button>
                <button onclick="overrideCat3(${i},'wrong')" style="padding:2px 7px;border-radius:5px;border:1.5px solid #FF2D2D;color:#FF2D2D;background:${a.status==='wrong'?'rgba(255,45,45,0.25)':'rgba(255,45,45,0.05)'};font-size:11px;cursor:pointer">❌</button>
              </span>
            </div>`).join(''):'<div class="info-card">' + (_lang==='en'?'No answers yet':'لا أجوبة بعد') + '</div>'}
        </div>
      ` : ''}`;
    return;
  }

  // Cat 6 — video controls
  if (state.currentRound === 'r5') {
    dyn.innerHTML = `
      <div class="card q-card" style="color:var(--yellow);border-color:var(--yellow)">🎬 ${_lang==='en'?'Video':'فيديو'} ${q >= 1 ? q : ''} ${_lang==='en'?'of':'من'} ${state.currentRoundCount||4}</div>
      <div class="btn-row">
        <button class="btn btn-g btn-sm" onclick="c('videoPlay')">${_lang==='en'?'▶ Play':'▶ تشغيل'}</button>
        <button class="btn btn-y btn-sm" onclick="c('videoRepeat')">${_lang==='en'?'🔁 Replay':'🔁 إعادة'}</button>
      </div>
      <button class="btn btn-c btn-sm" onclick="c('videoReveal')" style="width:100%">${_lang==='en'?'📋 Show Question':'📋 عرض السؤال'}</button>
      ${view.answer?`<div class="card a-card" style="font-size:14px">${view.answer}</div>`:''}
      ${view.answer?`<button class="btn btn-g btn-sm" onclick="c('revealCat6Answer')" style="width:100%">${_lang==='en'?'👁 Reveal Answer':'👁 كشف الجواب للجميع'}</button>`:''}
      <div id="cat6-judge-area" style="width:100%"></div>`;
    loadCat6Answers();
    return;
  }

  // Closest categories (r6, r7) — show question reveal and answer reveal buttons
  const qText = view.question || '';
  const ans = view.answer || '';
  if (['r6','r7'].includes(state.currentRound)) {
    const isFirstQ = (state.currentQ || 0) <= 1;
    dyn.innerHTML = `
      ${qText ? `<div class="card q-card">${qText}</div>` : _lang==='en'?'<div class="waiting">Press Show Question first</div>':'<div class="waiting">اضغط عرض السؤال أولاً</div>'}
      ${ans ? `<div class="card a-card">${ans}</div>` : ''}
      <div class="btn-row">
        ${isFirstQ ? `<button class="btn btn-c btn-sm" onclick="c('showQuestion')" style="font-size:12px">${_lang==='en'?'📋 Show Question':'📋 عرض السؤال'}</button>` : ''}
        <button class="btn btn-g btn-sm" onclick="c('revealAnswer')" style="font-size:12px">${_lang==='en'?'👁 Reveal Answer':'👁 كشف الجواب'}</button>
      </div>`;
    return;
  }

  // All other categories
  const isImgCat = ['r1','r2','r8'].includes(state.currentRound);
  const isCat9 = state.currentRound === 'r8';
  dyn.innerHTML = `
    ${!isImgCat && qText ? `<div class="card q-card">${qText}</div>` : ''}
    ${ans ? `<div class="card a-card">${ans}</div>` : _lang==='en'?'<div class="waiting">Loading question...</div>':'<div class="waiting">جاري تحميل السؤال...</div>'}
    ${isCat9 ? `<button class="btn btn-y btn-sm" onclick="c('startTimer',{seconds:60})" style="width:100%">${_lang==='en'?'⏱ Start Timer':'⏱ ابدأ التايمر'}</button>` : ''}
    ${ans ? `<button class="btn btn-g btn-sm" onclick="c('revealAnswer')" style="width:100%;margin-top:2px">${_lang==='en'?'👁 Reveal Answer':'👁 كشف الجواب للجميع'}</button>` : ''}
    ${scoreSection(round)}`;
}

function scoreSection(round) {
  if (!round) return '';
  const tA = state.teamA||'أ';
  const tB = state.teamB||'ب';
  const plus = round.plus || 2;
  const minus = Math.abs(round.minus || 0);
  let html = `<div style="display:flex;flex-direction:column;gap:5px;margin-top:4px">
    <div class="lbl">${_lang==='en'?'— Manual Score —':'— نقاط يدوية —'}</div>
    <div class="btn-row">
      <button class="btn btn-g btn-sm" onclick="c('addScore',{team:'a',pts:${plus}})">+${plus} ${tA}</button>
      ${minus!==0?`<button class="btn btn-r btn-sm" onclick="c('addScore',{team:'a',pts:${-minus}})">-${minus} ${tA}</button>`:''}
    </div>
    <div class="btn-row">
      <button class="btn btn-g btn-sm" onclick="c('addScore',{team:'b',pts:${plus}})">+${plus} ${tB}</button>
      ${minus!==0?`<button class="btn btn-r btn-sm" onclick="c('addScore',{team:'b',pts:${-minus}})">-${minus} ${tB}</button>`:''}
    </div>
  </div>`;
  return html;
}

// Firebase listeners
onValue(ref(db,P('hostView')), s => { view = s.val()||{}; render(); });
onValue(ref(db,P('hostState')), s => {
  state = s.val()||{};
  const dbg = document.getElementById('debug-session');
  if (dbg) dbg.textContent = `session: ${SESSION} | teams: ${state.teamA||'?'} vs ${state.teamB||'?'}`;
  if (state.cat3RoomId && state.cat3RoomId !== cat3Room) {
    cat3Room = state.cat3RoomId;
    onValue(ref(db,`rooms/${cat3Room}`), r => { cat3 = r.val(); render(); });
  }
  render();
});

// Score sub-listeners for instant update when addScore is called
onValue(ref(db,P('hostState/scoreA')), s => {
  const v = s.val();
  if (v !== null && v !== undefined) {
    state.scoreA = v;
    const el = document.getElementById('sc-a');
    if (el) el.textContent = v;
  }
});
onValue(ref(db,P('hostState/scoreB')), s => {
  const v = s.val();
  if (v !== null && v !== undefined) {
    state.scoreB = v;
    const el = document.getElementById('sc-b');
    if (el) el.textContent = v;
  }
});
onValue(ref(db,P('rouletteResult')), s => { roulette = s.val(); render(); });
onValue(ref(db,P('hostWallpaper')), s => {
  const url = s.val();
  if (url) document.body.style.backgroundImage = `url('${url}')`;
});
onValue(ref(db,P('hostState')), s => {
  const v = s.val();
  if (v?.hostWallpaper) document.body.style.backgroundImage = `url('${v.hostWallpaper}')`;
});

function applyHostLang() {
  const isAr = _lang === 'ar';
  document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
  document.documentElement.lang = isAr ? 'ar' : 'en';
  const els = {
    'h-prev-lbl':   isAr ? 'السابق'      : 'Prev',
    'h-next-lbl':   isAr ? 'التالي'      : 'Next',
    'h-menu-lbl':   isAr ? 'القائمة'     : 'Menu',
    'h-spin-lbl':   isAr ? 'دوّر'        : 'Spin',
    'h-select-lbl': isAr ? '— اختر فقرة —' : '— Select Round —',
  };
  Object.entries(els).forEach(([id, text]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  });
  // Rebuild category grid with correct language
  if (typeof buildCatGrid === 'function') buildCatGrid();
}

// Listen for lang from main game
onValue(ref(db, P('lang')), snap => {
  const l = snap.val();
  if (l) { _lang = l; applyHostLang(); render(); }
});

// Apply initial language
applyHostLang();

// Show session for debugging immediately
const dbg = document.getElementById('debug-session');
if (dbg) dbg.textContent = `session: ${SESSION} | waiting for Firebase...`;
</script>
</body>
</html>
