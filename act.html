<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3AL BALCON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Cairo',sans-serif;
  background:#060d1f; background-size:cover; background-position:center;
  color:#fff; min-height:100dvh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px 24px; text-align:center;
}
.overlay { position:fixed; inset:0; background:rgba(6,13,31,0.8); z-index:0; }
.content { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:20px; }
.logo { font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:3px; margin-bottom:8px; }
.label {
  font-size:14px; color:rgba(255,255,255,0.5);
  letter-spacing:2px; padding:6px 20px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:100px;
}
.name {
  font-size:clamp(44px,14vw,96px); font-weight:900;
  color:#FFE600;
  text-shadow:0 0 20px rgba(255,230,0,0.8), 0 0 50px rgba(255,230,0,0.4);
  line-height:1.2;
  filter:blur(18px);
  transition:filter 0.6s ease;
  user-select:none;
}
.name.revealed { filter:none; }
.tap-btn {
  background:rgba(255,230,0,0.12);
  border:2px solid #FFE600;
  border-radius:100px;
  padding:14px 40px;
  color:#FFE600;
  font-family:'Cairo',sans-serif;
  font-size:18px; font-weight:900;
  cursor:pointer;
  letter-spacing:1px;
  box-shadow:0 0 20px rgba(255,230,0,0.3);
  transition:all 0.2s;
}
.tap-btn:active { transform:scale(0.96); }
.hint {
  font-size:13px; color:rgba(255,255,255,0.3);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:100px; padding:6px 18px;
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="content">
  <div class="logo">3AL BALCON</div>
  <div class="label" id="act-label">🎭 سكر تمك — الاسم السري</div>
  <div class="name" id="name">...</div>
  <button class="tap-btn" id="tap-btn" onclick="revealWord()">👁 <span id="tap-lbl">اضغط لرؤية الكلمة</span></button>
  <div class="hint" id="act-hint" style="display:none">بس انت شوف الجواب</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyAY-zBQnRPTZLUDMCbod-NFkmuIG4W0XxE",
  authDomain:"al-balcon.firebaseapp.com",
  databaseURL:"https://al-balcon-default-rtdb.firebaseio.com",
  projectId:"al-balcon",
  storageBucket:"al-balcon.firebasestorage.app",
  messagingSenderId:"556294454945",
  appId:"1:556294454945:web:770c330e71a4e484277ae0"
};
const app = initializeApp(cfg);
const db  = getDatabase(app);

const params  = new URLSearchParams(window.location.search);
const name    = params.get('n') ? decodeURIComponent(params.get('n')) : '—';
const session = params.get('s') || 'main';
let _lang     = params.get('l') || 'ar';

document.getElementById('name').textContent = name;

const T = {
  ar: { label:'🎭 سكر تمك — الاسم السري', hint:'بس انت شوف الجواب', tapBtn:'اضغط لرؤية الكلمة' },
  en: { label:'🎭 Zip It! — Secret Word',  hint:'Only you can see this!', tapBtn:'Tap to reveal' }
};

function applyLang() {
  const L = T[_lang] || T.ar;
  document.getElementById('act-label').textContent = L.label;
  document.getElementById('act-hint').textContent  = L.hint;
  document.getElementById('tap-lbl').textContent   = L.tapBtn;
  document.documentElement.dir  = _lang==='ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = _lang==='ar' ? 'ar'  : 'en';
}

window.revealWord = function() {
  document.getElementById('name').classList.add('revealed');
  document.getElementById('tap-btn').style.display = 'none';
  document.getElementById('act-hint').style.display = 'block';
};
applyLang();

// Load wallpaper from Firebase hostState
onValue(ref(db, `sessions/${session}/hostWallpaper`), snap => {
  const url = snap.val();
  if (url) document.body.style.backgroundImage = `url('${url}')`;
});

// Listen for lang changes
onValue(ref(db, `sessions/${session}/lang`), snap => {
  const l = snap.val();
  if (l && l !== _lang) { _lang = l; applyLang(); }
});

// Shutdown listener
onValue(ref(db, `sessions/${session}/shutdown`), snap => {
  if (!snap.val()) return;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#060d1f;flex-direction:column;gap:16px';
  overlay.innerHTML = `
    <div style="font-family:Cairo,sans-serif;font-size:clamp(36px,10vw,72px);font-weight:900;color:#FAC70A;text-shadow:0 0 30px rgba(250,199,10,0.6);letter-spacing:4px;animation:pulse 2s infinite;text-align:center">3AL BALCON</div>
    <div style="font-family:Cairo,sans-serif;font-size:14px;color:rgba(255,255,255,0.3)">${_lang==='ar'?'انتهت اللعبة':'Game ended'}</div>`;
  document.body.appendChild(overlay);
});
</script>
</body>
</html>
