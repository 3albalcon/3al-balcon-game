<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3AL BALCON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --pink:#FF2D78;--cyan:#00EFFF;--yellow:#FFE600;--green:#39FF14;--red:#FF2D2D;--dark:#060d1f;--a:#E50158;--b:#E2DA51; }
body { font-family:'Cairo',sans-serif;background:var(--dark);color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 14px 24px;gap:10px;overflow-x:hidden;background-size:cover;background-position:center; }
body::before { content:'';position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:0;pointer-events:none; }
body > * { position:relative;z-index:1; }
.logo-text { font-size:28px;font-weight:900;color:var(--yellow);text-shadow:0 0 20px rgba(255,230,0,0.6);letter-spacing:4px;text-align:center; }
.logo-sub { font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:3px; }
.team-badge { font-size:22px;font-weight:900;padding:8px 24px;border-radius:100px;border:2px solid;text-align:center;width:100%; }
.badge-a { color:var(--a);border-color:var(--a);box-shadow:0 0 16px rgba(229,1,88,0.4);background:rgba(229,1,88,0.08); }
.badge-b { color:var(--b);border-color:var(--b);box-shadow:0 0 16px rgba(226,218,81,0.4);background:rgba(226,218,81,0.08); }
.q-box { background:rgba(0,239,255,0.06);border:2px solid var(--cyan);border-radius:14px;padding:14px;font-size:16px;font-weight:700;text-align:center;line-height:1.5;width:100%; }
.big-num { font-size:80px;font-weight:900;line-height:1;text-align:center; }
.bid-num { color:var(--yellow);text-shadow:0 0 20px rgba(255,230,0,0.6); }
.cdown-num { color:var(--red);text-shadow:0 0 20px rgba(255,45,45,0.6);animation:pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.95)} }
.timer-wrap { width:100%;display:flex;flex-direction:column;align-items:center;gap:4px; }
.timer-big { font-size:52px;font-weight:900;line-height:1; }
.timer-bar { width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:100px;overflow:hidden; }
.timer-fill { height:100%;border-radius:100px;transition:width 0.3s linear; }
.sbox { width:100%;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;line-height:1.4; }
.s-cyan { background:rgba(0,239,255,0.08);border:2px solid var(--cyan);color:var(--cyan); }
.s-red { background:rgba(255,45,45,0.08);border:2px solid var(--red);color:var(--red); }
.s-green { background:rgba(57,255,20,0.08);border:2px solid var(--green);color:var(--green); }
.s-yellow { background:rgba(255,230,0,0.08);border:2px solid var(--yellow);color:var(--yellow); }
.btn { width:100%;padding:14px;border-radius:12px;font-family:'Cairo',sans-serif;font-size:17px;font-weight:900;cursor:pointer;transition:all 0.15s;border:2px solid; }
.btn:active { transform:scale(0.96); }
.btn:disabled { opacity:0.3;cursor:default;transform:none; }
.btn-g { background:rgba(57,255,20,0.1);border-color:var(--green);color:var(--green); }
.btn-c { background:rgba(0,239,255,0.1);border-color:var(--cyan);color:var(--cyan); }
.bid-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%; }
.bid-btn { padding:12px 0;border-radius:10px;font-family:'Cairo',sans-serif;font-size:17px;font-weight:900;cursor:pointer;border:2px solid var(--yellow);background:rgba(255,230,0,0.08);color:var(--yellow);transition:all 0.15s; }
.bid-btn:active { transform:scale(0.93);background:rgba(255,230,0,0.25); }
.bid-btn:disabled { opacity:0.25;cursor:default;transform:none; }
.answer-input { width:100%;padding:14px;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.2);border-radius:10px;font-family:'Cairo',sans-serif;font-size:18px;font-weight:700;color:#fff;outline:none;text-align:right;direction:rtl; }
.answer-input:focus { border-color:var(--green);box-shadow:0 0 10px rgba(57,255,20,0.3); }
.answer-input:disabled { opacity:0.4; }
.chip { padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px; }
.chip-p { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7); }
.chip-ok { background:rgba(57,255,20,0.1);border:1px solid var(--green);color:var(--green); }
.chip-no { background:rgba(255,45,45,0.1);border:1px solid var(--red);color:var(--red); }
.flash { position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.1s; }
.flash.show { opacity:1; }
.flash-text { font-size:clamp(48px,15vw,120px);font-weight:900;text-align:center; }
.q-ind { font-size:11px;color:rgba(255,255,255,0.35);text-align:center; }
.ans-scroll { overflow-y:auto;max-height:200px;display:flex;flex-direction:column;gap:6px;width:100%; }
.ans-fixed { display:flex;flex-direction:column;gap:8px;width:100%; }
/* Logo waiting screen */
.logo-screen { width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px; }
</style>
</head>
<body>
<div class="logo-sub">3AL BALCON — <span id="bid-logo-sub">مزاد علني</span></div>
<div class="team-badge" id="team-badge"><span id="bid-connecting">جاري الاتصال...</span></div>
<div class="q-ind" id="q-ind"></div>
<div style="font-size:9px;color:rgba(255,255,255,0.2);text-align:center;word-break:break-all" id="debug-room"></div>
<div class="flash" id="flash"><div class="flash-text" id="flash-text"></div></div>

<!-- WAITING -->
<div id="ph-waiting" style="width:100%;display:flex;flex-direction:column;gap:10px">
  <div class="sbox s-cyan" id="wait-msg"><span id="bid-wait-msg">⏳ بانتظار الفريق الثاني...</span></div>
</div>

<!-- READY -->
<div id="ph-ready" style="width:100%;display:flex;flex-direction:column;gap:10px;display:none">
  <div class="sbox s-cyan" id="ready-msg"><span id="bid-ready-msg">⏳ انتظر الفريق الثاني...</span></div>
  <button class="btn btn-g" id="ready-btn" onclick="setReady()"><span id="bid-ready-btn-lbl">✅ جاهز للبدء!</span></button>
</div>

<!-- COUNTDOWN -->
<div id="ph-countdown" style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;display:none">
  <div class="big-num cdown-num" id="ph-cd-num">3</div>
</div>

<!-- BIDDING -->
<div id="ph-bidding" style="width:100%;display:flex;flex-direction:column;gap:10px;display:none">
  <div class="q-box" id="q-bid"></div>
  <div class="big-num bid-num" id="bid-val">0</div>
<!-- Timer hidden on phone — only on main screen -->
  <div style="display:none">
    <div class="timer-bar"><div class="timer-fill" id="bid-fill" style="width:100%;background:var(--yellow)"></div></div>
    <div id="bid-timer-num">10</div>
  </div>
  <div class="sbox s-yellow" id="bid-msg" style="display:none"></div>
  <div class="bid-grid">
    <button class="bid-btn" onclick="placeBid(1)">+1</button>
    <button class="bid-btn" onclick="placeBid(2)">+2</button>
    <button class="bid-btn" onclick="placeBid(3)">+3</button>
    <button class="bid-btn" onclick="placeBid(4)">+4</button>
    <button class="bid-btn" onclick="placeBid(5)">+5</button>
  </div>
</div>

<!-- LOGO WAITING (lost bidding or time over) -->
<div id="ph-logo" style="position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:50">
  <img id="waiting-img" src="" style="width:100%;height:100%;object-fit:cover;display:none">
  <div id="waiting-fallback" style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div style="font-size:clamp(36px,12vw,72px);font-weight:900;color:var(--yellow);text-shadow:0 0 30px rgba(255,230,0,0.7);letter-spacing:4px;text-align:center;animation:pulse 2s infinite">3AL BALCON</div>
    <div style="font-size:16px;color:rgba(255,255,255,0.5);text-align:center;font-weight:700" id="logo-msg"><span id="bid-wait-logo">انتظر...</span></div>
  </div>
</div>

<!-- ANSWERING -->
<div id="ph-answering" style="width:100%;display:flex;flex-direction:column;gap:8px;flex:1;display:none">
  <div class="q-box" id="q-ans"></div>
  <!-- Answer timer -->
  <div id="ans-timer-wrap" style="display:none;width:100%;flex-direction:column;align-items:center;gap:4px">
    <div class="timer-bar"><div class="timer-fill" id="ans-fill" style="width:100%;background:var(--green)"></div></div>
    <div class="q-ind" id="ans-timer-num" style="font-size:16px;font-weight:900;color:var(--green)"></div>
  </div>

  <div class="sbox s-green" id="ans-title"><span id="bid-ans-title">اكتبوا الأجوبة!</span></div>
  <div id="ans-scroll" class="ans-scroll"></div>
  <!-- Start writing button -->
  <div id="start-writing-wrap" style="width:100%;display:flex;flex-direction:column;gap:8px">
    <button class="btn btn-g" id="start-writing-btn" onclick="startWriting()"><span id="bid-start-writing">✏️ ابدأ الكتابة</span></button>
  </div>
  <div class="ans-fixed" id="ans-input-wrap" style="display:none">
    <input class="answer-input" id="ans-input" type="text" placeholder="اكتب الجواب هنا..." dir="rtl" autocomplete="off" onkeydown="if(event.key==='Enter')submitAnswer()">
    <button class="btn btn-g" id="ans-submit-btn" onclick="submitAnswer()"><span id="bid-add-ans">✅ أضف الجواب</span></button>
    <button class="btn btn-c" id="confirm-btn" onclick="confirmAnswers()" style="display:none"><span id="bid-confirm-lbl">🔒 تأكيد الأجوبة</span></button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyAY-zBQnRPTZLUDMCbod-NFkmuIG4W0XxE",
  authDomain:"al-balcon.firebaseapp.com",
  databaseURL:"https://al-balcon-default-rtdb.firebaseio.com",
  projectId:"al-balcon",
  storageBucket:"al-balcon.firebasestorage.app",
  messagingSenderId:"556294454945",
  appId:"1:556294454945:web:770c330e71a4e484277ae0"
};
const app = initializeApp(cfg);
const db = getDatabase(app);
const params = new URLSearchParams(window.location.search);
const team = params.get('t');
const roomId = params.get('r') || 'room1';
const sessionId = params.get('s') || 'main';
const other = team === 'a' ? 'b' : 'a';
if (!team) { document.body.innerHTML='<div style="color:red;padding:40px;text-align:center">Invalid link</div>'; throw new Error(); }

// ── Language system ──
let _lang = params.get('l') || 'ar'; // read from URL immediately
const BT = {
  ar: {
    connecting: 'جاري الاتصال...',
    logoSub: 'مزاد علني',
    waitMsg: '⏳ بانتظار الفريق الثاني...',
    readyMsg: '⏳ انتظر الفريق الثاني...',
    readyBtn: '✅ جاهز للبدء!',
    ansTitle: 'اكتبوا الأجوبة!',
    startWriting: '✏️ ابدأ الكتابة',
    addAns: '✅ أضف الجواب',
    confirmLbl: '🔒 تأكيد الأجوبة',
    waitLogo: 'انتظر...',
    closeScreen: 'يمكنك إغلاق هذه الشاشة',
    writeHere: 'اكتب الجواب هنا...',
    editAnswer: (i) => `تعديل الجواب ${i+1}...`,
    yourBid: (n) => `✅ مزايدتك: ${n}`,
    otherBid: (n) => `🔥 الفريق الثاني زايد ${n}`,
    otherBidUrgent: (n) => `⚡ الفريق الثاني زايد ${n} — زايد أو خسرت!`,
    youLead: (n) => `✅ مزايدتك: ${n} — انتظر الفريق الثاني`,
    questionOf: (i) => `سؤال ${i+1} من 5`,
    otherWaiting: '✅ الفريق الثاني ناطر',
    waitingOther: '⏳ بانتظار الفريق الثاني...',
    otherReady: '✅ الفريق الثاني جاهز!',
    waitForOther: '⏳ انتظر الفريق الثاني...',
    otherWriting: 'الفريق الثاني يكتب الأجوبة...',
    waitNext: '⏳ انتظر السؤال التالي...',
    confirmTitle: '🔒 تأكيد الأجوبة؟',
    confirmMsg: 'لا يمكن التعديل بعد التأكيد',
    confirmYes: '✅ تأكيد',
    confirmBack: '↩ رجوع',
    answersSent: 'تم إرسال الأجوبة!',
    waitingHost: 'في انتظار المقدّم...',
    auctionEnd: '🏁 انتهى المزاد!',
  },
  en: {
    connecting: 'Connecting...',
    logoSub: 'Public Auction',
    waitMsg: '⏳ Waiting for other team...',
    readyMsg: '⏳ Wait for other team...',
    readyBtn: '✅ Ready to start!',
    ansTitle: 'Write your answers!',
    startWriting: '✏️ Start Writing',
    addAns: '✅ Add Answer',
    confirmLbl: '🔒 Confirm Answers',
    waitLogo: 'Wait...',
    closeScreen: 'You can close this screen',
    writeHere: 'Write your answer here...',
    editAnswer: (i) => `Edit answer ${i+1}...`,
    yourBid: (n) => `✅ Your bid: ${n}`,
    otherBid: (n) => `🔥 Other team bid ${n}`,
    otherBidUrgent: (n) => `⚡ Other team bid ${n} — bid higher or lose!`,
    youLead: (n) => `✅ Your bid: ${n} — waiting for other team`,
    questionOf: (i) => `Question ${i+1} of 5`,
    otherWaiting: '✅ Other team is waiting',
    waitingOther: '⏳ Waiting for other team...',
    otherReady: '✅ Other team is ready!',
    waitForOther: '⏳ Wait for other team...',
    otherWriting: 'Other team is writing answers...',
    waitNext: '⏳ Waiting for next question...',
    confirmTitle: '🔒 Confirm answers?',
    confirmMsg: 'Cannot edit after confirming',
    confirmYes: '✅ Confirm',
    confirmBack: '↩ Back',
    answersSent: 'Answers sent!',
    waitingHost: 'Waiting for host...',
    auctionEnd: '🏁 Auction ended!',
  }
};
function bt(key, ...args) {
  const L = BT[_lang] || BT.ar;
  const v = L[key];
  return typeof v === 'function' ? v(...args) : (v ?? BT.ar[key] ?? key);
}
function applyBidLang() {
  const isAr = _lang === 'ar';
  document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
  document.documentElement.lang = isAr ? 'ar' : 'en';
  document.title = `3AL BALCON — ${bt('logoSub')}`;
  const els = {
    'bid-logo-sub':      bt('logoSub'),
    'bid-connecting':    bt('connecting'),
    'bid-wait-msg':      bt('waitMsg'),
    'bid-ready-msg':     bt('readyMsg'),
    'bid-ready-btn-lbl': bt('readyBtn'),
    'bid-ans-title':     bt('ansTitle'),
    'bid-start-writing': bt('startWriting'),
    'bid-add-ans':       bt('addAns'),
    'bid-confirm-lbl':   bt('confirmLbl'),
    'logo-msg':          bt('waitLogo'),
  };
  Object.entries(els).forEach(([id, text]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  });
  const waitLogo = document.getElementById('bid-wait-logo');
  if (waitLogo) waitLogo.textContent = isAr ? 'انتظر...' : 'Wait...';
  const inp = document.getElementById('ans-input');
  if (inp) {
    inp.placeholder = bt('writeHere');
    inp.dir = isAr ? 'rtl' : 'ltr';
  }
}
// Apply language immediately on load
applyBidLang();

let myBid = 0;
let submitted = [];
let totalAns = 0;
let phase = '';
let lastBidder = null;
let lastBidCountdownEnd = null;
let bidInterval = null;
let ansInterval = null;
let locked = false;
let ansGeneration = 0; // increments each new question to invalidate stale callbacks

// Get server time offset once for accurate timers
let serverOffset = 0;
get(ref(db, '.info/serverTimeOffset')).then(snap => { serverOffset = snap.val() || 0; }).catch(()=>{});

function serverNow() { return Date.now() + serverOffset; }

// Mark as connected
update(ref(db,`rooms/${roomId}/connected`), {[team]:true}).catch(()=>{});
document.getElementById('debug-room').textContent = `room: ${roomId} | team: ${team}`;

const badge = document.getElementById('team-badge');

function showPhase(name) {
  ['waiting','ready','countdown','bidding','logo','answering'].forEach(p=>{
    const el=document.getElementById('ph-'+p);
    if(el) el.style.display = p===name?'flex':'none';
  });
}

function flash(msg, color) {
  const o=document.getElementById('flash'), t=document.getElementById('flash-text');
  t.textContent=msg; t.style.color=color;
  o.style.background=color==='var(--green)'?'rgba(0,20,0,0.88)':'rgba(20,15,0,0.88)';
  o.classList.add('show');
  setTimeout(()=>o.classList.remove('show'),900);
}

function setBidBtns(en) { document.querySelectorAll('.bid-btn').forEach(b=>b.disabled=!en); }

function startBidTimer(endTime) {
  if(bidInterval) cancelAnimationFrame(bidInterval); bidInterval=null;
  const fill = document.getElementById('bid-fill');
  const num = document.getElementById('bid-timer-num');
  const total = 10000;
  function tick() {
    const rem = Math.max(0, endTime - Date.now());
    const pct = (rem/total)*100;
    const secs = Math.ceil(rem/1000);
    if(fill){ fill.style.width=pct+'%'; fill.style.background=pct<30?'var(--red)':'var(--yellow)'; }
    if(num){ num.textContent=secs; num.style.color=pct<30?'var(--red)':'var(--yellow)'; }
    if(rem>0) bidInterval = requestAnimationFrame(tick);
  }
  bidInterval = requestAnimationFrame(tick);
}

function startAnsTimer(endTime) {
  if(locked) return;
  clearInterval(ansInterval);
  const fill = document.getElementById('ans-fill');
  const num = document.getElementById('ans-timer-num');
  const total = 60000;
  ansInterval = setInterval(()=>{
    if(locked){ clearInterval(ansInterval); ansInterval=null; return; } // stop if locked
    const rem = Math.max(0, endTime - Date.now());
    const pct = (rem/total)*100;
    const secs = Math.ceil(rem/1000);
    if(fill){ fill.style.width=pct+'%'; fill.style.background=pct<20?'var(--red)':'var(--green)'; }
    if(num){ num.textContent=secs; num.style.color=pct<20?'var(--red)':'var(--yellow)'; }
    if(rem<=0){ clearInterval(ansInterval); ansInterval=null; if(!locked){ lockAnswering(); update(ref(db,`rooms/${roomId}`),{answersConfirmed:true, answerTimerEnd:Date.now()}); } }
  },100);
}

function lockAnswering() {
  locked = true;
  // Show styled done card
  const wrap = document.getElementById('ans-input-wrap');
  if (wrap) wrap.innerHTML = `
    <div style="width:100%;background:rgba(57,255,20,0.05);border:2px solid var(--green);border-radius:16px;box-shadow:0 0 20px rgba(57,255,20,0.2);padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="font-size:52px;line-height:1">✅</div>
      <div style="font-size:20px;font-weight:900;color:var(--green);text-shadow:0 0 10px rgba(57,255,20,0.5)">${bt('answersSent')}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.4)">${bt('waitingHost')}</div>
    </div>`;
  const iwrap = document.getElementById('ans-input-wrap');
  const swrap = document.getElementById('start-writing-wrap');
  if(iwrap) iwrap.style.display='none';
  if(swrap) swrap.style.display='none';
}

function renderAnswers() {
  const scroll=document.getElementById('ans-scroll');
  const title=document.getElementById('ans-title');
  const conf=document.getElementById('confirm-btn');
  if(!scroll) return;
  if(title) title.textContent=_lang==='en'?`Write ${totalAns} answers (${submitted.length}/${totalAns})`:`اكتبوا ${totalAns} أجوبة (${submitted.length}/${totalAns})`;
  scroll.innerHTML=submitted.map((a,i)=>`
    <div class="chip chip-p" style="justify-content:space-between;cursor:${locked?'default':'pointer'}" onclick="${locked?'':'editAnswer('+i+')'}">
      <span style="flex:1">${i+1}. ${a.text}</span>
      ${locked?'<span>⏳</span>':'<span style="font-size:10px;opacity:0.5">✏️</span>'}
    </div>`).join('');
  scroll.scrollTop = scroll.scrollHeight;
  if(conf) conf.style.display = (!locked && submitted.length>=totalAns) ? 'flex' : 'none';
}

window.startWriting = async function() {
  document.getElementById('start-writing-wrap').style.display = 'none';
  document.getElementById('ans-input-wrap').style.display = 'flex';
  const timerEnd = serverNow() + 60000;
  // Start 60s timer immediately when player taps ابدأ الكتابة
  await update(ref(db, `rooms/${roomId}`), { writingStarted: true, answerTimerEnd: timerEnd });
  // Show timer
  const timerWrap = document.getElementById('ans-timer-wrap');
  if (timerWrap) timerWrap.style.display = 'flex';
  startAnsTimer(timerEnd);
  setTimeout(() => {
    const inp = document.getElementById('ans-input');
    if(inp) { inp.disabled = false; inp.placeholder = bt('writeHere'); inp.focus(); }
  }, 100);
};

window.setReady = async function() {
  document.getElementById('ready-btn').disabled=true;
  document.getElementById('ready-btn').textContent=bt('readyBtn');
  await update(ref(db,`rooms/${roomId}`), {[`ready${team.toUpperCase()}`]:true});
};

window.placeBid = async function(amount) {
  try {
    const snap=await get(ref(db,`rooms/${roomId}/bids`));
    const bids=snap.val()||{};
    const highest=Math.max(bids['a']?.value||0, bids['b']?.value||0, myBid);
    myBid=highest+amount;
    document.getElementById('bid-val').textContent=myBid;
    setBidBtns(false);
    const msg=document.getElementById('bid-msg');
    if(msg){msg.style.display='flex';msg.textContent=bt('yourBid', myBid);
      msg.style.background='rgba(255,230,0,0.08)';msg.style.borderColor='var(--yellow)';msg.style.color='var(--yellow)';}
    flash(`${myBid} 🔥`,'var(--yellow)');

    const now = serverNow();
    const newEnd = now + 10000;

    await update(ref(db,`rooms/${roomId}`),{
      [`bids/${team}`]:{value:myBid,time:now},
      lastBidder:team, lastBidTime:now, bidCountdownEnd:newEnd
    });
    document.getElementById('debug-room').textContent = `✅ bid ok: ${myBid} | room: ${roomId}`;
  } catch(err) {
    document.getElementById('debug-room').textContent = `❌ ERROR: ${err.message}`;
    setBidBtns(true);
  }
};


let editingIdx = null;
window.editAnswer = function(idx) {
  if(locked) return;
  editingIdx = idx;
  const input = document.getElementById('ans-input');
  input.value = submitted[idx].text;
  input.focus();
  input.placeholder = bt('editAnswer', idx);
};

window.submitAnswer = async function() {
  if(locked) return;
  const input=document.getElementById('ans-input');
  const val=input.value.trim();
  if(!val) return;
  const norm=(s)=>s.toLowerCase().replace(/\s+/g,'');
  if(editingIdx !== null) {
    // Editing existing answer
    submitted[editingIdx] = {text:val, status:'pending'};
    editingIdx = null;
    input.placeholder = bt('writeHere');
  } else {
    if(submitted.length>=totalAns) return;
    if(submitted.some((a,i)=>norm(a.text)===norm(val))) {
      input.style.borderColor='var(--red)';
      setTimeout(()=>input.style.borderColor='',1200);
      return;
    }
    submitted.push({text:val,status:'pending'});
  }
  input.value='';
  input.focus();
  await set(ref(db,`rooms/${roomId}/answers`),submitted);
  renderAnswers();
};

window.confirmAnswers = async function() {
  if(locked) return;
  // Show styled in-page confirmation instead of browser popup
  const wrap = document.getElementById('ans-input-wrap');
  wrap.innerHTML = `
    <div style="width:100%;background:rgba(0,239,255,0.06);border:2px solid var(--cyan);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px">
      <div style="font-size:18px;font-weight:900;color:var(--cyan)">${bt('confirmTitle')}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.45)">${bt('confirmMsg')}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-g" style="flex:1;font-size:15px;padding:12px" onclick="doConfirmAnswers()">${bt('confirmYes')}</button>
        <button class="btn" style="flex:1;font-size:15px;padding:12px;border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);background:transparent" onclick="cancelConfirm()">${bt('confirmBack')}</button>
      </div>
    </div>`;
};

window.cancelConfirm = function() {
  // Restore the input area HTML that was replaced by confirm dialog
  const wrap = document.getElementById('ans-input-wrap');
  if (wrap) wrap.innerHTML = `
    <input class="answer-input" id="ans-input" type="text" dir="${_lang==='ar'?'rtl':'ltr'}" autocomplete="off" onkeydown="if(event.key==='Enter')submitAnswer()">
    <button class="btn btn-g" id="ans-submit-btn" onclick="submitAnswer()"><span>${bt('addAns')}</span></button>
    <button class="btn btn-c" id="confirm-btn" onclick="confirmAnswers()" style="display:none"><span>${bt('confirmLbl')}</span></button>`;
  const inp = document.getElementById('ans-input');
  if (inp) { inp.placeholder = bt('writeHere'); inp.focus(); }
  renderAnswers();
};

window.doConfirmAnswers = async function() {
  if(locked) return;
  // Stop the countdown timer immediately
  clearInterval(ansInterval);
  ansInterval = null;
  lockAnswering();
  await update(ref(db,`rooms/${roomId}`),{answersConfirmed:true, answerTimerEnd:Date.now()});
};

// ── Bid update handler ──
function handleBidUpdate(d) {
  const bids = d.bids || {};
  const myV = bids[team]?.value || 0;
  const otherV = bids[other]?.value || 0;
  if (myV > myBid) myBid = myV;

  // Show highest bid
  const highest = Math.max(myV, otherV);
  const bidEl = document.getElementById('bid-val');
  if (bidEl) bidEl.textContent = highest || 0;

  // Show other team's bid in status
  const msg = document.getElementById('bid-msg');
  if (otherV > myV && otherV > 0 && msg) {
    msg.style.display = 'flex';
    msg.textContent = bt('otherBid', otherV);
    msg.style.background = 'rgba(255,45,45,0.1)';
    msg.style.borderColor = 'var(--red)';
    msg.style.color = 'var(--red)';
  }

  // Handle new countdown
  if (d.bidCountdownEnd && d.lastBidder && d.bidCountdownEnd !== lastBidCountdownEnd) {
    lastBidCountdownEnd = d.bidCountdownEnd;
    lastBidder = d.lastBidder;
    const adjustedEnd = d.bidCountdownEnd - serverOffset;
    startBidTimer(adjustedEnd);
    const forMe = d.lastBidder === other;

    if (forMe) {
      flash(`${otherV} 🔥`, 'var(--green)');
      setBidBtns(true);
      if (msg) {
        msg.style.display = 'flex';
        msg.textContent = bt('otherBidUrgent', otherV);
        msg.style.background = 'rgba(255,45,45,0.1)';
        msg.style.borderColor = 'var(--red)';
        msg.style.color = 'var(--red)';
      }
      // Auto-lose when countdown expires
      clearTimeout(window._autoLose);
      window._autoLose = setTimeout(async () => {
        const s = await get(ref(db, `rooms/${roomId}`));
        const dd = s.val();
        if (dd?.phase === 'bidding' && dd?.lastBidder === other && dd?.bidCountdownEnd === d.bidCountdownEnd) {
          const otherBid = dd?.bids?.[other]?.value || 0;
          await update(ref(db, `rooms/${roomId}`), {
            phase: 'answering', auctionWinner: other, winningBid: otherBid,
            answerTimerEnd: serverNow() + 60000, answers: []
          });
        }
      }, Math.max(500, d.bidCountdownEnd - serverNow() + 500));
    } else {
      setBidBtns(false);
      if (msg) {
        msg.style.display = 'flex';
        msg.textContent = bt('youLead', myV);
        msg.style.background = 'rgba(255,230,0,0.08)';
        msg.style.borderColor = 'var(--yellow)';
        msg.style.color = 'var(--yellow)';
      }
    }
  }
}

// Firebase listener
onValue(ref(db,`rooms/${roomId}`),(snap)=>{
  const d=snap.val(); 
  // Debug - show connection status
  // debug title removed
  if(!d) return;
  const tName=team==='a'?d.teamA:d.teamB;
  if(tName){badge.textContent=tName; badge.className=`team-badge badge-${team}`;}
  if(d.questionIndex!==undefined) document.getElementById('q-ind').textContent=bt('questionOf', d.questionIndex);

  // Set waiting screen image if available
  if(d.waitingScreenUrl) {
    // Apply to body background
    document.body.style.backgroundImage = `url('${d.waitingScreenUrl}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    const img = document.getElementById('waiting-img');
    const fallback = document.getElementById('waiting-fallback');
    if(img && img.src !== d.waitingScreenUrl) {
      img.src = d.waitingScreenUrl;
      img.style.display = 'block';
      if(fallback) fallback.style.display = 'none';
    }
  }
  if(d.question){['q-bid','q-ans'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=d.question;});}

  const p=d.phase||'waiting';

  // Phase change
  if(p!==phase) {
    phase=p; locked=false;
    if(bidInterval) cancelAnimationFrame(bidInterval); clearInterval(ansInterval); bidInterval=null;

    if(p==='waiting'){
      showPhase('waiting');
      const conn=d.connected||{};
      document.getElementById('wait-msg').textContent=conn[other]?bt('otherWaiting'):bt('waitMsg');
    }
    else if(p==='ready'){
      // Show waiting message — host controls when bidding starts
      showPhase('waiting');
      document.getElementById('wait-msg').textContent = _lang==='ar' ? '✅ متصل — انتظر المقدّم لبدء المزايدة' : '✅ Connected — waiting for host to start';
    }
    else if(p==='countdown'){
      showPhase('countdown');
      let n=3; const el=document.getElementById('ph-cd-num'); if(el)el.textContent=n;
      const cd=setInterval(()=>{n--;if(el)el.textContent=n>0?n:'🎯';if(n<=0)clearInterval(cd);},1000);
    }
    else if(p==='bidding'){
      myBid=(d.bids?.[team]?.value)||0; lastBidder=null; lastBidCountdownEnd=null;
      showPhase('bidding');
      document.getElementById('bid-val').textContent=0;
      document.getElementById('bid-msg').style.display='none';
      setBidBtns(true);
      // Run bid update immediately to sync state
      handleBidUpdate(d);
    }
    else if(p==='answering'){
      if(d.auctionWinner===team){
        totalAns=d.winningBid||1;
        locked=false;
        clearInterval(ansInterval); ansInterval=null;
        ansGeneration++; // new answering phase = new generation
        const myGen = ansGeneration;

        // Fresh start — always show Start Writing button on phase entry
        submitted = [];
        showPhase('answering');
        const swWrap = document.getElementById('start-writing-wrap');
        const inWrap = document.getElementById('ans-input-wrap');
        const timerWrap = document.getElementById('ans-timer-wrap');
        if(swWrap) swWrap.style.display='flex';
        if(inWrap) inWrap.style.display='none';
        if(timerWrap) timerWrap.style.display='none';
        renderAnswers();

        // Wait 600ms for Firebase reset to propagate, then check state
        setTimeout(() => {
          if(ansGeneration !== myGen) return; // another phase arrived — ignore
          // Re-read current Firebase state
          import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js").then(({ get })=>{
            get(ref(db,`rooms/${roomId}`)).then(snap=>{
              if(ansGeneration !== myGen) return;
              const fd = snap.val()||{};
              if(fd.writingStarted && !fd.answersConfirmed && fd.answerTimerEnd) {
                // Writing is in progress — restore state
                submitted = fd.answers||[];
                if(swWrap) swWrap.style.display='none';
                if(inWrap) inWrap.style.display='flex';
                if(timerWrap) timerWrap.style.display='flex';
                renderAnswers();
                startAnsTimer(fd.answerTimerEnd - serverOffset);
              } else if(fd.writingStarted && fd.answersConfirmed) {
                // Already confirmed — show done state
                submitted = fd.answers||[];
                renderAnswers();
                lockAnswering();
              }
              // else: writingStarted=false → keep showing Start Writing button ✓
            });
          });
        }, 600);
      } else {
        showPhase('logo');
        document.getElementById('logo-msg').textContent=bt('otherWriting');
      }
    }
    else if(p==='nextquestion'){
      if(bidInterval) cancelAnimationFrame(bidInterval); clearInterval(ansInterval); bidInterval=null; ansInterval=null;
      showPhase('logo');
      document.getElementById('logo-msg').textContent=bt('waitNext');
      myBid=0; submitted=[]; locked=false; lastBidder=null; lastBidCountdownEnd=null; ansGeneration++;
    }
    else if(p==='done'){
      showPhase('logo');
      document.getElementById('logo-msg').innerHTML = bt('auctionEnd')+'<br><span style="font-size:16px;color:rgba(255,255,255,0.5);font-weight:400">'+(_lang==='en'?'You can close this screen':'يمكنك إغلاق هذه الشاشة')+'</span>';
    }
  }

  // Same phase updates
  if(p==='waiting'){
    const conn=d.connected||{};
    document.getElementById('wait-msg').textContent=conn[other]?bt('otherWaiting'):bt('waitMsg');
  }
  // ready phase handled above
  if(p==='bidding') handleBidUpdate(d);
  if(p==='answering'&&d.auctionWinner===team){
    if(d.writingStarted) {
      submitted=d.answers||[]; renderAnswers();
      if(d.answersConfirmed) { clearInterval(ansInterval); ansInterval=null; if(!locked) lockAnswering(); }
    }
  }
});

// Listen for lang from main game
onValue(ref(db, `sessions/${sessionId}/lang`), snap => {
  const l = snap.val();
  if (l) { _lang = l; applyBidLang(); }
});


// ── Shutdown: when main game closes, show waiting background ──
onValue(ref(db, `sessions/${sessionId}/shutdown`), snap => {
  if (!snap.val()) return;
  document.body.style.backgroundImage = document.body.style.backgroundImage || '';
  // Fade out all content
  document.querySelectorAll('.content, #ph-waiting, #ph-ready, #ph-countdown, #ph-bidding, #ph-answering, #ph-logo').forEach(el => {
    if (el) el.style.opacity = '0';
  });
  // Show full-screen waiting background
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#060d1f;background-size:cover;background-position:center;transition:opacity 0.5s';
  if (document.body.style.backgroundImage) overlay.style.backgroundImage = document.body.style.backgroundImage;
  const logo = document.createElement('div');
  logo.style.cssText = 'font-family:Cairo,sans-serif;font-size:clamp(36px,10vw,72px);font-weight:900;color:#FAC70A;text-shadow:0 0 30px rgba(250,199,10,0.6),0 0 60px rgba(250,199,10,0.3);letter-spacing:4px;animation:pulse 2s infinite;text-align:center';
  logo.textContent = '3AL BALCON';
  overlay.appendChild(logo);
  document.body.appendChild(overlay);
});

</script>
